name: Contributions Implementation Driver

on:
  push:
    branches:
      - feat/contributions-resource-accounting-20260819
    paths:
      - scripts/apply-contributions-workstream.py
      - .github/workflows/contributions-implementation-driver.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-contributions-workstream.py
      - .github/workflows/contributions-implementation-driver.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions-implementation-driver
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/contributions-resource-accounting-20260819
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Generate, qualify and self-report
        shell: bash
        run: |
          set +e
          git config user.name "Wewed Contributions Bot"
          git config user.email "actions@users.noreply.github.com"
          START_HEAD="$(git rev-parse HEAD)"
          LOG=/tmp/contributions-driver.log

          {
            set -euxo pipefail
            git fetch origin main
            git merge --no-edit origin/main
            python3 scripts/apply-contributions-workstream.py
            bun install --frozen-lockfile
            bunx prisma format --schema prisma/schema.prisma
            bunx prisma validate --schema prisma/schema.prisma
            bunx prisma generate --schema prisma/schema.prisma
            bunx prisma migrate deploy --schema prisma/schema.prisma
            bunx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
            bun test src/lib/contributions.test.ts src/lib/contributions-source-contract.test.ts
            bun run build
            git diff --check
          } >"$LOG" 2>&1
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            cp "$LOG" /tmp/contributions-driver-preserved.log
            git reset --hard "$START_HEAD"
            mkdir -p docs
            {
              echo "# Contributions Driver Diagnostic"
              echo
              echo "Generated automatically from failed qualification on commit \`$START_HEAD\`."
              echo
              echo '```text'
              tail -n 500 /tmp/contributions-driver-preserved.log
              echo '```'
            } > docs/CONTRIBUTIONS_DRIVER_DIAGNOSTIC.md
            git add docs/CONTRIBUTIONS_DRIVER_DIAGNOSTIC.md
            git commit -m "Record Contributions qualification diagnostic"
            git push origin HEAD:feat/contributions-resource-accounting-20260819
            exit "$STATUS"
          fi

          rm -f docs/CONTRIBUTIONS_DRIVER_DIAGNOSTIC.md
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement Contributions resource accounting phases 1-7"
          fi
          git push origin HEAD:feat/contributions-resource-accounting-20260819
