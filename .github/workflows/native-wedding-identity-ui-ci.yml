name: Native Wedding Identity UI CI

on:
  push:
    branches:
      - native-mobile/wedding-identity-ui-20260918
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - '.github/workflows/native-wedding-identity-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wedding-identity-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Swift package tests and build
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Swift tests
        working-directory: apps/ios
        run: swift test

      - name: Build Swift package
        working-directory: apps/ios
        run: swift build

  android:
    name: Android unit tests and debug assembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Android unit tests and assemble
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
