name: Native Wedding Identity UI CI

on:
  push:
    branches:
      - native-mobile/wedding-identity-ui-20260918
      - native-mobile/role-architecture-p0-20260919
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - '.github/workflows/native-wedding-identity-ui-ci.yml'
      - '.github/scripts/verify-android-local-package.sh'
  workflow_dispatch:

permissions:
  contents: read

# Exact-head qualification for the six-screen reference shell.

concurrency:
  group: native-wedding-identity-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-contract:
    name: Wireframe and real-shadow UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject demo and wireframe-only literals
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/ios/Wewed/Views/Home/WeddingReferenceHomeView.swift
            apps/ios/Wewed/Views/Planner/WeddingReferencePlannerView.swift
            apps/ios/Wewed/Views/Guests/WeddingReferenceGuestsView.swift
            apps/ios/Wewed/Views/Invitation/IvoryInvitationView.swift
            apps/ios/Wewed/Views/Pass/WeddingReferencePassView.swift
            apps/ios/Wewed/Views/Shared/WeddingReferenceMoreView.swift
            apps/android/app/src/main/java/pro/wewed/app/ui/home/WeddingReferenceHomeScreen.kt
            apps/android/app/src/main/java/pro/wewed/app/ui/planner/WeddingReferencePlannerScreen.kt
            apps/android/app/src/main/java/pro/wewed/app/ui/guests/WeddingReferenceGuestsScreen.kt
            apps/android/app/src/main/java/pro/wewed/app/ui/invitation/IvoryInvitationScreen.kt
            apps/android/app/src/main/java/pro/wewed/app/ui/pass/WeddingReferencePassScreen.kt
            apps/android/app/src/main/java/pro/wewed/app/ui/more/WeddingReferenceMoreScreen.kt
          )
          banned='Stella Ndlovu|John Moyo|Appa Tawanda|Brian Kamau|Lindiwe Ncube|Tariro Chikomo|Jane & Michael Doe|Tariro & Shadreck|Guest G001|Reference Venue|Reference City|68% complete|14 NOV 2026|C & K|C&K|Programme locked|7 booked'
          if grep -En "$banned" "${files[@]}"; then
            echo "FAIL: demo/wireframe-only literal found in production-derived reference UI."
            exit 1
          fi

      - name: Reject fabricated role-shell content and persona switching
        shell: bash
        run: |
          set -euo pipefail
          # Role shells must render repository data or honest empty states; these strings were typed-in
          # placeholders, fake success messages, invented contributor names or developer role switching.
          banned='ECDSA P-256 Offline Active|Worksheet exported successfully|Active Weddings Monitored|wewed\.mobile@pro\.wewed|wewed-admin-2026|Tinashe Moyo|Chipo Ndlovu|Farai Mutasa|Nyasha Gumbo|DevelopmentPersona|PersonaPicker|Switch Persona|"Guest Contributor"'
          if grep -rEn "$banned" apps/android/app/src/main apps/ios/Wewed --include='*.kt' --include='*.swift' --exclude-dir=Tests; then
            echo "FAIL: fabricated or persona-switching content found in native source."
            exit 1
          fi

      - name: Reject unsupported Shadow operational claims
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/ios/Wewed/Services/PrivateRealShadowWeddingRepository.swift
            apps/android/app/src/main/java/pro/wewed/app/services/PrivateRealShadowWeddingRepository.kt
            apps/ios/Wewed/Services/ShadowReferencePlannerRepository.swift
            apps/android/app/src/main/java/pro/wewed/app/services/ShadowReferencePlannerRepository.kt
          )
          banned='expectedTime: "12:00"|expectedTime = "12:00"|7 vendors booked|Programme locked|152 guests unseated|8 urgent'
          if grep -En "$banned" "${files[@]}"; then
            echo "FAIL: unsupported Shadow operational claim found."
            exit 1
          fi

      - name: Require six-screen acceptance anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -R --fixed-strings 'home-root' apps/ios/Wewed/Views/Home apps/android/app/src/main/java/pro/wewed/app/ui/home
          grep -R --fixed-strings 'planner-root' apps/ios/Wewed/Views/Planner apps/android/app/src/main/java/pro/wewed/app/ui/planner
          grep -R --fixed-strings 'guests-root' apps/ios/Wewed/Views/Guests apps/android/app/src/main/java/pro/wewed/app/ui/guests
          grep -R --fixed-strings 'ivory-invitation-root' apps/ios/Wewed/Views/Invitation apps/android/app/src/main/java/pro/wewed/app/ui/invitation
          grep -R --fixed-strings 'wedding-pass-qr' apps/ios/Wewed/Theme apps/android/app/src/main/java/pro/wewed/app/ui/pass
          grep -R --fixed-strings 'more-root' apps/ios/Wewed/Views/Shared apps/android/app/src/main/java/pro/wewed/app/ui/more

  ios:
    name: iOS Swift package tests and build
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Swift tests
        working-directory: apps/ios
        run: swift test

      - name: Build Swift package
        working-directory: apps/ios
        run: swift build

      # swift build on macOS cannot catch iOS-only API problems; compile the app for the simulator too.
      - name: Compile app for iOS Simulator
        working-directory: apps/ios
        run: |
          xcodebuild -scheme WewedApp -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ci-sim -quiet build

  android:
    name: Android unit tests and debug assembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Android unit tests and assemble
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify local Android identity cannot replace Play
        run: bash .github/scripts/verify-android-local-package.sh apps/android/app/build/outputs/apk/debug pro.wewed.app.dev
