name: Phase 8 Reviewer Closure Qualification

on:
  push:
    branches:
      - backend/native-workspace-parity-phase8-20260922
    paths:
      - 'src/app/api/native/**'
      - 'src/lib/native-domain-context*'
      - '.github/workflows/phase8-reviewer-closure.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-phase8-reviewer-secret-not-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Migrate disposable database
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Phase 8 domain and carried authority tests
        run: >
          bun test
          src/lib/native-domain-context.integration.test.ts
          src/lib/production-authority/production-authority.integration.test.ts
          src/lib/production-authority/onboarding-reconciliation.integration.test.ts
          src/lib/wedding-guest-session-v2.test.ts
          src/lib/wedding-guest-portfolio-contract.test.ts
          src/lib/wedding-guest-projection-v2.test.ts
      - name: Production build
        run: bun run build
