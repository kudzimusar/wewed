name: Communications CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.env.example'
      - 'vercel.json'
      - 'docs/WEWED_COMMUNICATIONS_*.md'
      - 'docs/WEWED_WHATSAPP_*.md'
      - 'prisma/migrations/**'
      - 'scripts/communications-postgres-integration.sql'
      - 'scripts/communications-rate-limit-postgres-integration.sql'
      - 'scripts/communications-supabase-scheduler.sql'
      - 'scripts/couple-vendor-marketplace-contract.ts'
      - 'src/app/messages/**'
      - 'src/app/api/messages/route.ts'
      - 'src/app/api/communications/**'
      - 'src/app/api/providers/enquiries/**'
      - 'src/app/api/cron/communications-deliveries/**'
      - 'src/app/api/internal/communications/**'
      - 'src/app/api/webhooks/resend/**'
      - 'src/app/api/webhooks/whatsapp/**'
      - 'src/lib/communications*.ts'
      - 'src/lib/communications*.test.ts'
      - 'src/lib/vendor-marketplace-communications*.ts'
      - 'src/lib/communication-channels*.ts'
      - 'src/lib/communication-channels*.test.ts'
      - 'src/lib/whatsapp-cloud-webhook*.ts'
      - 'src/lib/email/resend.ts'
      - 'src/lib/email/resend-webhook.ts'
      - 'src/components/admin/admin-utility-nav.tsx'
      - 'src/components/couple/couple-dashboard.tsx'
      - 'src/components/providers/public-provider-profile.tsx'
      - 'src/components/public/public-account-actions.tsx'
      - 'src/components/wedding/planner-account-dock.tsx'
      - '.github/workflows/communications-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communications-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate private communications foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma public schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Apply all migrations to clean PostgreSQL
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Run communications PostgreSQL contract
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/communications-postgres-integration.sql

      - name: Run communications rate-limit PostgreSQL contract
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/communications-rate-limit-postgres-integration.sql

      - name: Run communications policy and client-state tests
        run: bun test src/lib/communications-policy.test.ts src/lib/communications-client-state.test.ts

      - name: Run Couple Vendor marketplace source contract
        run: bun scripts/couple-vendor-marketplace-contract.ts

      - name: Provide server-only test sentinel
        shell: bash
        run: |
          mkdir -p node_modules/server-only
          printf '%s\n' '{"name":"server-only","version":"0.0.0-test","type":"module","exports":"./index.js"}' > node_modules/server-only/package.json
          printf '%s\n' 'export {};' > node_modules/server-only/index.js

      - name: Run communications rate-limit contracts
        run: bun test src/lib/communications-rate-limit.test.ts

      - name: Run communications channel, scheduler and WhatsApp webhook contracts
        run: bun test src/lib/communication-channels.test.ts src/lib/communication-channels-inbound.test.ts src/lib/whatsapp-cloud-webhook.test.ts src/app/api/webhooks/whatsapp/route.test.ts src/app/api/cron/communications-deliveries/route.test.ts

      - name: Verify Supabase automatic scheduler contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/communications-supabase-scheduler.sql').read_text()
          required = [
              "CREATE EXTENSION IF NOT EXISTS pg_net",
              "CREATE EXTENSION IF NOT EXISTS pg_cron",
              "vault.create_secret",
              "wewed_communications_scheduler_secret",
              "wewed-communications-automatic-dispatch",
              "'* * * * *'",
              "https://wewed.pro/api/cron/communications-deliveries",
              "'Authorization', 'Bearer ' ||",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing automatic scheduler contract fragments: {missing}')
          if 'WEWED_COMMUNICATIONS_DISPATCH_KEY' in text:
              raise SystemExit('Automatic scheduler must not reuse the manual dispatch secret.')
          PY

      - name: Run communications authorization integration
        run: bun test src/lib/communications.integration.test.ts src/lib/vendor-marketplace-communications.integration.test.ts

      - name: Confirm public Prisma schema is untouched
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "origin/${{ github.base_ref }}"...HEAD -- prisma/schema.prisma

      - name: Validate message API wedding isolation contract
        shell: bash
        run: |
          grep -q 'weddingSlugFromRequest(request' src/app/api/messages/route.ts
          grep -q 'resolveWeddingAccessForRequest' src/app/api/messages/route.ts
          grep -q 'if (!access.allowed || !access.wedding)' src/app/api/messages/route.ts
          grep -q "where: { weddingId: resolved.access.wedding.id, isPublic: true }" src/app/api/messages/route.ts
          grep -q "resolved.access.accessKind === 'public'" src/app/api/messages/route.ts
          grep -q 'weddingId: resolved.access.wedding.id' src/app/api/messages/route.ts
          grep -q 'authorToken: resolved.access.guest?.rsvpToken ?? null' src/app/api/messages/route.ts

      - name: Confirm analytics writer does not copy message body
        shell: bash
        run: |
          if grep -nE "metadata:[[:space:]]*\{[^}]*body([,:}])" src/lib/communications.ts; then
            echo "::error::CommunicationEvent metadata must not contain raw message bodies"
            exit 1
          fi

      - name: Confirm channel, webhook, scheduler and rate-limit code do not log sensitive data
        shell: bash
        run: |
          if grep -nE "console\.(log|info|debug|warn|error)" \
            src/lib/communication-channels.ts \
            src/lib/communication-channels-inbound.ts \
            src/lib/communications-rate-limit.ts \
            src/lib/communications-scheduler.ts \
            src/lib/whatsapp-cloud-webhook.ts \
            src/app/api/cron/communications-deliveries/route.ts \
            src/app/api/webhooks/whatsapp/route.ts; then
            echo "::error::Communication transport/webhook/scheduler/rate-limit code must not log message bodies, endpoints, actor keys or provider tokens"
            exit 1
          fi

      - name: Build application
        run: bun run build
