name: NM05M1 Temporary iOS Pass Qualification

on:
  push:
    branches:
      - native-mobile/phase13-ios-pass-card-closure-nm05m1-20260926
    paths:
      - 'apps/ios/**'
      - '.github/workflows/nm05m1-temporary-ios-pass-qualification.yml'

permissions:
  contents: read

concurrency:
  group: nm05m1-ios-pass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Pass source + app build
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Swift tests
        working-directory: apps/ios
        run: swift test

      - name: Swift build
        working-directory: apps/ios
        run: swift build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml

      - name: Build iOS simulator app
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project Wewed.xcodeproj
          -scheme Wewed
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
