name: AI Wedding Architect Price Binding Integration

on:
  push:
    branches: [feature/ai-wedding-architect]
    paths:
      - scripts/apply-wedding-architect-price-bindings.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-wedding-architect
      - run: node scripts/apply-wedding-architect-price-bindings.mjs
      - run: git diff --check
      - run: |
          git config user.name "wewed-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/providers/profile/route.ts src/components/providers/provider-profile-manager.tsx
          git commit -m "Bind provider pricing to wedding requirements"
          git push origin HEAD:feature/ai-wedding-architect
