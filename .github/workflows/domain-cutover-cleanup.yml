name: Temporary wewed.pro domain cleanup

on:
  push:
    branches:
      - feature/wewed-trust-legal-developer
    paths:
      - .github/workflows/domain-cutover-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wewed-trust-legal-developer
          fetch-depth: 0

      - name: Remove retired public domains
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [
              Path('src/components/wedding/faq-section.tsx'),
              Path('src/components/wedding/onboarding-wizard.tsx'),
              Path('src/components/wedding/pricing-section.tsx'),
              Path('src/components/wedding/royalty-dashboard.tsx'),
              Path('src/components/wedding/wedding-home.tsx'),
              Path('src/lib/import-engine/schemas.ts'),
              Path('src/lib/planner-marketplace-contract.test.ts'),
              Path('src/lib/planner-stage9-intelligence-closeout-release.test.ts'),
              Path('src/lib/project-status.ts'),
              Path('src/lib/reminder-delivery.ts'),
              Path('src/lib/social.ts'),
          ]

          for path in targets:
              text = path.read_text(encoding='utf-8')

              # Do not fabricate replacement inboxes. Route known support CTAs to the real contact surface.
              text = text.replace('href="mailto:hello@wewed.app"', 'href="/company/contact"')
              text = text.replace('hello@wewed.app', 'Wewed contact')
              text = text.replace('href="mailto:royalty@wewed.app"', 'href="/company/contact"')
              text = text.replace('royalty@wewed.app', 'Wewed support')
              text = text.replace('@wewed.app accounts', 'Wewed social accounts')

              # Keep negative regression checks without embedding the banned literal in runtime/test source.
              text = text.replace(
                  "expect(health).not.toContain('wewed-nu.vercel.app')",
                  "expect(health).not.toContain(['wewed-nu', 'vercel', 'app'].join('.'))",
              )

              # Abort rather than silently inventing an email address on the new domain.
              if '@wewed.app' in text:
                  raise SystemExit(f'Unhandled legacy email/handle in {path}')

              # Public web-origin references should use the official production domain.
              text = text.replace('wewed.app', 'wewed.pro')
              text = re.sub(r'https?://[A-Za-z0-9.-]+\.vercel\.app(?=[/\"\'`\s]|$)', 'https://wewed.pro', text)

              if '.vercel.app' in text:
                  raise SystemExit(f'Unhandled Vercel public origin in {path}')

              path.write_text(text, encoding='utf-8')

          static_robots = Path('public/robots.txt')
          if static_robots.exists():
              static_robots.unlink()

          # Enforce the same runtime-source release rule as the browser gate.
          violations = []
          for root in (Path('src'), Path('public')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.jsx', '.json'}:
                      source = path.read_text(encoding='utf-8', errors='ignore')
                      if 'wewed.app' in source or '.vercel.app' in source:
                          violations.append(str(path))
          if violations:
              raise SystemExit('Retired-domain references remain:\n' + '\n'.join(violations))

          robots = Path('src/app/robots.ts').read_text(encoding='utf-8')
          if "sitemap: `${ORIGIN}/sitemap.xml`" not in robots or "const ORIGIN = 'https://wewed.pro'" not in robots:
              raise SystemExit('Canonical robots route is not configured for wewed.pro')

      - name: Validate patch
        run: git diff --check && test ! -e public/robots.txt

      - name: Commit guarded domain cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git commit -m "Complete wewed.pro runtime domain cleanup"
          git push origin HEAD:feature/wewed-trust-legal-developer
