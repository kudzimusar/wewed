name: NM05 Temporary iOS Responsive Qualification

on:
  push:
    branches:
      - native-mobile/phase13-ios-ui-overflow-closure-nm05-agent-20260925

permissions:
  contents: read

concurrency:
  group: nm05-ios-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS responsive source + app build
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
      - name: Swift tests
        working-directory: apps/ios
        run: swift test
      - name: Swift build
        working-directory: apps/ios
        run: swift build
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS simulator app
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project Wewed.xcodeproj
          -scheme Wewed
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
