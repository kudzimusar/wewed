name: Phase 13 Native Account UAT RC Qualification

on:
  push:
    branches:
      - release/phase13-native-account-uat-20260924

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-dedicated-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Native account identity tests
        run: bun test src/lib/native-account-session.test.ts src/app/api/native/account/native-account-contract.test.ts
      - name: Production authority pure tests
        run: bun test src/lib/production-authority/grants.test.ts
      - name: Production build
        run: bun run build
      - name: Verify promotion slice remains narrow
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'export const GOVERNED_WEDDING_ACCESS' src/lib/wedding-access.ts
          grep -q 'export const BUSINESS_TEAM_MANAGEMENT_ACCESS' src/lib/wedding-access.ts
          grep -q 'export function resolveWeddingPermissions' src/lib/wedding-access.ts
          grep -q 'unsupported_gate_capability' src/lib/production-authority/contract.ts
          test -f src/app/api/native/account/signin/route.ts
          test -f src/app/api/native/account/authority/route.ts
          test -f src/app/api/native/account/workspace/route.ts
