name: Adaptive Workspace Navigation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-workspace-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Stamped adaptive navigation contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run stamped adaptive navigation regression contract
        run: bun test src/lib/adaptive-workspace-navigation-regression.test.ts

      - name: Lint adaptive navigation implementation
        run: >-
          bunx eslint
          --rule 'react-hooks/set-state-in-effect: off'
          src/app/settings/page.tsx
          src/app/planner/layout.tsx
          src/components/navigation/planner-adaptive-navigation.tsx
          src/components/navigation/planner-route-dialog-escape-guard.tsx
          src/components/navigation/workspace-quick-navigation.tsx
          src/components/notebook/notebook-quick-capture.tsx
          src/components/notebook/notebook-utility-entry.tsx
          src/components/wedding/planner-portal.tsx
          src/components/wedding/planner-workspace.tsx
          src/components/wedding/planner-workspace-stage7.tsx
          src/lib/notebook-events.ts
          src/lib/planner-workspace-events.ts
          src/lib/adaptive-workspace-navigation-regression.test.ts
          tests/e2e/planner-adaptive-navigation.spec.ts
