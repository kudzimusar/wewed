name: NM05 Temporary iOS Guest Visual Fast Lane

on:
  push:
    branches:
      - native-mobile/phase13-ios-ui-overflow-closure-nm05-agent-20260925

permissions:
  contents: read

concurrency:
  group: nm05-guest-visual-fast-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          brew install xcodegen
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build app with CI-only in-process Guest Session fixture
        working-directory: apps/ios
        run: |
          cat > Wewed/AppTarget/NM05VisualFixture.swift <<'SWIFT'
          import Foundation
          import WewedKit

          enum NM05VisualFixture {
              static func coordinator() -> LiveGuestInvitationCoordinator {
                  let configuration = URLSessionConfiguration.ephemeral
                  configuration.protocolClasses = [NM05VisualURLProtocol.self]
                  configuration.httpCookieAcceptPolicy = .never
                  configuration.httpShouldSetCookies = false
                  let client = GuestSessionClient(
                      baseUrl: URL(string: "https://wewed.pro")!,
                      storage: InMemorySecureStorage(),
                      session: URLSession(configuration: configuration)
                  )
                  return LiveGuestInvitationCoordinator(client: client)
              }
          }

          final class NM05VisualURLProtocol: URLProtocol, @unchecked Sendable {
              private static let ww2 = "WW2.wedts26.WWJD0824.0e.66f001ab.8d4ba7eca9ef156da73f31e98456a9eaae676f66e4e33d4afaeb5f36cc5f4e06d612a90d0519d343346872759e675437934043ba97fec6a763b7ae3430d6ab30"
              private static let publicKey = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEPSF40dU2YlZRMbV5EweSiFFtJbrJmwtufFc4Bx2eJrC2erZirTgNiKFYBjAIgZsNpWDsGhWRsxToZUz+mdHSNQ=="

              override class func canInit(with request: URLRequest) -> Bool { true }
              override class func canonicalRequest(for request: URLRequest) -> URLRequest { request }

              override func startLoading() {
                  guard let url = request.url else {
                      finish(status: 500, body: ["success": false])
                      return
                  }

                  let path = url.path
                  let method = request.httpMethod ?? "GET"

                  if path == "/api/weddings/nm05-demo/guest-session", method == "POST" {
                      finish(
                          status: 200,
                          body: [
                              "success": true,
                              "authorized": true,
                              "wedding": ["slug": "nm05-demo"],
                              "guest": [
                                  "id": "guest_nm05",
                                  "name": "Christopher Alexander Wellington"
                              ]
                          ],
                          headers: [
                              "Set-Cookie": "wewed_wedding_guest=nm05session; Path=/; HttpOnly"
                          ]
                      )
                      return
                  }

                  if path == "/api/weddings/nm05-demo/guest-session", method == "GET" {
                      finish(status: 200, body: Self.invitation)
                      return
                  }

                  if path == "/api/weddings/nm05-demo/guest-session", method == "PUT" {
                      finish(status: 200, body: [
                          "success": true,
                          "rsvp": Self.rsvp
                      ])
                      return
                  }

                  if path == "/api/wedding-content" {
                      finish(status: 200, body: [
                          "data": [
                              "content": [
                                  "story": [
                                      "body": "A story of friendship, family, and a celebration shared with the people we love."
                                  ]
                              ]
                          ]
                      ])
                      return
                  }

                  if path == "/api/wedding-day/guest" {
                      finish(status: 200, body: [
                          "data": [
                              "guest": [
                                  "id": "guest_nm05",
                                  "tableNumber": 7,
                                  "tableName": "Table 7 — Family & Friends",
                                  "checkedIn": false,
                                  "household": [
                                      ["attendeeKey": "primary", "attendeeName": "Christopher Alexander Wellington"],
                                      ["attendeeKey": "plus-one", "attendeeName": "Jordan Wellington"]
                                  ]
                              ],
                              "programme": [
                                  [
                                      "id": "ceremony",
                                      "time": "14:00",
                                      "title": "Wedding Ceremony",
                                      "description": "Please be seated ten minutes early.",
                                      "location": "Grand Conservatory"
                                  ],
                                  [
                                      "id": "reception",
                                      "time": "17:30",
                                      "title": "Dinner & Reception",
                                      "description": "Dinner, speeches, and dancing.",
                                      "location": "Riverside Ballroom"
                                  ]
                              ],
                              "announcements": [
                                  [
                                      "id": "arrival",
                                      "title": "Guest arrival",
                                      "body": "Please use the main garden entrance and have your Wedding Pass ready."
                                  ]
                              ]
                          ]
                      ])
                      return
                  }

                  if path == "/api/wedding-day/pass" {
                      finish(status: 200, body: [
                          "data": [
                              "guestId": "guest_nm05",
                              "weddingId": "wedding-nm05",
                              "token": Self.ww2,
                              "publicKeyDerBase64": Self.publicKey
                          ]
                      ])
                      return
                  }

                  finish(status: 404, body: ["success": false])
              }

              override func stopLoading() {}

              private func finish(
                  status: Int,
                  body: [String: Any],
                  headers: [String: String] = [:]
              ) {
                  let data = try! JSONSerialization.data(withJSONObject: body)
                  var responseHeaders = headers
                  responseHeaders["Content-Type"] = "application/json"
                  responseHeaders["Content-Length"] = String(data.count)
                  let response = HTTPURLResponse(
                      url: request.url!,
                      statusCode: status,
                      httpVersion: "HTTP/1.1",
                      headerFields: responseHeaders
                  )!
                  client?.urlProtocol(self, didReceive: response, cacheStoragePolicy: .notAllowed)
                  client?.urlProtocol(self, didLoad: data)
                  client?.urlProtocolDidFinishLoading(self)
              }

              private static let rsvp: [String: Any] = [
                  "attending": true,
                  "mealChoice": "vegetarian",
                  "plusOne": true,
                  "plusOneName": "Jordan Wellington",
                  "plusOneMeal": "vegan",
                  "kidsAttending": false,
                  "kidsCount": 0,
                  "dietaryNotes": "No peanuts",
                  "message": "We are so excited to celebrate with you.",
                  "checkedIn": false
              ]

              private static let invitation: [String: Any] = [
                  "success": true,
                  "authorized": true,
                  "wedding": [
                      "slug": "nm05-demo",
                      "title": "Alexandra & Montgomery",
                      "monogram": "A&M",
                      "tagline": "Forever & Always • 14 December 2026",
                      "date": "2026-12-14T14:00:00",
                      "venue": "The Grand Conservatory at Riverside Manor",
                      "venueCity": "Harare",
                      "venueCountry": "Zimbabwe",
                      "venueMapUrl": "https://maps.apple.com/?q=Riverside+Manor",
                      "invitationCardStyle": "ivory-floral-gold",
                      "invitationCardMessage": "With joyful hearts, we invite you to celebrate this beautiful beginning with us. Your presence, laughter, and love would mean the world as we gather with family and friends for our wedding day.",
                      "rsvpDeadline": "30 November 2026",
                      "childrenPolicy": "welcome"
                  ],
                  "guest": [
                      "id": "guest_nm05",
                      "name": "Christopher Alexander Wellington",
                      "tableNumber": 7,
                      "tableName": "Table 7 — Family & Friends"
                  ],
                  "rsvp": rsvp
              ]
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          p = Path("Wewed/AppTarget/WewedMainApp.swift")
          s = p.read_text()
          old = '''            #if DEBUG
                      if let origin = ProcessInfo.processInfo.environment["WEWED_GUEST_UI_ORIGIN"],'''
          new = '''            #if DEBUG
                      if ProcessInfo.processInfo.environment["WEWED_NM05_VISUAL"] == "1" {
                          GuestOnlyInvitationShellView(
                              coordinator: NM05VisualFixture.coordinator(),
                              initialURL: URL(string: "https://wewed.pro/invite/nm05-demo?rsvp=nm05demo")
                          )
                      } else if let origin = ProcessInfo.processInfo.environment["WEWED_GUEST_UI_ORIGIN"],'''
          if old not in s:
              raise SystemExit("NM05 injection anchor not found")
          p.write_text(s.replace(old, new))
          PY

          xcodegen generate --spec project.yml
          xcodebuild \
            -project Wewed.xcodeproj \
            -scheme Wewed \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/nm05-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Boot simulator
        id: sim
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d["runtimes"] if x.get("isAvailable") and "iOS" in x["identifier"]]; print(a[-1]["identifier"])')"
          DEVICE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d["devicetypes"]; x=next((v for v in a if v["name"]=="iPhone 16 Pro"),None) or next(v for v in a if "iPhone" in v["name"]); print(x["identifier"])')"
          UDID="$(xcrun simctl create NM05-iPhone "$DEVICE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

          python3 - "$UDID" <<'PY'
          import subprocess, sys, time
          udid = sys.argv[1]

          def wait_for_boot(label):
              print(f"Waiting for simulator boot ({label})...", flush=True)
              subprocess.run(
                  ["xcrun", "simctl", "bootstatus", udid, "-b"],
                  check=True,
                  timeout=150,
              )

          try:
              wait_for_boot("attempt 1")
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as error:
              print(f"First boot attempt failed: {error}", flush=True)
              subprocess.run(["xcrun", "simctl", "shutdown", udid], check=False)
              time.sleep(3)
              subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
              wait_for_boot("attempt 2")
          PY

          xcrun simctl install "$UDID" "$RUNNER_TEMP/nm05-derived/Build/Products/Debug-iphonesimulator/Wewed.app"

      - name: Launch Guest app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          (
            SIMCTL_CHILD_WEWED_NM05_VISUAL="1" \
            xcrun simctl launch "$UDID" pro.wewed.app.dev
          ) >"$RUNNER_TEMP/nm05-launch.log" 2>&1 &
          sleep 5
          cat "$RUNNER_TEMP/nm05-launch.log" || true

      - name: Capture Guest screens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/phase13/nm05-ios-ui-overflow-closure-20260925"
          cat > "$RUNNER_TEMP/nm05.yaml" <<'YAML'
          appId: pro.wewed.app.dev
          ---
          - extendedWaitUntil:
              visible:
                id: "invitation-open-button"
              timeout: 15000
          - takeScreenshot: 04_invitation_closed
          - tapOn:
              id: "invitation-open-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-details-button"
              timeout: 7000
          - tapOn:
              id: "invitation-details-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-rsvp"
              timeout: 5000
          - takeScreenshot: 05_invitation_details
          - tapOn:
              id: "invitation-cta-rsvp"
          - extendedWaitUntil:
              visible:
                id: "invitation-rsvp-prompt"
              timeout: 5000
          - takeScreenshot: 02_rsvp
          - tapOn:
              point: "50%,5%"
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-note"
              timeout: 5000
          # Tap the visible Note card itself. Maestro's accessibility-ID tap has proven
          # unreliable for this ScrollView hotspot even though the published bounds are correct.
          - tapOn:
              point: "50%,83%"
          - extendedWaitUntil:
              visible:
                id: "invitation-note-message"
              timeout: 5000
          - takeScreenshot: 03_couple_note
          - tapOn:
              id: "invitation-note-dismiss"
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-pass"
              timeout: 5000
          - tapOn:
              id: "invitation-cta-pass"
          - extendedWaitUntil:
              visible:
                id: "wedding-pass-card"
              timeout: 10000
          - takeScreenshot: 06_pass
          - tapOn: "Home"
          - extendedWaitUntil:
              visible:
                id: "live-guest-hero"
              timeout: 5000
          - assertVisible: "Days"
          - assertVisible: "Hours"
          - assertVisible: "Mins"
          - assertVisible: "Secs"
          - takeScreenshot: 01_home
          - tapOn: "Wedding Day"
          - extendedWaitUntil:
              visible:
                id: "guest-day-programme"
              timeout: 10000
          - takeScreenshot: 07_wedding_day
          - tapOn: "More"
          - extendedWaitUntil:
              visible:
                id: "guest-more-explore"
              timeout: 7000
          - takeScreenshot: 08_more
          YAML
          cd "$GITHUB_WORKSPACE/artifacts/phase13/nm05-ios-ui-overflow-closure-20260925"
          "$HOME/.maestro/bin/maestro" --device "${{ steps.sim.outputs.udid }}" test "$RUNNER_TEMP/nm05.yaml"
          test "$(find . -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" -eq 8

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm05-ios-guest-screens
          path: artifacts/phase13/nm05-ios-ui-overflow-closure-20260925/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nm05-ios-guest-diagnostics
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/nm05-launch.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
