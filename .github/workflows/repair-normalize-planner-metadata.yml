name: Repair partial planner metadata migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type repair-normalize-planner-metadata to confirm the guarded production repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Prisma migration history and deploy pending migrations
    if: ${{ inputs.confirmation == 'repair-normalize-planner-metadata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      DATABASE_URL: ${{ secrets.WEWED_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.WEWED_DATABASE_URL }}
      PLANNER_METADATA_MIGRATION: 20260729131000_normalize_planner_metadata
      TASK_ASSIGNEE_MIGRATION: 20260729134500_normalize_task_assignee
      HANDOFF_MIGRATION: 20260910110000_native_deferred_invitation_handoff

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Verify Wewed database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || {
            echo "::error::WEWED_DATABASE_URL is not configured"
            exit 1
          }
          [[ "$DATABASE_URL" == *"kjigkhjdeymukwradoqu"* ]] || {
            echo "::error::The database URL is not for the Wewed Supabase project"
            exit 1
          }
          [[ "$DATABASE_URL" == *":5432/"* ]] || {
            echo "::error::Use the Supabase session pooler on port 5432"
            exit 1
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma

      - name: Fail closed unless current migration state matches the known recovery point
        shell: bash
        run: |
          set -euo pipefail

          unresolved=$(psql "$DATABASE_URL" -AtF '|' -c \
            "select migration_name || '|' || applied_steps_count from public._prisma_migrations where finished_at is null and rolled_back_at is null order by started_at")
          unresolved_count=$(printf '%s\n' "$unresolved" | sed '/^$/d' | wc -l | tr -d ' ')
          [[ "$unresolved_count" == "1" ]] || {
            echo "::error::Expected exactly one unresolved migration at recovery point; found $unresolved_count"
            printf '%s\n' "$unresolved"
            exit 1
          }

          IFS='|' read -r migration_name applied_steps <<< "$unresolved"
          [[ "$migration_name" == "$TASK_ASSIGNEE_MIGRATION" ]] || {
            echo "::error::Unexpected unresolved migration: $migration_name"
            exit 1
          }
          [[ "$applied_steps" == "0" ]] || {
            echo "::error::Unexpected applied_steps_count for $TASK_ASSIGNEE_MIGRATION: $applied_steps"
            exit 1
          }

          planner_finished=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from public._prisma_migrations where migration_name='$PLANNER_METADATA_MIGRATION' and finished_at is not null and rolled_back_at is null")
          [[ "$planner_finished" == "1" ]] || {
            echo "::error::$PLANNER_METADATA_MIGRATION is not recorded as applied. Refusing chained repair."
            exit 1
          }

          migration_file="prisma/migrations/$TASK_ASSIGNEE_MIGRATION/migration.sql"
          test -f "$migration_file" || { echo "::error::Missing migration file: $migration_file"; exit 1; }
          recorded_checksum=$(psql "$DATABASE_URL" -Atqc \
            "select checksum from public._prisma_migrations where migration_name='$TASK_ASSIGNEE_MIGRATION' and finished_at is null and rolled_back_at is null")
          repository_checksum=$(sha256sum "$migration_file" | awk '{print $1}')
          [[ "$recorded_checksum" == "$repository_checksum" ]] || {
            echo "::error::Task-assignee migration checksum differs from immutable repository history."
            exit 1
          }

      - name: Verify task assignee migration is already fully present in schema
        shell: bash
        run: |
          set -euo pipefail

          column_count=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from information_schema.columns where table_schema='public' and table_name='PlannerTask' and column_name='assigneeUserId'")
          index_count=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from pg_indexes where schemaname='public' and tablename='PlannerTask' and indexname='PlannerTask_assigneeUserId_idx'")
          fk_count=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from pg_constraint where conname='PlannerTask_assigneeUserId_fkey' and conrelid='public.\"PlannerTask\"'::regclass")
          function_count=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='preserve_planner_task_text_assignee'")
          trigger_count=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from pg_trigger where not tgisinternal and tgrelid='public.\"PlannerTask\"'::regclass and tgname='preserve_planner_task_text_assignee_trigger'")

          [[ "$column_count" == "1" ]] || { echo "::error::PlannerTask.assigneeUserId is missing"; exit 1; }
          [[ "$index_count" == "1" ]] || { echo "::error::PlannerTask_assigneeUserId_idx is missing"; exit 1; }
          [[ "$fk_count" == "1" ]] || { echo "::error::PlannerTask_assigneeUserId_fkey is missing"; exit 1; }
          [[ "$function_count" == "1" ]] || { echo "::error::preserve_planner_task_text_assignee() is missing"; exit 1; }
          [[ "$trigger_count" == "1" ]] || { echo "::error::preserve_planner_task_text_assignee_trigger is missing"; exit 1; }

          invalid_fk_rows=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from public.\"PlannerTask\" t left join public.\"User\" u on u.id=t.\"assigneeUserId\" where t.\"assigneeUserId\" is not null and u.id is null")
          [[ "$invalid_fk_rows" == "0" ]] || {
            echo "::error::PlannerTask has $invalid_fk_rows assigneeUserId values without matching User rows."
            exit 1
          }

          echo "All task-assignee migration effects are already present and internally consistent."

      - name: Resolve fully-present task assignee migration as applied
        run: bunx prisma migrate resolve --applied "$TASK_ASSIGNEE_MIGRATION" --schema prisma/schema.prisma

      - name: Verify no unresolved migration rows remain before deploy
        shell: bash
        run: |
          set -euo pipefail
          unresolved=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from public._prisma_migrations where finished_at is null and rolled_back_at is null")
          [[ "$unresolved" == "0" ]] || {
            echo "::error::Unresolved Prisma rows remain after recovery: $unresolved"
            exit 1
          }

      - name: Verify immutable applied migration history
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r migration_name recorded_checksum; do
            [[ -n "$migration_name" ]] || continue
            migration_file="prisma/migrations/$migration_name/migration.sql"
            [[ -f "$migration_file" ]] || {
              echo "::error::Applied migration missing from repository: $migration_name"
              exit 1
            }
            repository_checksum=$(sha256sum "$migration_file" | awk '{print $1}')
            [[ "$repository_checksum" == "$recorded_checksum" ]] || {
              echo "::error::Applied migration checksum differs from repository: $migration_name"
              exit 1
            }
          done < <(psql "$DATABASE_URL" -AtF '|' -c \
            "select migration_name, checksum from public._prisma_migrations where finished_at is not null and rolled_back_at is null order by started_at")

      - name: Deploy all pending main migrations
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Verify deferred invitation handoff schema is live
        shell: bash
        run: |
          set -euo pipefail
          table_name=$(psql "$DATABASE_URL" -Atqc "select to_regclass('private.\"InvitationInstallHandoff\"')")
          [[ "$table_name" == 'private."InvitationInstallHandoff"' ]] || {
            echo "::error::private.InvitationInstallHandoff is still missing after migration deploy."
            exit 1
          }

          handoff_finished=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from public._prisma_migrations where migration_name='$HANDOFF_MIGRATION' and finished_at is not null and rolled_back_at is null")
          [[ "$handoff_finished" == "1" ]] || {
            echo "::error::$HANDOFF_MIGRATION is not recorded as applied."
            exit 1
          }

          unresolved=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from public._prisma_migrations where finished_at is null and rolled_back_at is null")
          [[ "$unresolved" == "0" ]] || {
            echo "::error::Migration deployment completed with unresolved rows: $unresolved"
            exit 1
          }

          echo "Database migration history repaired. Deferred invitation handoff schema is live."
