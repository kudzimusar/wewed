name: TEMP Phase 8 Round 4 Server Qualification

# Master plan WW-NATIVE-PWA-CONVERGENCE-2026-09-22-01, Phase 8 closure round 4, exit item 6.
# Temporary reviewer qualification evidence for this closure round only — removed after a
# successful run, matching the pattern already used in rounds 2/3 (see the completion report
# for the prior rounds' reviewer CI SHAs).

on:
  push:
    branches:
      - backend/native-workspace-parity-phase8-20260922
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-phase8-round4-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Fresh Postgres, Phase 2/7/8 domain tests, Guest regressions, production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed_phase8_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed_phase8_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed_phase8_ci?schema=public
      AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed_phase8_ci?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Apply full migration chain to a fresh database
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Phase 2 production-authority regression (disposable DB)
        run: bun test src/lib/production-authority/production-authority.integration.test.ts

      - name: Phase 7 onboarding-reconciliation regression (disposable DB)
        run: bun test src/lib/production-authority/onboarding-reconciliation.integration.test.ts

      - name: Phase 8 native-domain tests — Tasks/Budget/Guests/Seating/Timeline/Vendors/Contracts/Deal-Room/Vault/Contributions/Admin/Vendor-engagement same-grant-multi-engagement/PWA-native equivalence (disposable DB)
        run: bun test src/lib/native-domain-context.integration.test.ts

      - name: Guest Session v2 regression
        run: bun test src/lib/wedding-guest-session-v2.test.ts

      - name: Guest projection v2 regression
        run: bun test src/lib/wedding-guest-projection-v2.test.ts

      - name: Full bun test src regression (informational — compare pass/fail/error counts against the documented clean baseline; this repo's own CI convention runs named suites individually rather than gating on this blanket command because of pre-existing, unrelated failures)
        continue-on-error: true
        run: bun test src

      - name: Production application build
        run: bun run build
