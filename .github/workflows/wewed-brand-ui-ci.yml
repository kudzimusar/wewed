name: Wewed Brand UI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wewed-brand-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-contract:
    name: Validate shared Wewed identity wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Wewed brand UX contract
        run: bun test src/lib/wewed-brand-ux-contract.test.ts
