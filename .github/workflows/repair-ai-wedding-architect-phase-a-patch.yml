name: Repair AI Wedding Architect Phase A Patch

on:
  push:
    branches: [feature/ai-wedding-architect]
    paths:
      - scripts/repair-ai-wedding-architect-phase-a-patch.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-wedding-architect
      - run: node scripts/repair-ai-wedding-architect-phase-a-patch.mjs
      - run: git diff --check
      - run: |
          if git diff --quiet; then
            echo "Repair produced no source change."
            exit 1
          fi
          git config user.name "wewed-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/app/api/providers/profile/route.ts \
            src/components/providers/provider-profile-manager.tsx
          git commit -m "Harden provider AI-readiness confirmation semantics"
          git push origin HEAD:feature/ai-wedding-architect
