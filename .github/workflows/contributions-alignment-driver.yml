name: Contributions Alignment Driver

on:
  push:
    branches:
      - fix/contributions-planner-alignment-20260819
    paths:
      - scripts/contributions-alignment-driver.py
      - .github/workflows/contributions-alignment-driver.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/contributions-planner-alignment-20260819
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: python3 scripts/contributions-alignment-driver.py
      - run: bun install --frozen-lockfile
      - run: bun add --no-save --exact @playwright/test@1.55.0
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - run: bun test src/lib/contributions.test.ts src/lib/contributions-source-contract.test.ts src/lib/contributions-db.test.ts
      - run: bun run build
      - run: bash scripts/install-playwright-chromium-ci.sh
      - run: bunx playwright test tests/e2e/planner-contributions.spec.ts
      - run: git diff --check
      - name: Commit qualified alignment
        run: |
          rm scripts/contributions-alignment-driver.py .github/workflows/contributions-alignment-driver.yml
          git config user.name "Wewed Contributions Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Contributions into canonical Planner UI"
          git push origin HEAD:fix/contributions-planner-alignment-20260819
