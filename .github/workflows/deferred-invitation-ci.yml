name: Native Deferred Invitation CI

on:
  pull_request:
    paths:
      - 'android/**'
      - 'prisma/migrations/20260910110000_native_deferred_invitation_handoff/**'
      - 'src/app/api/invitations/install-handoff/**'
      - 'src/app/invite/[slug]/open/**'
      - 'src/app/invite/resume/**'
      - 'src/components/wedding/invitation-app-handoff.tsx'
      - 'src/lib/invitation-install-handoff.ts'
      - 'src/lib/invitation-install-handoff.integration.test.ts'
      - 'src/lib/invitation-links.ts'
      - 'src/lib/invitation-links.test.ts'
      - '.github/workflows/deferred-invitation-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'prisma/migrations/20260910110000_native_deferred_invitation_handoff/**'
      - 'src/app/api/invitations/install-handoff/**'
      - 'src/app/invite/[slug]/open/**'
      - 'src/app/invite/resume/**'
      - 'src/components/wedding/invitation-app-handoff.tsx'
      - 'src/lib/invitation-install-handoff.ts'
      - 'src/lib/invitation-install-handoff.integration.test.ts'
      - 'src/lib/invitation-links.ts'
      - 'src/lib/invitation-links.test.ts'
      - '.github/workflows/deferred-invitation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deferred-invitation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-contract:
    name: Validate deferred invitation server contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_TELEMETRY_DISABLED: 1
      ANDROID_DEFERRED_INVITATION_HANDOFF: '1'
      WEWED_INVITATION_HANDOFF_TTL_SECONDS: '86400'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and generate Prisma client
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations to clean PostgreSQL
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Confirm public Prisma schema has no migration drift
        run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Run invitation link privacy tests
        run: bun test src/lib/invitation-links.test.ts

      - name: Run deferred handoff PostgreSQL integration tests
        run: bun test src/lib/invitation-install-handoff.integration.test.ts

      - name: Reject TypeScript errors in deferred invitation files
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit --pretty false > /tmp/wewed-tsc.log 2>&1
          TSC_STATUS=$?
          set -e

          if [ "$TSC_STATUS" -eq 0 ]; then
            echo "Repository TypeScript check is clean."
            exit 0
          fi

          DEFERRED_ERRORS=$(grep -E '^(src/app/api/invitations/install-handoff/|src/app/invite/\[slug\]/open/|src/app/invite/resume/|src/components/wedding/invitation-app-handoff\.tsx|src/lib/invitation-(install-handoff|links)(\.integration\.test|\.test)?\.ts)' /tmp/wewed-tsc.log || true)
          if [ -n "$DEFERRED_ERRORS" ]; then
            echo "TypeScript errors found in deferred invitation files:"
            echo "$DEFERRED_ERRORS"
            exit 1
          fi

          echo "Repository-wide TypeScript has pre-existing errors outside this feature; none are in deferred invitation files."

  android-wrapper:
    name: Compile Android TWA Install Referrer wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile Android debug and release bundles
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Confirm native release identifiers
        run: |
          grep -q "versionCode 2" android/app/build.gradle
          grep -q "versionName \"2\"" android/app/build.gradle
          grep -q "com.android.installreferrer:installreferrer:2.2" android/app/build.gradle
          grep -q "https://wewed.pro/invite/resume" android/app/src/main/java/pro/wewed/app/InstallReferrerHandoff.java
          test -f android/app/build/outputs/bundle/release/app-release.aab
