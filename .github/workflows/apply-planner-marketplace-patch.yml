name: Apply Planner Marketplace Patch

on:
  push:
    branches:
      - feature/planner-marketplace-secure-appointment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/planner-marketplace-secure-appointment
      - name: Materialize reviewed implementation
        shell: bash
        run: |
          cat > /tmp/wewed-marketplace-patch.b64 <<'PATCH'
[... ELLIPSIZATION ...]
PATCH
          base64 -d /tmp/wewed-marketplace-patch.b64 > /tmp/wewed-marketplace-patch.tar.gz
          tar -xzf /tmp/wewed-marketplace-patch.tar.gz -C .
          rm -f .github/workflows/apply-planner-marketplace-patch.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add secure planner marketplace and appointment flow'
          git push origin HEAD:feature/planner-marketplace-secure-appointment
