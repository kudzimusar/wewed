name: Phase 13 Android App Link Parity Qualification

on:
  push:
    branches:
      - native-mobile/release-identity-deeplinks-phase13-20260924

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build ephemeral-signed Release AAB
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/phase13-ci.jks" -storepass phase13test -keypass phase13test -alias phase13ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Phase13 CI,O=Wewed Test,C=JP"
          WEWED_UPLOAD_STORE_FILE="$RUNNER_TEMP/phase13-ci.jks" \
          WEWED_UPLOAD_STORE_PASSWORD=phase13test \
          WEWED_UPLOAD_KEY_ALIAS=phase13ci \
          WEWED_UPLOAD_KEY_PASSWORD=phase13test \
          ./gradlew bundleRelease --no-daemon
      - name: Verify merged Release App Link contract
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*release*' | xargs -r grep -l 'android:autoVerify="true"' | head -n 1)"
          test -n "$manifest"
          grep -q 'android:host="wewed.pro"' "$manifest"
          grep -q 'android:pathPrefix="/invite/"' "$manifest"
          grep -q 'android:path="/pass"' "$manifest"
          grep -q 'android:pathPrefix="/pass/"' "$manifest"
          grep -q 'android:pathPrefix="/w/"' "$manifest"
          grep -q 'android:pathPrefix="/planner/"' "$manifest"
          grep -q 'android:pathPrefix="/vendor/"' "$manifest"
          grep -q 'android:pathPrefix="/gate/"' "$manifest"
          grep -q 'android:pathPrefix="/wedding/"' "$manifest"
          ! grep -q 'android:pathPrefix="/i/"' "$manifest"
          ! grep -q 'android:pathPrefix="/admin/"' "$manifest"
          test -f app/build/outputs/bundle/release/app-release.aab
