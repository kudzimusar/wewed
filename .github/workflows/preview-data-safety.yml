name: Preview Data Safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/worksheet-seating-20260804
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-data-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shared-data previews are read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run preview data safety contract
        run: bun test src/lib/preview-write-safety.test.ts
