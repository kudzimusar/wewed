name: Production Integration Hardening CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-integration-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-hardening:
    name: canonical callbacks and webhook security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production integration hardening contracts
        run: bun test src/lib/production-integration-hardening.test.ts src/lib/email/mailbox-config.test.ts
