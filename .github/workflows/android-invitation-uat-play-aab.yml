name: Android Invitation UAT Play AAB

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/app/api/uat/assetlinks/route.ts'
      - 'src/app/api/invitations/**'
      - 'src/app/invite/**'
      - 'src/lib/invitation-install-handoff.ts'
      - 'src/lib/physical-invitation-install-handoff.ts'
      - 'next.config.ts'
      - '.github/workflows/android-invitation-uat-play-aab.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Google Play versionCode. Must be greater than every existing pro.wewed.app versionCode.'
        required: true
        default: '7'
        type: string
      version_name:
        description: 'Base Android versionName; -uat is appended to the Play UAT variant.'
        required: true
        default: '2.0.4'
        type: string

permissions:
  contents: read

concurrency:
  group: android-invitation-uat-play-aab-${{ github.ref }}
  cancel-in-progress: false

env:
  WEWED_ANDROID_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '7' }}
  WEWED_ANDROID_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '2.0.4' }}

jobs:
  bundle-contract:
    name: Build release-grade UAT AAB contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify and record exact candidate SHA
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA" || {
            echo "::error::Checked out $actual but expected $EXPECTED_CANDIDATE_SHA"
            exit 1
          }
          echo "Android UAT AAB exact candidate SHA=$actual"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build UAT Play app bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleUatPlay --no-daemon --stacktrace
      - name: Verify UAT Play bundle contract
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/uatPlay/app-uatPlay.aab
          grep -q 'applicationId "pro.wewed.app"' android/app/build.gradle
          grep -q 'uatPlay {' android/app/build.gradle
          grep -q 'initWith release' android/app/build.gradle
          grep -q 'variantBuilder.minSdk = 24' android/app/build.gradle
          grep -q 'buildConfigField "boolean", "UAT", "true"' android/app/build.gradle
          grep -q 'https://uat.wewed.pro/app?source=google-play-uat' android/app/build.gradle
          grep -q 'buildConfigField "String", "INVITATION_RESUME_ORIGIN", '"'"'"https://uat.wewed.pro"'"'"'' android/app/build.gradle
          grep -q 'BuildConfig.INVITATION_RESUME_ORIGIN' android/app/src/main/java/pro/wewed/app/InstallReferrerHandoff.java
          grep -q 'android.support.customtabs.trusted.LAUNCH_HANDLER_CLIENT_MODE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:value="navigate-existing"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="wewed"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="invite"' android/app/src/main/AndroidManifest.xml
          grep -q 'getStringExtra("wewed_handoff")' android/app/src/main/java/pro/wewed/app/LauncherActivity.java
          grep -q 'checkpoint=native_intent_received' android/app/src/main/java/pro/wewed/app/LauncherActivity.java
          grep -q 'checkpoint=native_resume_uri_ready' android/app/src/main/java/pro/wewed/app/LauncherActivity.java
          UAT_NAV_MANIFEST="$(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*uatPlay*' -print0 | xargs -0 -r grep -l 'LAUNCH_HANDLER_CLIENT_MODE' | head -n 1 || true)"
          test -n "$UAT_NAV_MANIFEST"
          grep -q 'android:value="navigate-existing"' "$UAT_NAV_MANIFEST"
          UAT_MIN_SDK_MANIFEST="$(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*uatPlay*' -print0 | xargs -0 -r grep -l 'android:minSdkVersion="24"' | head -n 1 || true)"
          test -n "$UAT_MIN_SDK_MANIFEST"
          # Local debug/uat builds use suffixed identities; the Play bundle must keep pro.wewed.app.
          UAT_PLAY_MANIFEST="$(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*merged_manifest*uatPlay*' | head -n 1)"
          test -n "$UAT_PLAY_MANIFEST"
          grep -q 'package="pro.wewed.app"' "$UAT_PLAY_MANIFEST"
          unzip -t android/app/build/outputs/bundle/uatPlay/app-uatPlay.aab >/dev/null
      - name: Upload unsigned contract AAB
        uses: actions/upload-artifact@v4
        with:
          name: wewed-uat-play-contract-aab
          path: android/app/build/outputs/bundle/uatPlay/app-uatPlay.aab
          if-no-files-found: error
          retention-days: 7

  signed-candidate:
    # Retired by QRO07-SHIP01 — no longer signs a pro.wewed.app candidate with the upload key.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Retired Play signing path
        run: |
          echo "::error::Retired by QRO07-SHIP01. The only Google Play production authority for pro.wewed.app is apps/android."
          echo "Use the 'Android Native Production Play AAB' workflow (android-native-production-play-aab.yml)."
          exit 1
