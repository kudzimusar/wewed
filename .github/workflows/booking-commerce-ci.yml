name: Booking Commerce CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/vendor-booking-commerce-ai-referral
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-commerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  booking-commerce:
    name: Qualify booking commerce lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-booking-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify booking source contracts
        run: bun scripts/booking-commerce-source-contract.ts

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Apply full migration chain to clean PostgreSQL
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Detect schema drift
        run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Run booking PostgreSQL governance contract
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/booking-commerce-postgres-contract.sql

      - name: Recreate clean database for runtime contracts
        run: |
          dropdb --if-exists -h localhost -U postgres wewed
          createdb -h localhost -U postgres wewed
          bunx prisma migrate deploy --schema prisma/schema.prisma
        env:
          PGPASSWORD: postgres

      - name: Run synthetic gown chair package and add-on UAT
        run: bun scripts/booking-commerce-synthetic-uat.ts

      - name: Run deterministic package and concurrency contract
        run: bun scripts/booking-commerce-concurrency-contract.ts

      - name: Lint booking release surface
        run: >-
          bunx eslint
          src/lib/booking-commerce.ts
          src/lib/booking-governance.ts
          src/lib/booking-resource-engine.ts
          src/lib/booking-amendments.ts
          src/components/providers/provider-booking-form.tsx
          src/components/booking/booking-lifecycle-panel.tsx
          src/app/planner/bookings/manage/page.tsx
          src/app/vendor/availability/page.tsx
          src/app/vendor/bookings/analytics/page.tsx
          src/app/admin/bookings/page.tsx
          src/app/api/admin/bookings/route.ts
          scripts/booking-commerce-concurrency-contract.ts
          scripts/booking-commerce-synthetic-uat.ts
          scripts/booking-commerce-source-contract.ts

      - name: Build production application
        run: bun run build
