name: Vault Contracts Phase 5 CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'prisma/migrations/20260819070000_phase5_wedding_media_archive/**'
      - 'scripts/phase5-wedding-media-archive-postgres-integration.sql'
      - 'src/lib/media/**'
      - 'src/lib/media-phase5.test.ts'
      - 'src/lib/vault/core.ts'
      - 'src/lib/vault/view.ts'
      - 'src/app/api/media/**'
      - 'src/app/planner/media-archive/**'
      - '.github/workflows/vault-contracts-phase5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-contracts-phase5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-media-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma
      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma
      - name: Apply clean database migrations
        run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Run Phase 5 PostgreSQL invariants
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/phase5-wedding-media-archive-postgres-integration.sql
      - name: Run Phase 5 source governance contract
        run: bun test src/lib/media-phase5.test.ts
      - name: Build exact Phase 5 head
        run: bun run build
