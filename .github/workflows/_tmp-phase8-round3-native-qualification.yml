name: TEMP Phase 8 Round 3 Native Qualification

# Master plan WW-NATIVE-PWA-CONVERGENCE-2026-09-22-01, Phase 8 closure round 3, exit item 10.
# Temporary reviewer qualification evidence for this closure round only — removed after a
# successful run, matching the pattern already used earlier in Phase 8 (see the completion
# report for the prior round's reviewer CI SHAs). This targets the real apps/android (Kotlin/
# Gradle) and apps/ios (Swift/Xcode) native workspaces built this phase — NOT the older
# apps/mobile (Expo) app the pre-existing native-mobile-ci.yml/native-gate-g-release.yml target.

on:
  push:
    branches:
      - native-mobile/workspace-parity-phase8-20260922
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-phase8-round3-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests, debug and release assembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

  ios:
    name: iOS swift test/build, XcodeGen, Simulator build, unsigned Release build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: swift test
        run: swift test

      - name: swift build
        run: swift build

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode Simulator build (Debug)
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; data=json.load(sys.stdin)['devices']; ids=[d['udid'] for k,v in data.items() for d in v if 'iPhone' in d['name']]; print(ids[0])")
          xcodebuild -project Wewed.xcodeproj -scheme Wewed -configuration Debug -destination "id=$DEVICE_ID" build

      - name: Xcode unsigned Release/device build
        run: xcodebuild -project Wewed.xcodeproj -scheme Wewed -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
