name: NM05 Temporary iOS Guest Visual Evidence

on:
  push:
    branches:
      - native-mobile/phase13-ios-ui-overflow-closure-nm05-agent-20260925

permissions:
  contents: read

concurrency:
  group: nm05-guest-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          brew install xcodegen
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build app
        working-directory: apps/ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild \
            -project Wewed.xcodeproj \
            -scheme Wewed \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/nm05-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Start Guest Session fixture server
        run: |
          cat > "$RUNNER_TEMP/nm05_stub.py" <<'PY'
          import json
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from urllib.parse import urlparse

          TOKEN = "WW2.wedts26.WWJD0824.0e.66f001ab.8d4ba7eca9ef156da73f31e98456a9eaae676f66e4e33d4afaeb5f36cc5f4e06d612a90d0519d343346872759e675437934043ba97fec6a763b7ae3430d6ab30"
          KEY = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEPSF40dU2YlZRMbV5EweSiFFtJbrJmwtufFc4Bx2eJrC2erZirTgNiKFYBjAIgZsNpWDsGhWRsxToZUz+mdHSNQ=="

          def invitation():
              return {
                "success": True,
                "authorized": True,
                "wedding": {
                  "slug": "nm05-demo",
                  "title": "Alexandra & Montgomery",
                  "monogram": "A&M",
                  "tagline": "Forever & Always • 14 December 2026",
                  "date": "2026-12-14T14:00:00",
                  "venue": "The Grand Conservatory at Riverside Manor",
                  "venueCity": "Harare",
                  "venueCountry": "Zimbabwe",
                  "venueMapUrl": "https://maps.apple.com/?q=Riverside+Manor",
                  "invitationCardStyle": "ivory-floral-gold",
                  "invitationCardMessage": "With joyful hearts, we invite you to celebrate this beautiful beginning with us. Your presence, laughter, and love would mean the world as we gather with family and friends for our wedding day.",
                  "rsvpDeadline": "30 November 2026",
                  "childrenPolicy": "welcome"
                },
                "guest": {
                  "id": "guest_nm05",
                  "name": "Christopher Alexander Wellington",
                  "tableNumber": 7,
                  "tableName": "Table 7 — Family & Friends"
                },
                "rsvp": {
                  "attending": True,
                  "mealChoice": "vegetarian",
                  "plusOne": True,
                  "plusOneName": "Jordan Wellington",
                  "plusOneMeal": "vegan",
                  "kidsAttending": False,
                  "kidsCount": 0,
                  "dietaryNotes": "No peanuts",
                  "message": "We are so excited to celebrate with you.",
                  "checkedIn": False
                }
              }

          class H(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args): pass
              def reply(self, code, obj, session=False):
                  data = json.dumps(obj).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  if session:
                      self.send_header("Set-Cookie", "wewed_wedding_guest=nm05session; Path=/; HttpOnly")
                  self.end_headers()
                  self.wfile.write(data)

              def do_POST(self):
                  if urlparse(self.path).path == "/api/weddings/nm05-demo/guest-session":
                      self.reply(200, {
                        "success": True,
                        "authorized": True,
                        "wedding": {"slug": "nm05-demo"},
                        "guest": {"id": "guest_nm05", "name": "Christopher Alexander Wellington"}
                      }, True)
                  else:
                      self.reply(404, {"success": False})

              def do_PUT(self):
                  if urlparse(self.path).path == "/api/weddings/nm05-demo/guest-session":
                      self.reply(200, {"success": True, "rsvp": invitation()["rsvp"]})
                  else:
                      self.reply(404, {"success": False})

              def do_GET(self):
                  p = urlparse(self.path).path
                  if p == "/api/weddings/nm05-demo/guest-session":
                      self.reply(200, invitation())
                  elif p == "/api/wedding-content":
                      self.reply(200, {"data":{"content":{"story":{"body":"A story of friendship, family, and a celebration shared with the people we love."}}}})
                  elif p == "/api/wedding-day/guest":
                      self.reply(200, {"data":{
                        "guest":{"id":"guest_nm05","tableNumber":7,"tableName":"Table 7 — Family & Friends","checkedIn":False,"household":[
                          {"attendeeKey":"primary","attendeeName":"Christopher Alexander Wellington"},
                          {"attendeeKey":"plus-one","attendeeName":"Jordan Wellington"}]},
                        "programme":[
                          {"id":"ceremony","time":"14:00","title":"Wedding Ceremony","description":"Please be seated ten minutes early.","location":"Grand Conservatory"},
                          {"id":"reception","time":"17:30","title":"Dinner & Reception","description":"Dinner, speeches, and dancing.","location":"Riverside Ballroom"}],
                        "announcements":[{"id":"arrival","title":"Guest arrival","body":"Please use the main garden entrance and have your Wedding Pass ready."}]
                      }})
                  elif p == "/api/wedding-day/pass":
                      self.reply(200, {"data":{"guestId":"guest_nm05","weddingId":"wedding-nm05","token":TOKEN,"publicKeyDerBase64":KEY}})
                  else:
                      self.reply(404, {"success":False})

          ThreadingHTTPServer(("127.0.0.1", 8765), H).serve_forever()
          PY
          python3 "$RUNNER_TEMP/nm05_stub.py" >"$RUNNER_TEMP/nm05-stub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nm05-stub.pid"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/api/weddings/nm05-demo/guest-session >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Boot simulator
        id: sim
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d["runtimes"] if x.get("isAvailable") and "iOS" in x["identifier"]]; print(a[-1]["identifier"])')"
          DEVICE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d["devicetypes"]; x=next((v for v in a if v["name"]=="iPhone 16 Pro"),None) or next(v for v in a if "iPhone" in v["name"]); print(x["identifier"])')"
          UDID="$(xcrun simctl create NM05-iPhone "$DEVICE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/nm05-derived/Build/Products/Debug-iphonesimulator/Wewed.app"

      - name: Launch Guest app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          (
            SIMCTL_CHILD_WEWED_GUEST_UI_ORIGIN="http://127.0.0.1:8765" \
            SIMCTL_CHILD_WEWED_GUEST_UI_LINK="https://wewed.pro/invite/nm05-demo?rsvp=nm05demo" \
            xcrun simctl launch "$UDID" pro.wewed.app.dev
          ) >"$RUNNER_TEMP/nm05-launch.log" 2>&1 &
          sleep 5
          cat "$RUNNER_TEMP/nm05-launch.log" || true

      - name: Capture Guest screens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/phase13/nm05-ios-ui-overflow-closure-20260925"
          cat > "$RUNNER_TEMP/nm05.yaml" <<'YAML'
          appId: pro.wewed.app.dev
          ---
          - extendedWaitUntil:
              visible:
                id: "invitation-open-button"
              timeout: 15000
          - takeScreenshot: 04_invitation_closed
          - tapOn:
              id: "invitation-open-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-details-button"
              timeout: 7000
          - tapOn:
              id: "invitation-details-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-rsvp"
              timeout: 5000
          - takeScreenshot: 05_invitation_details
          - tapOn:
              id: "invitation-cta-rsvp"
          - extendedWaitUntil:
              visible:
                id: "invitation-rsvp-prompt"
              timeout: 5000
          - takeScreenshot: 02_rsvp
          - tapOn:
              point: "50%,5%"
          - tapOn:
              id: "invitation-cta-note"
          - extendedWaitUntil:
              visible:
                id: "invitation-note-message"
              timeout: 5000
          - takeScreenshot: 03_couple_note
          - tapOn:
              id: "invitation-note-dismiss"
          - scrollUntilVisible:
              element:
                id: "invitation-cta-pass"
              direction: DOWN
          - tapOn:
              id: "invitation-cta-pass"
          - extendedWaitUntil:
              visible:
                id: "wedding-pass-card"
              timeout: 10000
          - takeScreenshot: 06_pass
          - tapOn: "Home"
          - extendedWaitUntil:
              visible:
                id: "live-guest-hero"
              timeout: 5000
          - assertVisible: "Days"
          - assertVisible: "Hours"
          - assertVisible: "Mins"
          - assertVisible: "Secs"
          - takeScreenshot: 01_home
          - tapOn: "Wedding Day"
          - extendedWaitUntil:
              visible:
                id: "guest-day-programme"
              timeout: 10000
          - takeScreenshot: 07_wedding_day
          - tapOn: "More"
          - extendedWaitUntil:
              visible:
                id: "guest-more-explore"
              timeout: 7000
          - takeScreenshot: 08_more
          YAML
          cd "$GITHUB_WORKSPACE/artifacts/phase13/nm05-ios-ui-overflow-closure-20260925"
          "$HOME/.maestro/bin/maestro" --device "${{ steps.sim.outputs.udid }}" test "$RUNNER_TEMP/nm05.yaml"
          test "$(find . -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" -eq 8

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm05-ios-guest-screens
          path: artifacts/phase13/nm05-ios-ui-overflow-closure-20260925/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nm05-ios-guest-diagnostics
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/nm05-stub.log
            ${{ runner.temp }}/nm05-launch.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nm05-stub.pid" ]; then kill "$(cat "$RUNNER_TEMP/nm05-stub.pid")" 2>/dev/null || true; fi
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
