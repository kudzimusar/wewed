name: Phase C Provider Parity Patch

on:
  push:
    branches: [feature/ai-wedding-architect-phase-c]
    paths:
      - scripts/phase-c-provider-parity-patch.py
      - .github/workflows/phase-c-provider-parity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-wedding-architect-phase-c
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply guarded source patch
        run: python3 scripts/phase-c-provider-parity-patch.py
      - name: Verify patch syntax and diff
        run: |
          git diff --check
          grep -q 'priceComponentsUseApprovedAutomaticBindings' src/app/api/providers/profile/route.ts
          grep -q 'packageQuantityType' src/app/api/providers/profile/route.ts
          grep -q 'quantityType: string' src/components/providers/provider-profile-manager.tsx
          grep -q 'Wedding quantity for package overage' src/components/providers/provider-profile-manager.tsx
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/providers/profile/route.ts src/components/providers/provider-profile-manager.tsx
          git commit -m 'Align provider package pricing with Wedding Architect quantities'
          git push origin HEAD:feature/ai-wedding-architect-phase-c
