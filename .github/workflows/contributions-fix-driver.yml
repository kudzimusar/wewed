name: Contributions Fix Driver

on:
  push:
    branches:
      - feat/contributions-resource-accounting-20260819
    paths:
      - 'scripts/fix-contributions-build.py'
      - '.github/workflows/contributions-fix-driver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/contributions-resource-accounting-20260819
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply fix
        run: python3 scripts/fix-contributions-build.py
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - run: bun test src/lib/contributions.test.ts src/lib/contributions-source-contract.test.ts src/lib/contributions-db.test.ts
      - run: bun run build
      - run: git diff --check
      - name: Commit qualified fix and remove driver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wewed Contributions Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f scripts/fix-contributions-build.py .github/workflows/contributions-fix-driver.yml
          git add -A
          git commit -m "Fix Contributions build and historical payment reconciliation"
          git push origin HEAD:feat/contributions-resource-accounting-20260819
