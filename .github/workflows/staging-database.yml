name: Validate staging database

on:
  workflow_dispatch:
    inputs:
      reset_seed:
        description: Reset and reseed isolated staging data
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - 'prisma/**'
      - 'scripts/staging-*'
      - 'scripts/verify-migration-state.sh'
      - '.github/workflows/staging-database.yml'

permissions:
  contents: read

concurrency:
  group: staging-database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      WEWED_STAGING_DATABASE_URL: ${{ secrets.WEWED_STAGING_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.WEWED_STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.WEWED_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bash scripts/assert-staging-db.sh
      - name: Apply pending migrations
        run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Verify migration state and drift
        run: bash scripts/verify-migration-state.sh
      - name: Optional deterministic reset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_seed }}
        run: bash scripts/staging-reset.sh
      - name: Data smoke tests
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          select environment, reset_allowed from staging._wewed_environment where id=1;
          select count(*) as weddings from staging."Wedding";
          select count(*) as guests from staging."Guest";
          select count(*) as vendors from staging."Vendor";
          select count(*) as tasks from staging."PlannerTask";
          SQL
