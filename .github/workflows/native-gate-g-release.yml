name: Native Android Gate G Signed Candidate

on:
  workflow_dispatch:
    inputs:
      signed_upload_bundle:
        description: 'Build the exact Gate F-qualified Play-upload AAB using protected Wewed upload-key secrets'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-gate-g-signed-candidate
  cancel-in-progress: false

env:
  QUALIFIED_RELEASE_SHA: 70a27495cef2ef9ee997f513d043a07b86082d7a

jobs:
  signed-upload-aab:
    name: Build exact Gate F-qualified signed Play AAB
    if: inputs.signed_upload_bundle == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_WEWED_API_BASE_URL: https://wewed.pro
      WEWED_ANDROID_VERSION_CODE: '3'
      WEWED_APP_VERSION: 2.0.0
      WEWED_REQUIRE_RELEASE_SIGNING: '1'
      WEWED_UPLOAD_KEYSTORE_BASE64: ${{ secrets.WEWED_UPLOAD_KEYSTORE_BASE64 }}
      WEWED_UPLOAD_STORE_PASSWORD: ${{ secrets.WEWED_UPLOAD_STORE_PASSWORD }}
      WEWED_UPLOAD_KEY_ALIAS: ${{ secrets.WEWED_UPLOAD_KEY_ALIAS }}
      WEWED_UPLOAD_KEY_PASSWORD: ${{ secrets.WEWED_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Check out exact Gate F-qualified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.QUALIFIED_RELEASE_SHA }}
          fetch-depth: 1

      - name: Refuse any candidate other than the qualified SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$QUALIFIED_RELEASE_SHA" || {
            echo "Refusing to sign unqualified SHA: $actual"
            exit 1
          }
          echo "Signing exact Gate F-qualified SHA: $actual"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Materialize protected signing environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WEWED_UPLOAD_KEYSTORE_BASE64:-}" || { echo 'Missing WEWED_UPLOAD_KEYSTORE_BASE64'; exit 1; }
          test -n "${WEWED_UPLOAD_STORE_PASSWORD:-}" || { echo 'Missing WEWED_UPLOAD_STORE_PASSWORD'; exit 1; }
          test -n "${WEWED_UPLOAD_KEY_ALIAS:-}" || { echo 'Missing WEWED_UPLOAD_KEY_ALIAS'; exit 1; }
          test -n "${WEWED_UPLOAD_KEY_PASSWORD:-}" || { echo 'Missing WEWED_UPLOAD_KEY_PASSWORD'; exit 1; }
          printf '%s' "$WEWED_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wewed-upload.jks"
          chmod 600 "$RUNNER_TEMP/wewed-upload.jks"
          {
            printf 'WEWED_UPLOAD_STORE_FILE=%q\n' "$RUNNER_TEMP/wewed-upload.jks"
            printf 'WEWED_UPLOAD_STORE_PASSWORD=%q\n' "$WEWED_UPLOAD_STORE_PASSWORD"
            printf 'WEWED_UPLOAD_KEY_ALIAS=%q\n' "$WEWED_UPLOAD_KEY_ALIAS"
            printf 'WEWED_UPLOAD_KEY_PASSWORD=%q\n' "$WEWED_UPLOAD_KEY_PASSWORD"
          } > "$RUNNER_TEMP/android-signing.env"
          chmod 600 "$RUNNER_TEMP/android-signing.env"
          echo "WEWED_ANDROID_SIGNING_ENV=$RUNNER_TEMP/android-signing.env" >> "$GITHUB_ENV"

      - name: Build and cryptographically verify signed Play candidate
        shell: bash
        run: scripts/build-native-play-aab.sh

      - name: Upload signed Play candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wewed-native-v3-play-upload-aab-${{ env.QUALIFIED_RELEASE_SHA }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove protected signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wewed-upload.jks"
          rm -f "$RUNNER_TEMP/android-signing.env"
