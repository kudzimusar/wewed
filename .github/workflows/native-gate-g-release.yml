name: RETIRED - Native Android Gate G Signed Candidate (Expo)

# QRO07-SHIP01: the Expo app in apps/mobile may no longer produce a signed pro.wewed.app candidate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired Play signing path
        run: |
          echo "::error::Retired by QRO07-SHIP01. The only Google Play production authority for pro.wewed.app is apps/android."
          echo "Use the 'Android Native Production Play AAB' workflow (android-native-production-play-aab.yml)."
          exit 1
