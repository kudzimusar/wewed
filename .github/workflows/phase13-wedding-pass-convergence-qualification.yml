name: Phase 13 Wedding Pass Convergence Qualification

on:
  push:
    branches:
      - backend/phase13-wedding-pass-convergence-20260925

permissions:
  contents: read

concurrency:
  group: phase13-wedding-pass-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma and apply migrations
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run invitation and WW2 route contracts
        run: |
          bun test src/lib/personal-invitation-mobile-entry.test.ts
          bun test src/lib/wedding-day-key-preflight.test.ts
          bun test src/lib/wedding-day-routes.integration.test.ts

      - name: Reject TypeScript errors in Wedding Pass convergence files
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit --pretty false > /tmp/wewed-tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          errors="$(grep -E '^(src/(app/api/wedding-day/pass/route|components/wedding/invitation-experience/wedding-guest-pass-dialog|lib/(wedding-day|wedding-day-routes\.integration\.test|personal-invitation-mobile-entry\.test))\.(ts|tsx))' /tmp/wewed-tsc.log || true)"
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "Repository-wide TypeScript exit code: $status. No Wedding Pass convergence file errors found."

      - name: Production build
        run: bun run build
