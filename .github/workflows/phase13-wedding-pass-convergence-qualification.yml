name: Phase 13 Wedding Pass Convergence Qualification

on:
  push:
    branches:
      - backend/phase13-wedding-pass-convergence-20260925

permissions:
  contents: read

concurrency:
  group: phase13-wedding-pass-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma and apply migrations
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run invitation and WW2 route contracts
        run: |
          bun test src/lib/personal-invitation-mobile-entry.test.ts
          bun test src/lib/wedding-day-key-preflight.test.ts
          bun test src/lib/wedding-day-routes.integration.test.ts

      - name: Reject TypeScript errors in Wedding Pass convergence files
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit --pretty false > /tmp/wewed-tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          errors="$(grep -E '^(src/app/api/wedding-day/pass/route\.ts|src/components/wedding/invitation-experience/wedding-guest-pass-dialog\.tsx|src/lib/(wedding-day-routes\.integration\.test|personal-invitation-mobile-entry\.test)\.ts|src/lib/wedding-day\.ts\((66[0-9]|67[0-9]|680),)' /tmp/wewed-tsc.log || true)"
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "Repository-wide TypeScript exit code: $status. No Wedding Pass convergence file errors found."

      - name: Production build
        run: bun run build

      - name: Generate disposable P-256 Wedding Day keys
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /tmp/wewed-ww2-ci.pem
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /tmp/wewed-root-ci.pem
          {
            echo 'WEWED_WEDDING_DAY_WW2_ENABLED=true'
            echo 'WEDDING_DAY_WW2_KEY_ID=ww2-pass-convergence-ci'
            echo 'WEDDING_DAY_ROOT_KEY_ID=root-pass-convergence-ci'
            echo 'WEDDING_DAY_WW2_PRIVATE_KEY_PEM<<WW2_EOF'
            cat /tmp/wewed-ww2-ci.pem
            echo 'WW2_EOF'
            echo 'WEDDING_DAY_ROOT_PRIVATE_KEY_PEM<<ROOT_EOF'
            cat /tmp/wewed-root-ci.pem
            echo 'ROOT_EOF'
          } >> "$GITHUB_ENV"

      - name: Install Chromium
        run: bash scripts/install-playwright-chromium-ci.sh

      - name: Start production-built Wewed for browser pass UAT
        shell: bash
        run: |
          PORT=3000 bun run start > /tmp/wewed-pass-convergence.log 2>&1 &
          echo $! > /tmp/wewed-pass-convergence.pid
          for attempt in $(seq 1 90); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/manifest.json || true)"
            if [ "$status" != "000" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/wewed-pass-convergence.log || true
          exit 1

      - name: Run Ivory-to-WW2 browser UAT
        env:
          WEWED_UAT_BASE_URL: http://127.0.0.1:3000
        run: bunx playwright test --config=e2e/wedding-pass-convergence.playwright.config.mjs

      - name: Print sanitized pass UAT log on failure
        if: failure()
        shell: bash
        run: |
          perl -pe 's/([?&](?:rsvp|h)=)[^&\s]+/${1}[REDACTED]/g' /tmp/wewed-pass-convergence.log || true

      - name: Stop pass UAT server
        if: always()
        run: |
          if [ -f /tmp/wewed-pass-convergence.pid ]; then
            kill "$(cat /tmp/wewed-pass-convergence.pid)" || true
          fi
