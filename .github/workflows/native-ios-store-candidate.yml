name: Native iOS Store Candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact qualified commit SHA to build for TestFlight/App Store
        required: true
        type: string
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: native-ios-store-candidate
  cancel-in-progress: false

jobs:
  request-eas-build:
    name: Request exact-SHA iOS EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.WEWED_EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.WEWED_EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.WEWED_EXPO_OWNER }}
    steps:
      - name: Check out exact requested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Refuse ambiguous or missing release inputs
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.release_sha }}" || {
            echo "::error::Requested SHA does not match checked out commit: $actual"
            exit 1
          }
          test -n "${EXPO_TOKEN:-}" || { echo "::error::Missing WEWED_EXPO_TOKEN"; exit 1; }
          test -n "${EXPO_PROJECT_ID:-}" || { echo "::error::Missing WEWED_EXPO_PROJECT_ID"; exit 1; }
          test -n "${EXPO_OWNER:-}" || { echo "::error::Missing WEWED_EXPO_OWNER"; exit 1; }

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install native dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile

      - name: Run native quality gates
        working-directory: apps/mobile
        run: |
          bun run deps:check
          bun run test:unit
          bun run typecheck
          bun run lint
          bun run export:ios

      - name: Request EAS iOS candidate
        working-directory: apps/mobile
        run: |
          bunx eas-cli@latest build \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait
