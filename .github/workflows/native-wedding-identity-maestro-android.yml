name: Native Wedding Identity Maestro Android

on:
  push:
    branches:
      - native-mobile/wedding-identity-ui-20260918
      - native-mobile/role-architecture-p0-20260919
    paths:
      - 'apps/android/**'
      - '.maestro/native-*.yaml'
      - '.github/workflows/native-wedding-identity-maestro-android.yml'
      - '.github/scripts/verify-android-local-package.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wedding-identity-maestro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-maestro:
    name: Sanitized Android Maestro qualification (roles, journeys, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep private-real flows out of CI
        shell: bash
        run: |
          set -euo pipefail
          # .maestro/private-real/* need the local private snapshot and must never run or upload in CI.
          if grep -rn 'private-real/' .github/workflows; then
            echo "FAIL: a workflow references local-only private-real Maestro flows."
            exit 1
          fi

      - name: Build native Android debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify local Android identity cannot replace Play
        run: bash .github/scripts/verify-android-local-package.sh apps/android/app/build/outputs/apk/debug pro.wewed.app.dev

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: '2.7.0'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run sanitized Shadow journeys and role flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant pro.wewed.app.dev android.permission.CAMERA || true
            maestro test .maestro/native-shadow-journey.yaml
            maestro test .maestro/native-shadow-invitation-accept.yaml
            maestro test .maestro/native-shadow-invitation-decline.yaml
            maestro test .maestro/native-wedding-journey.yaml
            maestro test .maestro/native-role-separation.yaml
            maestro test .maestro/native-planner-workspace.yaml
            maestro test .maestro/native-role-shells.yaml
            maestro test .maestro/native-wireframe-screenshots.yaml

      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wedding-identity-maestro-android-failure
          path: |
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 14


      # Sanitized (pseudonymous) captures only. These are never evidence of private-real fidelity.
      - name: Collect sanitized viewport captures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/sanitized-captures"
          find "$GITHUB_WORKSPACE" "$HOME" -type f -name 'sanitized-wireframe-*.png' -print -exec cp -f {} "$GITHUB_WORKSPACE/sanitized-captures/" \; || true
          count="$(find "$GITHUB_WORKSPACE/sanitized-captures" -maxdepth 1 -type f -name 'sanitized-wireframe-*.png' | wc -l | tr -d ' ')"
          echo "Collected $count sanitized viewport captures."
          if [ "$count" -lt 6 ]; then
            echo "FAIL: expected 6 sanitized screenshots, found $count."
            exit 1
          fi

      - name: Upload sanitized viewport captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-sanitized-viewport-captures
          path: sanitized-captures/
          if-no-files-found: error
          retention-days: 14
