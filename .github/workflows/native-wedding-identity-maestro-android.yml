name: Native Wedding Identity Maestro Android

on:
  push:
    branches:
      - native-mobile/wedding-identity-ui-20260918
    paths:
      - 'apps/android/**'
      - '.maestro/native-shadow-journey.yaml'
      - '.maestro/native-shadow-invitation-accept.yaml'
      - '.maestro/native-shadow-invitation-decline.yaml'
      - '.maestro/native-shadow-deep-link-invitation.yaml'
      - '.maestro/native-wedding-journey.yaml'
      - '.maestro/native-wireframe-screenshots.yaml'
      - '.maestro/native-role-traversal.yaml'
      - '.maestro/native-guest-pass-identity.yaml'
      - '.github/workflows/native-wedding-identity-maestro-android.yml'
      - '.github/scripts/verify-android-local-package.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wedding-identity-maestro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-maestro:
    name: Six-screen Android Maestro qualification
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build native Android debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify local Android identity cannot replace Play
        run: bash .github/scripts/verify-android-local-package.sh apps/android/app/build/outputs/apk/debug pro.wewed.app.dev

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: '2.7.0'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run six-screen Shadow journeys
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant pro.wewed.app.dev android.permission.CAMERA || true
            maestro test .maestro/native-shadow-journey.yaml
            maestro test .maestro/native-shadow-invitation-accept.yaml
            maestro test .maestro/native-shadow-invitation-decline.yaml
            maestro test .maestro/native-shadow-deep-link-invitation.yaml
            maestro test .maestro/native-wedding-journey.yaml
            maestro test .maestro/native-wireframe-screenshots.yaml
            maestro test .maestro/native-role-traversal.yaml
            maestro test .maestro/native-guest-pass-identity.yaml

      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wedding-identity-maestro-android-failure
          path: |
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 14


      - name: Collect actual wireframe viewport captures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/wireframe-captures"
          find "$GITHUB_WORKSPACE" "$HOME" -type f -name 'wireframe-*.png' -print -exec cp -f {} "$GITHUB_WORKSPACE/wireframe-captures/" \; || true
          count="$(find "$GITHUB_WORKSPACE/wireframe-captures" -maxdepth 1 -type f -name 'wireframe-*.png' | wc -l | tr -d ' ')"
          echo "Collected $count wireframe viewport captures."
          if [ "$count" -lt 6 ]; then
            echo "FAIL: expected 6 wireframe screenshots, found $count."
            exit 1
          fi

      - name: Upload actual wireframe viewport captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wireframe-viewport-captures
          path: wireframe-captures/
          if-no-files-found: error
          retention-days: 14
