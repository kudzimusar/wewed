name: Native Android Release Bundle CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/native-release-aab-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/native-release-aab-ci.yml'
  workflow_dispatch:
    inputs:
      signed_upload_bundle:
        description: 'Build a Play-upload AAB using the configured Wewed upload-key secrets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-release-aab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-aab:
    name: Build native release AAB structure (CI key; not for Play)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_WEWED_API_BASE_URL: https://wewed.pro
      WEWED_ANDROID_VERSION_CODE: '3'
      WEWED_APP_VERSION: 2.0.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install native dependencies
        working-directory: apps/mobile
        run: bun install

      - name: Generate Android project
        working-directory: apps/mobile
        run: bun run prebuild:android

      - name: Confirm upgrade identity and signing guard
        run: |
          grep -q 'applicationId "pro.wewed.app"' apps/mobile/android/app/build.gradle
          grep -q 'versionCode 3' apps/mobile/android/app/build.gradle
          grep -q 'WEWED_UPLOAD_SIGNING_CONFIG_V1' apps/mobile/android/app/build.gradle
          grep -q 'WEWED_REQUIRE_RELEASE_SIGNING' apps/mobile/android/app/build.gradle

      - name: Build structural release bundle
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Confirm AAB exists
        run: test -s apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload structural AAB evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wewed-native-v3-ci-aab-NOT-FOR-PLAY
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  signed-upload-aab:
    name: Build upload-key-signed Play AAB
    if: github.event_name == 'workflow_dispatch' && inputs.signed_upload_bundle == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_WEWED_API_BASE_URL: https://wewed.pro
      WEWED_ANDROID_VERSION_CODE: '3'
      WEWED_APP_VERSION: 2.0.0
      WEWED_REQUIRE_RELEASE_SIGNING: '1'
      WEWED_UPLOAD_KEYSTORE_BASE64: ${{ secrets.WEWED_UPLOAD_KEYSTORE_BASE64 }}
      WEWED_UPLOAD_STORE_PASSWORD: ${{ secrets.WEWED_UPLOAD_STORE_PASSWORD }}
      WEWED_UPLOAD_KEY_ALIAS: ${{ secrets.WEWED_UPLOAD_KEY_ALIAS }}
      WEWED_UPLOAD_KEY_PASSWORD: ${{ secrets.WEWED_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Materialize protected upload keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WEWED_UPLOAD_KEYSTORE_BASE64:-}" || { echo 'Missing WEWED_UPLOAD_KEYSTORE_BASE64'; exit 1; }
          test -n "${WEWED_UPLOAD_STORE_PASSWORD:-}" || { echo 'Missing WEWED_UPLOAD_STORE_PASSWORD'; exit 1; }
          test -n "${WEWED_UPLOAD_KEY_ALIAS:-}" || { echo 'Missing WEWED_UPLOAD_KEY_ALIAS'; exit 1; }
          test -n "${WEWED_UPLOAD_KEY_PASSWORD:-}" || { echo 'Missing WEWED_UPLOAD_KEY_PASSWORD'; exit 1; }
          printf '%s' "$WEWED_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wewed-upload.jks"
          chmod 600 "$RUNNER_TEMP/wewed-upload.jks"
          echo "WEWED_UPLOAD_STORE_FILE=$RUNNER_TEMP/wewed-upload.jks" >> "$GITHUB_ENV"

      - name: Install native dependencies
        working-directory: apps/mobile
        run: bun install

      - name: Generate signed Android project
        working-directory: apps/mobile
        run: bun run prebuild:android

      - name: Build upload-key-signed AAB
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed bundle and upgrade identity
        run: |
          test -s apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          grep -q 'applicationId "pro.wewed.app"' apps/mobile/android/app/build.gradle
          grep -q 'versionCode 3' apps/mobile/android/app/build.gradle
          jarsigner -verify apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wewed-native-v3-play-upload-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove protected upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wewed-upload.jks"
