name: Native Android Release Bundle CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'scripts/build-native-play-aab.sh'
      - '.github/workflows/native-release-aab-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'scripts/build-native-play-aab.sh'
      - '.github/workflows/native-release-aab-ci.yml'
  workflow_dispatch:
    inputs:
      signed_upload_bundle:
        description: 'Build a Play-upload AAB using the configured Wewed upload-key secrets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-release-aab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-aab:
    name: Build native release AAB structure (CI key; not for Play)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_WEWED_API_BASE_URL: https://wewed.pro
      WEWED_ANDROID_VERSION_CODE: '3'
      WEWED_APP_VERSION: 2.0.0
      WEWED_ANDROID_PACKAGE_ID: pro.wewed.app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release-Mac Play build script
        run: bash -n scripts/build-native-play-aab.sh

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.1'

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install native dependencies
        working-directory: apps/mobile
        run: bun install

      - name: Generate Android project
        working-directory: apps/mobile
        run: bun run prebuild:android

      - name: Verify generated upgrade identity, signing guard and App Links
        working-directory: apps/mobile
        run: node scripts/verify-generated-android.mjs

      - name: Build structural release bundle
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Confirm AAB exists
        run: test -s apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload structural AAB evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wewed-native-v3-ci-aab-NOT-FOR-PLAY
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  signed-upload-aab:
    # Retired by QRO07-SHIP01 — no longer signs a pro.wewed.app candidate with the upload key.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Retired Play signing path
        run: |
          echo "::error::Retired by QRO07-SHIP01. The only Google Play production authority for pro.wewed.app is apps/android."
          echo "Use the 'Android Native Production Play AAB' workflow (android-native-production-play-aab.yml)."
          exit 1
