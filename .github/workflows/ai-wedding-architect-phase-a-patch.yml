name: AI Wedding Architect Phase A Patch

on:
  push:
    branches: [feature/ai-wedding-architect]
    paths:
      - scripts/apply-ai-wedding-architect-phase-a.mjs

permissions:
  contents: write

concurrency:
  group: ai-wedding-architect-phase-a-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-wedding-architect
          fetch-depth: 0
      - name: Apply guarded ecosystem integration patch
        run: node scripts/apply-ai-wedding-architect-phase-a.mjs
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit integrated Phase A slice
        run: |
          if git diff --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git config user.name "wewed-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/app/api/providers/profile/route.ts \
            src/app/api/providers/[slug]/route.ts \
            src/components/providers/provider-profile-manager.tsx \
            src/components/providers/public-provider-profile.tsx \
            src/lib/provider-forms-profile-upgrade.test.ts \
            .github/workflows/provider-forms-ci.yml
          git commit -m "Integrate AI-ready provider commercial catalogue"
          git push origin HEAD:feature/ai-wedding-architect
