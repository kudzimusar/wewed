name: Notebook AI Meeting Intelligence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebook-contract:
    name: Notebook security, migration and build contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/wewed
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma

      - name: Apply Notebook migrations on clean PostgreSQL
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify private Notebook database boundary
        run: |
          psql "$POSTGRES_TEST_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 1 FROM wewed_notebook."NotebookNote" LIMIT 0;
          SELECT 1 FROM wewed_notebook."NotebookNoteVersion" LIMIT 0;
          SELECT 1 FROM wewed_notebook."NotebookShare" LIMIT 0;
          SELECT 1 FROM wewed_notebook."NotebookSuggestion" LIMIT 0;
          SELECT 1 FROM wewed_notebook."NotebookActionReceipt" LIMIT 0;
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
                FROM information_schema.role_schema_grants
               WHERE schema_name = 'wewed_notebook'
                 AND grantee IN ('PUBLIC', 'anon', 'authenticated')
            ) THEN
              RAISE EXCEPTION 'wewed_notebook schema is exposed to a public application role';
            END IF;
            IF EXISTS (
              SELECT 1
                FROM information_schema.role_table_grants
               WHERE table_schema = 'wewed_notebook'
                 AND grantee IN ('PUBLIC', 'anon', 'authenticated')
            ) THEN
              RAISE EXCEPTION 'wewed_notebook table is exposed to a public application role';
            END IF;
          END $$;
          SQL

      - name: Run Notebook authorization policy tests
        run: bun test src/lib/notebook/policy.test.ts

      - name: Verify governed-action source contracts
        run: |
          grep -q 'FOR UPDATE' src/lib/notebook/actions.ts
          grep -q 'NotebookActionReceipt' src/lib/notebook/actions.ts
          grep -q 'sourceVersion' src/lib/notebook/actions.ts
          grep -q 'profile: .private.' src/lib/notebook/intelligence.ts
          grep -q 'authorized_full_text' src/lib/notebook/intelligence.ts
          grep -q 'AI does not silently mutate' docs/WEWED_NOTEBOOK_AI_MEETING_INTELLIGENCE_CANONICAL_PLAN.md

      - name: Build application
        run: bun run build
