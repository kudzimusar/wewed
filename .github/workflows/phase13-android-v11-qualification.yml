name: Phase 13 Android v11 Candidate Qualification

on:
  push:
    branches:
      - native-mobile/release-identity-deeplinks-phase13-20260924

permissions:
  contents: read

jobs:
  android-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 36 SDK is available
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build production-like UAT APK
        run: ./gradlew assembleUat --no-daemon
      - name: Verify v11 identities
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'versionName = "2.1.0"' app/build.gradle.kts
          uat_manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*uat*' | xargs -r grep -l 'package="pro.wewed.app.uatdev"' | head -n 1)"
          test -n "$uat_manifest"
          grep -q 'android:versionCode="11"' "$uat_manifest"
          grep -q 'android:versionName="2.1.0-uatdev"' "$uat_manifest"
          test -f app/build/outputs/apk/uat/app-uat.apk
          # Final release AAB signing is intentionally local-only with the official upload key.
          grep -q 'Release packaging requires WEWED_UPLOAD_STORE_FILE' app/build.gradle.kts
