name: NM05 Temporary iOS Live Guest Visual Selfcheck

on:
  push:
    branches:
      - native-mobile/phase13-ios-ui-overflow-closure-nm05-agent-20260925

permissions:
  contents: read

concurrency:
  group: nm05-ios-live-guest-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Eight-screen live Guest simulator self-check
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install XcodeGen and Maestro
        run: |
          brew install xcodegen
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Generate and build debug app
        working-directory: apps/ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild \
            -project Wewed.xcodeproj \
            -scheme Wewed \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/nm05-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Start live Guest Session stub
        run: |
          cat > "$RUNNER_TEMP/nm05_guest_stub.py" <<'PY'
          import json
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from urllib.parse import urlparse

          TOKEN = "WW2.wedts26.WWJD0824.0e.66f001ab.8d4ba7eca9ef156da73f31e98456a9eaae676f66e4e33d4afaeb5f36cc5f4e06d612a90d0519d343346872759e675437934043ba97fec6a763b7ae3430d6ab30"
          PUBLIC_KEY = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEPSF40dU2YlZRMbV5EweSiFFtJbrJmwtufFc4Bx2eJrC2erZirTgNiKFYBjAIgZsNpWDsGhWRsxToZUz+mdHSNQ=="

          def snapshot():
              return {
                  "success": True,
                  "authorized": True,
                  "wedding": {
                      "slug": "nm05-demo",
                      "title": "Alexandra & Montgomery",
                      "monogram": "A&M",
                      "tagline": "Forever & Always • 14 December 2026",
                      "date": "2026-12-14T14:00:00",
                      "venue": "The Grand Conservatory at Riverside Manor",
                      "venueCity": "Harare",
                      "venueCountry": "Zimbabwe",
                      "venueMapUrl": "https://maps.apple.com/?q=Riverside+Manor",
                      "invitationCardStyle": "ivory-floral-gold",
                      "invitationCardMessage": "With joyful hearts, we invite you to celebrate this beautiful beginning with us. Your presence, laughter, and love would mean the world as we gather with family and friends for our wedding day.",
                      "rsvpDeadline": "30 November 2026",
                      "childrenPolicy": "welcome"
                  },
                  "guest": {
                      "id": "guest_nm05",
                      "name": "Christopher Alexander Wellington",
                      "email": "guest@example.test",
                      "tableNumber": 7,
                      "tableName": "Table 7 — Family & Friends"
                  },
                  "rsvp": {
                      "attending": True,
                      "mealChoice": "vegetarian",
                      "plusOne": True,
                      "plusOneName": "Jordan Wellington",
                      "plusOneMeal": "vegan",
                      "kidsAttending": False,
                      "kidsCount": 0,
                      "dietaryNotes": "No peanuts",
                      "message": "We are so excited to celebrate with you.",
                      "checkedIn": False,
                      "checkedInAt": None
                  }
              }

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print("stub:", fmt % args, flush=True)

              def send_json(self, code, body, session=False):
                  data = json.dumps(body).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  if session:
                      self.send_header("Set-Cookie", "wewed_wedding_guest=nm05-session; Path=/; HttpOnly; SameSite=Lax")
                  self.end_headers()
                  self.wfile.write(data)

              def do_POST(self):
                  parsed = urlparse(self.path)
                  if parsed.path == "/api/weddings/nm05-demo/guest-session":
                      self.send_json(200, {
                          "success": True,
                          "authorized": True,
                          "wedding": {"slug": "nm05-demo"},
                          "guest": {"id": "guest_nm05", "name": "Christopher Alexander Wellington"}
                      }, session=True)
                      return
                  self.send_json(404, {"success": False})

              def do_PUT(self):
                  parsed = urlparse(self.path)
                  if parsed.path == "/api/weddings/nm05-demo/guest-session":
                      length = int(self.headers.get("Content-Length", "0"))
                      payload = json.loads(self.rfile.read(length) or b"{}")
                      rsvp = snapshot()["rsvp"]
                      for key, value in payload.items():
                          if key != "originGuestId":
                              rsvp[key] = value
                      self.send_json(200, {"success": True, "rsvp": rsvp})
                      return
                  self.send_json(404, {"success": False})

              def do_GET(self):
                  parsed = urlparse(self.path)
                  if parsed.path == "/api/weddings/nm05-demo/guest-session":
                      self.send_json(200, snapshot())
                      return
                  if parsed.path == "/api/wedding-content":
                      self.send_json(200, {"data": {"content": {"story": {
                          "heading": "Our Story",
                          "body": "A story of friendship, family, and a celebration shared with the people we love."
                      }}}})
                      return
                  if parsed.path == "/api/wedding-day/guest":
                      self.send_json(200, {"data": {
                          "guest": {
                              "id": "guest_nm05",
                              "tableNumber": 7,
                              "tableName": "Table 7 — Family & Friends",
                              "checkedIn": False,
                              "household": [
                                  {"attendeeKey": "primary", "attendeeName": "Christopher Alexander Wellington"},
                                  {"attendeeKey": "plus-one", "attendeeName": "Jordan Wellington"}
                              ]
                          },
                          "programme": [
                              {"id": "ceremony", "time": "14:00", "title": "Wedding Ceremony", "description": "Please be seated ten minutes early.", "location": "Grand Conservatory"},
                              {"id": "reception", "time": "17:30", "title": "Dinner & Reception", "description": "Dinner, speeches, and dancing.", "location": "Riverside Ballroom"}
                          ],
                          "announcements": [
                              {"id": "arrival", "title": "Guest arrival", "body": "Please use the main garden entrance and have your Wedding Pass ready."}
                          ]
                      }})
                      return
                  if parsed.path == "/api/wedding-day/pass":
                      self.send_json(200, {"data": {
                          "guestId": "guest_nm05",
                          "weddingId": "wedding-nm05",
                          "token": TOKEN,
                          "publicKeyDerBase64": PUBLIC_KEY
                      }})
                      return
                  self.send_json(404, {"success": False, "path": parsed.path})

          ThreadingHTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY

          nohup python3 "$RUNNER_TEMP/nm05_guest_stub.py" > "$RUNNER_TEMP/nm05-stub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nm05-stub.pid"
          for i in $(seq 1 20); do
            if curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/weddings/nm05-demo/guest-session | grep -q '200'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nm05-stub.log"
          exit 1

      - name: Boot iPhone simulator and install Wewed
        id: simulator
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); r=[x for x in d["runtimes"] if x.get("isAvailable") and x["identifier"].find("iOS")>=0]; print(r[-1]["identifier"])')"
          DEVTYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=d["devicetypes"]; pref=next((x for x in xs if x["name"]=="iPhone 16 Pro"), None) or next(x for x in xs if "iPhone" in x["name"]); print(pref["identifier"])')"
          UDID="$(xcrun simctl create NM05-iPhone "$DEVTYPE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/nm05-derived/Build/Products/Debug-iphonesimulator/Wewed.app"

      - name: Launch real DEBUG live Guest path
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          SIMCTL_CHILD_WEWED_GUEST_UI_ORIGIN="http://127.0.0.1:8765" \
          SIMCTL_CHILD_WEWED_GUEST_UI_LINK="https://wewed.pro/invite/nm05-demo?rsvp=nm05-private-token" \
          xcrun simctl launch "$UDID" pro.wewed.app.dev
          sleep 4

      - name: Capture eight live Guest screens with Maestro
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/phase13/nm05-ios-ui-overflow-closure-20260925"
          cat > "$RUNNER_TEMP/nm05-live-guest.yaml" <<'YAML'
          appId: pro.wewed.app.dev
          ---
          - extendedWaitUntil:
              visible:
                id: "invitation-open-button"
              timeout: 15000
          - takeScreenshot: 04_invitation_closed
          - tapOn:
              id: "invitation-open-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-details-button"
              timeout: 7000
          - tapOn:
              id: "invitation-details-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-rsvp"
              timeout: 5000
          - takeScreenshot: 05_invitation_details
          - tapOn:
              id: "invitation-cta-rsvp"
          - extendedWaitUntil:
              visible:
                id: "invitation-rsvp-prompt"
              timeout: 5000
          - takeScreenshot: 02_rsvp
          - tapOn:
              point: "50%,5%"
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-note"
              timeout: 5000
          - tapOn:
              id: "invitation-cta-note"
          - extendedWaitUntil:
              visible:
                id: "invitation-note-message"
              timeout: 5000
          - takeScreenshot: 03_couple_note
          - tapOn:
              id: "invitation-note-dismiss"
          - tapOn:
              id: "invitation-cta-pass"
          - extendedWaitUntil:
              visible:
                id: "wedding-pass-card"
              timeout: 10000
          - takeScreenshot: 06_pass
          - tapOn:
              id: "nav-guest-home"
          - extendedWaitUntil:
              visible:
                id: "live-guest-hero"
              timeout: 5000
          - assertVisible: "Days"
          - assertVisible: "Hours"
          - assertVisible: "Mins"
          - assertVisible: "Secs"
          - takeScreenshot: 01_home
          - tapOn:
              id: "nav-guest-wedding_day"
          - extendedWaitUntil:
              visible:
                id: "guest-day-programme"
              timeout: 10000
          - takeScreenshot: 07_wedding_day
          - tapOn:
              id: "nav-guest-more"
          - extendedWaitUntil:
              visible:
                id: "guest-more-explore"
              timeout: 7000
          - takeScreenshot: 08_more
          YAML

          cd "$GITHUB_WORKSPACE/artifacts/phase13/nm05-ios-ui-overflow-closure-20260925"
          "$HOME/.maestro/bin/maestro" --device "${{ steps.simulator.outputs.udid }}" test "$RUNNER_TEMP/nm05-live-guest.yaml"

          count="$(find . -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Captured $count NM05 screenshots"
          find . -maxdepth 1 -type f -name '*.png' -print
          test "$count" -eq 8

      - name: Upload NM05 simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm05-ios-live-guest-screens
          path: artifacts/phase13/nm05-ios-ui-overflow-closure-20260925/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload visual diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nm05-ios-live-guest-diagnostics
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/nm05-stub.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nm05-stub.pid" ]; then kill "$(cat "$RUNNER_TEMP/nm05-stub.pid")" 2>/dev/null || true; fi
          if [ -n "${{ steps.simulator.outputs.udid }}" ]; then xcrun simctl delete "${{ steps.simulator.outputs.udid }}" || true; fi
