name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate migrations, build, and planner release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned browser test runner
        run: bun add --no-save --exact @playwright/test@1.55.0

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations to clean PostgreSQL database
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Detect missing Prisma migrations
        run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Run original planner parity contract
        run: bun test src/lib/planner-parity-contract.test.ts

      - name: Run planner integrity tests
        run: bun test src/lib/planner-integrity.test.ts

      - name: Run Stage 2 permission tests
        run: bun test src/lib/planner-stage2-permissions.test.ts

      - name: Run Stage 2 metadata compatibility tests
        run: bun test src/lib/planner-stage2-compatibility.test.ts

      - name: Run Stage 2 metadata migration tests
        run: bun test src/lib/planner-stage2-migration.test.ts

      - name: Run Stage 2 task assignment tests
        run: bun test src/lib/planner-stage2-task-assignment.test.ts

      - name: Run Stage 3 extraction tests
        run: bun test src/lib/planner-stage3-extraction.test.ts

      - name: Run Stage 4 Tasks and Budget parity tests
        run: bun test src/lib/planner-stage4-tasks-budget.test.ts

      - name: Run Stage 5 Vendors and Guests parity tests
        run: bun test src/lib/planner-stage5-vendors-guests.test.ts

      - name: Run Stage 6 Timeline and Seating parity tests
        run: bun test src/lib/planner-stage6-timeline-seating.test.ts

      - name: Run Stage 7 worksheet recovery parity tests
        run: bun test src/lib/planner-stage7-worksheet.test.ts

      - name: Run production blocker regression contracts
        run: bun test src/lib/planner-production-blockers.test.ts

      - name: Run production blocker PostgreSQL integration
        run: bun test src/lib/planner-production-blockers.integration.test.ts

      - name: Run complete-gap task validation contract
        run: bun test --test-name-pattern "task title validation" src/lib/planner-complete-gap-closure.test.ts

      - name: Run complete-gap routing and mobile contract
        run: bun test --test-name-pattern "module routing" src/lib/planner-complete-gap-closure.test.ts

      - name: Run complete-gap module controls contract
        run: bun test --test-name-pattern "tasks, budget, guests and seating" src/lib/planner-complete-gap-closure.test.ts

      - name: Run complete-gap workbook structure contract
        run: bun test --test-name-pattern "generated guest workbook" src/lib/planner-complete-gap-closure.test.ts

      - name: Run complete-gap formula safety contract
        run: bun test --test-name-pattern "formula cells" src/lib/planner-complete-gap-closure.test.ts

      - name: Run Stage 8 information architecture tests
        run: bun test src/lib/planner-stage8-information-architecture.test.ts

      - name: Run Stage 9 intelligence, closeout and release tests
        run: bun test src/lib/planner-stage9-intelligence-closeout-release.test.ts

      - name: Run Stage 10 executable release-gate contract
        run: bun test src/lib/planner-stage10-executable-release-gate.test.ts

      - name: Run Phase 2 workflow tests
        run: bun test src/lib/planner-phase2.test.ts

      - name: Run Phase 3 collaboration tests
        run: bun test src/lib/planner-phase3.test.ts

      - name: Run Phase 4 portal tests
        run: bun test src/lib/planner-phase4.test.ts

      - name: Run Phase 5 real-data tests
        run: bun test src/lib/planner-phase5.test.ts

      - name: Run Phase 6 event-operations tests
        run: bun test src/lib/planner-phase6.test.ts

      - name: Build application
        run: bun run build

      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run executable planner browser release gate
        run: bunx playwright test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: planner-browser-release-gate
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
