name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Materialize and validate secure planner marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize reviewed implementation and restore canonical CI
        shell: bash
        run: |
          awk '
            /^H4s/ { capture=1 }
            /^PATCH$/ { if (capture) exit }
            capture { print }
          ' .github/workflows/apply-planner-marketplace-patch.yml > /tmp/wewed-marketplace-patch.b64
          test -s /tmp/wewed-marketplace-patch.b64
          base64 -d /tmp/wewed-marketplace-patch.b64 > /tmp/wewed-marketplace-patch.tar.gz
          tar -xzf /tmp/wewed-marketplace-patch.tar.gz -C .
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-planner-marketplace-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add secure planner marketplace and appointment flow'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned browser test runner
        run: bun add --no-save --exact @playwright/test@1.55.0

      - name: Validate and generate Prisma
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma

      - name: Apply and verify clean PostgreSQL migrations
        run: |
          bunx prisma migrate deploy --schema prisma/schema.prisma
          bunx prisma migrate status --schema prisma/schema.prisma
          bunx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Run PostgreSQL contracts
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/registration-trigger-postgres-integration.sql
          psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/planner-marketplace-postgres-integration.sql

      - name: Run complete application contracts
        run: bun test src/lib

      - name: Build application
        run: bun run build

      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright Chromium release gate
        run: bunx playwright test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: planner-marketplace-browser-release-gate
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
