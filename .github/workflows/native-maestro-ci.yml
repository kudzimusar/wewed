name: Native Maestro Android CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.maestro/**'
      - 'src/app/api/mobile/auth/**'
      - 'src/lib/e2e-environment*'
      - 'tests/e2e/support/planner-fixture.ts'
      - '.github/workflows/native-maestro-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.maestro/**'
      - 'src/app/api/mobile/auth/**'
      - 'src/lib/e2e-environment*'
      - 'tests/e2e/support/planner-fixture.ts'
      - '.github/workflows/native-maestro-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-maestro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-maestro:
    name: Compiled Android app Maestro smoke
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_WEWED_API_BASE_URL: http://127.0.0.1:3000
      WEWED_ANDROID_VERSION_CODE: '3'
      WEWED_APP_VERSION: 2.0.0
      WEWED_MAESTRO_EMAIL: planner.e2e@example.test
      WEWED_MAESTRO_PASSWORD: wewed-native-e2e-ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install Wewed server dependencies
        run: bun install --frozen-lockfile

      - name: Verify local CI E2E authority guard
        run: bun test src/lib/e2e-environment.test.ts

      - name: Prepare disposable planner database
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma
          bun -e "const { resetPlannerE2EFixture } = await import('./tests/e2e/support/planner-fixture.ts'); await resetPlannerE2EFixture()"

      - name: Build local Wewed E2E server
        run: bun run build

      - name: Start local Wewed E2E server
        shell: bash
        run: |
          set -euo pipefail
          nohup bun run start > /tmp/wewed-maestro-server.log 2>&1 &
          echo $! > /tmp/wewed-maestro-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/.well-known/assetlinks.json > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'Local Wewed E2E server did not become ready.'
              cat /tmp/wewed-maestro-server.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Install native dependencies
        working-directory: apps/mobile
        run: bun install

      - name: Generate Android project
        working-directory: apps/mobile
        run: bun run prebuild:android

      - name: Verify generated upgrade identity, signing guard, App Links and CI network isolation
        working-directory: apps/mobile
        run: node scripts/verify-generated-android.mjs

      - name: Compile debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: '2.7.0'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native smoke on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:3000 tcp:3000
            adb reverse tcp:8081 tcp:8081

            (
              cd apps/mobile
              bunx expo start --localhost --clear > /tmp/wewed-maestro-metro.log 2>&1
            ) &
            echo $! > /tmp/wewed-maestro-metro.pid

            for attempt in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
                break
              fi
              if [ "$attempt" -eq 90 ]; then
                echo 'Metro did not become ready.'
                cat /tmp/wewed-maestro-metro.log || true
                exit 1
              fi
              sleep 1
            done

            maestro test .maestro/native-public-smoke.yaml
            maestro test \
              -e WEWED_MAESTRO_EMAIL="$WEWED_MAESTRO_EMAIL" \
              -e WEWED_MAESTRO_PASSWORD="$WEWED_MAESTRO_PASSWORD" \
              .maestro/native-authenticated-smoke.yaml

            adb shell am start -W -a android.intent.action.VIEW -d 'wewed://messages' pro.wewed.app
            adb shell am start -W -a android.intent.action.VIEW -d 'https://wewed.pro/messages' pro.wewed.app

      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-maestro-android-failure
          path: |
            ~/.maestro/tests
            /tmp/wewed-maestro-metro.log
            /tmp/wewed-maestro-server.log
            native-public-smoke-complete.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Wewed E2E server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/wewed-maestro-server.pid ]; then
            kill "$(cat /tmp/wewed-maestro-server.pid)" 2>/dev/null || true
          fi
