name: NM02 Temporary Native Qualification

on:
  push:
    branches:
      - native-mobile/phase13-guest-presentation-convergence-nm02-20260925

permissions:
  contents: read

jobs:
  android:
    name: Android unit + debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Android NM02 qualification
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

  ios:
    name: iOS Swift package tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run iOS NM02 qualification
        working-directory: apps/ios
        run: swift test
