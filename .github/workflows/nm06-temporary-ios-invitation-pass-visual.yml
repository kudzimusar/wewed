name: NM06 Temporary iOS Invitation Pass Visual Evidence

on:
  push:
    branches:
      - native-mobile/phase13-ios-invitation-pass-closure-nm06-20260926

permissions:
  contents: read

concurrency:
  group: nm06-invitation-pass-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          brew install xcodegen
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build app with CI-only in-process Guest Session fixture
        working-directory: apps/ios
        run: |
          cat > Wewed/AppTarget/NM06VisualFixture.swift <<'SWIFT'
          import Foundation
          import WewedKit

          enum NM06VisualFixture {
              static func coordinator() -> LiveGuestInvitationCoordinator {
                  let configuration = URLSessionConfiguration.ephemeral
                  configuration.protocolClasses = [NM06VisualURLProtocol.self]
                  configuration.httpCookieAcceptPolicy = .never
                  configuration.httpShouldSetCookies = false
                  let client = GuestSessionClient(
                      baseUrl: URL(string: "https://wewed.pro")!,
                      storage: InMemorySecureStorage(),
                      session: URLSession(configuration: configuration)
                  )
                  return LiveGuestInvitationCoordinator(client: client)
              }
          }

          final class NM06VisualURLProtocol: URLProtocol, @unchecked Sendable {
              // Repository-owned signed UI fixture; display strings below remain long NM06 stress data.
              private static let ww2 = "WW2.uiwedding.UI_GUEST_A.0e.01020304.2078a090dc67ee752d9a7105167aefe3318ecd0020eb25363fd91ee4ec9524d1c971e82e329a043766b194452516f7d0a45d7b6f1029b898a513f5c4e1eda592"
              private static let publicKey = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7o8UhxfZaWd5pR2E8ZUT16uAAZfXqOrEQP9uXG9Ns2erl1Fj4sLd5Z/QTwS75GQPHkip3FwDV68qPJtvFeHO4g=="

              override class func canInit(with request: URLRequest) -> Bool { true }
              override class func canonicalRequest(for request: URLRequest) -> URLRequest { request }

              override func startLoading() {
                  guard let url = request.url else {
                      finish(status: 500, body: ["success": false])
                      return
                  }

                  let path = url.path
                  let method = request.httpMethod ?? "GET"

                  if path == "/api/weddings/nm06-demo/guest-session", method == "POST" {
                      finish(
                          status: 200,
                          body: [
                              "success": true,
                              "authorized": true,
                              "wedding": ["slug": "nm06-demo"],
                              "guest": [
                                  "id": "ui-guest-a",
                                  "name": "Christopher Alexander Wellington-Somerville"
                              ]
                          ],
                          headers: [
                              "Set-Cookie": "wewed_wedding_guest=nm06session; Path=/; HttpOnly"
                          ]
                      )
                      return
                  }

                  if path == "/api/weddings/nm06-demo/guest-session", method == "GET" {
                      finish(status: 200, body: Self.invitation)
                      return
                  }

                  if path == "/api/weddings/nm06-demo/guest-session", method == "PUT" {
                      finish(status: 200, body: [
                          "success": true,
                          "rsvp": Self.rsvp
                      ])
                      return
                  }

                  if path == "/api/wedding-content" {
                      finish(status: 200, body: [
                          "data": [
                              "content": [
                                  "story": [
                                      "body": "A story of friendship, family, and a celebration shared with the people we love."
                                  ]
                              ]
                          ]
                      ])
                      return
                  }

                  if path == "/api/wedding-day/guest" {
                      finish(status: 200, body: [
                          "data": [
                              "guest": [
                                  "id": "ui-guest-a",
                                  "tableNumber": 27,
                                  "tableName": "Table 27 — Extended Family & Lifelong Friends",
                                  "checkedIn": false,
                                  "household": [
                                      ["attendeeKey": "primary", "attendeeName": "Christopher Alexander Wellington-Somerville"],
                                      ["attendeeKey": "plus-one", "attendeeName": "Jordan Alexandria Wellington-Somerville"]
                                  ]
                              ],
                              "programme": [
                                  [
                                      "id": "ceremony",
                                      "time": "14:00",
                                      "title": "Wedding Ceremony",
                                      "description": "Please be seated ten minutes early.",
                                      "location": "The Grand Conservatory at Riverside Manor"
                                  ]
                              ],
                              "announcements": [
                                  [
                                      "id": "arrival",
                                      "title": "Guest arrival",
                                      "body": "Please use the main garden entrance and have your Wedding Pass ready."
                                  ]
                              ]
                          ]
                      ])
                      return
                  }

                  if path == "/api/wedding-day/pass" {
                      finish(status: 200, body: [
                          "data": [
                              "guestId": "ui-guest-a",
                              "weddingId": "ui-wedding",
                              "token": Self.ww2,
                              "publicKeyDerBase64": Self.publicKey
                          ]
                      ])
                      return
                  }

                  finish(status: 404, body: ["success": false])
              }

              override func stopLoading() {}

              private func finish(
                  status: Int,
                  body: [String: Any],
                  headers: [String: String] = [:]
              ) {
                  let data = try! JSONSerialization.data(withJSONObject: body)
                  var responseHeaders = headers
                  responseHeaders["Content-Type"] = "application/json"
                  responseHeaders["Content-Length"] = String(data.count)
                  let response = HTTPURLResponse(
                      url: request.url!,
                      statusCode: status,
                      httpVersion: "HTTP/1.1",
                      headerFields: responseHeaders
                  )!
                  client?.urlProtocol(self, didReceive: response, cacheStoragePolicy: .notAllowed)
                  client?.urlProtocol(self, didLoad: data)
                  client?.urlProtocolDidFinishLoading(self)
              }

              private static let rsvp: [String: Any] = [
                  "attending": true,
                  "mealChoice": "vegetarian",
                  "plusOne": true,
                  "plusOneName": "Jordan Alexandria Wellington-Somerville",
                  "plusOneMeal": "vegan",
                  "kidsAttending": false,
                  "kidsCount": 0,
                  "dietaryNotes": "No peanuts",
                  "message": "We are so excited to celebrate with you.",
                  "checkedIn": false
              ]

              private static let invitation: [String: Any] = [
                  "success": true,
                  "authorized": true,
                  "wedding": [
                      "slug": "nm06-demo",
                      "title": "Alexandra Genevieve & Montgomery Christopher",
                      "monogram": "A&M",
                      "tagline": "Forever & Always • 14 August 2027 — Together With Our Families",
                      "date": "2027-08-14T14:00:00",
                      "venue": "The Grand Conservatory at Riverside Manor & Botanical Gardens",
                      "venueCity": "Harare, Zimbabwe",
                      "venueCountry": "Zimbabwe",
                      "venueMapUrl": "https://maps.apple.com/?q=Riverside+Manor",
                      "invitationCardStyle": "ivory-floral-gold",
                      "invitationCardMessage": "With joyful hearts, we invite you to celebrate this beautiful beginning with us. Your presence, laughter, and love would mean the world as we gather with family and friends for our wedding day.",
                      "rsvpDeadline": "30 November 2026",
                      "childrenPolicy": "welcome"
                  ],
                  "guest": [
                      "id": "ui-guest-a",
                      "name": "Christopher Alexander Wellington-Somerville",
                      "tableNumber": 27,
                      "tableName": "Table 27 — Extended Family & Lifelong Friends"
                  ],
                  "rsvp": rsvp
              ]
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          p = Path("Wewed/AppTarget/WewedMainApp.swift")
          s = p.read_text()
          old = '''            #if DEBUG
                      if let origin = ProcessInfo.processInfo.environment["WEWED_GUEST_UI_ORIGIN"],'''
          new = '''            #if DEBUG
                      if ProcessInfo.processInfo.environment["WEWED_NM06_VISUAL"] == "1" {
                          GuestOnlyInvitationShellView(
                              coordinator: NM06VisualFixture.coordinator(),
                              initialURL: URL(string: "https://wewed.pro/invite/nm06-demo?rsvp=nm06demo")
                          )
                      } else if let origin = ProcessInfo.processInfo.environment["WEWED_GUEST_UI_ORIGIN"],'''
          if old not in s:
              raise SystemExit("NM06 injection anchor not found")
          p.write_text(s.replace(old, new))
          PY

          xcodegen generate --spec project.yml
          xcodebuild             -project Wewed.xcodeproj             -scheme Wewed             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath "$RUNNER_TEMP/nm06-derived"             CODE_SIGNING_ALLOWED=NO build

      - name: Boot 393pt-equivalent simulator
        id: sim
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d["runtimes"] if x.get("isAvailable") and "iOS" in x["identifier"]]; print(a[-1]["identifier"])')"
          DEVICE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d["devicetypes"]; x=next((v for v in a if v["name"]=="iPhone 15 Pro"),None) or next((v for v in a if v["name"]=="iPhone 16 Pro"),None) or next(v for v in a if "iPhone" in v["name"]); print(x["identifier"])')"
          UDID="$(xcrun simctl create NM06-iPhone "$DEVICE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/nm06-derived/Build/Products/Debug-iphonesimulator/Wewed.app"

      - name: Launch Guest app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          SIMCTL_CHILD_WEWED_NM06_VISUAL="1"             xcrun simctl launch "$UDID" pro.wewed.app.dev
          sleep 5

      - name: Capture NM06 required screens
        run: |
          OUT="$GITHUB_WORKSPACE/artifacts/phase13/nm06-ios-invitation-pass-closure-20260926"
          mkdir -p "$OUT"
          cat > "$RUNNER_TEMP/nm06.yaml" <<'YAML'
          appId: pro.wewed.app.dev
          ---
          - extendedWaitUntil:
              visible:
                id: "invitation-open-button"
              timeout: 15000
          - takeScreenshot: 02_invitation_closed
          - tapOn:
              id: "invitation-open-button"
          - extendedWaitUntil:
              visible:
                id: "invitation-details-button"
              timeout: 7000
          - tapOn:
              id: "invitation-details-button"
          - takeScreenshot: 03_invitation_details
          - swipe:
              direction: UP
              duration: 500
          - swipe:
              direction: UP
              duration: 500
          - extendedWaitUntil:
              visible:
                id: "invitation-cta-pass"
              timeout: 10000
          - takeScreenshot: 03b_invitation_details_footer
          - tapOn:
              id: "invitation-cta-pass"
          - extendedWaitUntil:
              visible:
                id: "wedding-pass-card"
              timeout: 15000
          - waitForAnimationToEnd
          - takeScreenshot: 04_pass
          - tapOn: "Home"
          - extendedWaitUntil:
              visible:
                id: "live-guest-hero"
              timeout: 7000
          - takeScreenshot: 01_home_sentinel
          - tapOn:
              id: "nav-guest-invitation"
          - extendedWaitUntil:
              visible:
                id: "invitation-open-button"
              timeout: 10000
          - takeScreenshot: 05_invitation_reopened
          YAML
          cd "$OUT"
          "$HOME/.maestro/bin/maestro" --device "${{ steps.sim.outputs.udid }}" test "$RUNNER_TEMP/nm06.yaml"
          find "$HOME/.maestro/tests" -type f -path '*/takeScreenshot/*.png' -exec cp {} "$OUT/" \;
          test "$(find "$OUT" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" -ge 6

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nm06-ios-invitation-pass-screens
          path: artifacts/phase13/nm06-ios-invitation-pass-closure-20260926/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nm06-ios-invitation-pass-diagnostics
          path: ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
