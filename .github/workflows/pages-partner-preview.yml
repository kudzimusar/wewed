name: Deploy partner preview to GitHub Pages

on:
  push:
    branches:
      - partner-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out partner preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/screens

          cp partner-preview/index.html _site/index.html
          cp partner-preview/index.html _site/404.html
          touch _site/.nojekyll

          cp public/hero-wedding.png _site/assets/hero-wedding.png
          cp public/icon-192.png _site/assets/icon-192.png

          cp download/wewed-final-story.png _site/screens/
          cp download/wewed-final-programme.png _site/screens/
          cp download/wewed-rsvp-final.png _site/screens/
          cp download/wewed-final-songbook3.png _site/screens/
          cp download/wewed-bridal-party.png _site/screens/
          cp download/wewed-gallery-fixed.png _site/screens/
          cp download/wewed-planner-with-data.png _site/screens/
          cp download/wewed-after-mode.png _site/screens/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
