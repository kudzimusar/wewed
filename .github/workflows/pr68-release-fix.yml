name: PR68 Release Gate Fix

on:
  push:
    branches:
      - feat/africa-ready-product-experience

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.head_commit.message != 'fix: release gate blockers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/africa-ready-product-experience
          fetch-depth: 0
      - name: Apply bounded release fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager_path = Path('src/components/providers/provider-profile-manager.tsx')
          manager = manager_path.read_text()
          replacements = [
              (
                  "      let nextVerification = mapVerification(next.verification)\n",
                  "      const nextVerification = mapVerification(next.verification)\n",
              ),
              (
                  "          const restored = JSON.parse(local) as { profile?: ProfileDraft; verification?: VerificationDraft; offerings?: OfferingDraft[]; savedAt?: string }\n          if (restored.profile && restored.verification && Array.isArray(restored.offerings) && restored.offerings.length) {\n            nextProfile = restored.profile\n            nextVerification = restored.verification\n            nextOfferings = restored.offerings\n",
                  "          const restored = JSON.parse(local) as { profile?: ProfileDraft; offerings?: OfferingDraft[]; savedAt?: string }\n          if (restored.profile && Array.isArray(restored.offerings) && restored.offerings.length) {\n            nextProfile = restored.profile\n            nextOfferings = restored.offerings\n",
              ),
              (
                  "    if (state !== 'ready' || !payload?.business || !profile || !verification || offerings.length === 0) return\n",
                  "    if (state !== 'ready' || !payload?.business || !profile || offerings.length === 0) return\n",
              ),
              (
                  "        JSON.stringify({ profile, verification, offerings, savedAt }),\n",
                  "        JSON.stringify({ profile, offerings, savedAt }),\n",
              ),
              (
                  "  }, [state, payload?.business, profile, verification, offerings])\n",
                  "  }, [state, payload?.business, profile, offerings])\n",
              ),
          ]
          for old, new in replacements:
              if manager.count(old) != 1:
                  raise SystemExit(f'Expected one manager match, found {manager.count(old)}: {old[:80]!r}')
              manager = manager.replace(old, new)
          manager_path.write_text(manager)

          targeted_path = Path('src/lib/targeted-home-provider-iteration.test.ts')
          targeted_path.write_text("""import { describe, expect, test } from 'bun:test'
import { readFileSync } from 'node:fs'

const source = (path: string) => readFileSync(path, 'utf8')

