name: PR68 Release Gate Fix

on:
  push:
    branches:
      - feat/africa-ready-product-experience

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.head_commit.message != 'release gate blockers fixed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/africa-ready-product-experience
          fetch-depth: 0
      - name: Apply bounded release fixes
        run: python3 scripts/pr68_release_fix.py
      - name: Commit bounded fixes
        run: |
          git config user.name "wewed-release-bot"
          git config user.email "77352591+kudzimusar@users.noreply.github.com"
          git add src/components/providers/provider-profile-manager.tsx src/lib/targeted-home-provider-iteration.test.ts tests/e2e/zz-provider-forms-profiles.spec.ts
          git diff --cached --check
          git commit -m "release gate blockers fixed"
          git push origin HEAD:feat/africa-ready-product-experience
