  test('the documented scope authorizes only the six reviewed corrections', () => {
    const plan = source('docs/targeted-home-marketplace-vendor-iteration-2026-08-05.md')
    expect(plan).toContain('authorizes only the six corrections')
    expect(plan).toContain('It is not authorization for a general redesign')
    expect(plan).toContain('Cinematic homepage hero')
    expect(plan).toContain('Controlled marketplace fields')
    expect(plan).toContain('Honest Wedding Journey card')
    expect(plan).toContain('Live homepage account state')
    expect(plan).toContain('Interactive vendor and venue discovery')
    expect(plan).toContain('Task Test 11')
    expect(plan).toContain('Do not merge until the exact PR head')
  })

  test('the homepage keeps the Higgsfield wedding film and honest live journey state', () => {
    const home = source('src/components/public/public-platform-home-v2.tsx')
    expect(home).toContain('hf_20260804_140303_f8b02a87-f03b-4db5-81e2-969b5f3c3544.mp4')
    expect(home).toContain('<video')
    expect(home).toContain('muted')
    expect(home).toContain('autoPlay')
