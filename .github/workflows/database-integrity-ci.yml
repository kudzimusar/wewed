name: Database Integrity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/database-integrity-vendor-admin-hardening-20260809
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Verify vendor and Admin relational integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Execute documented-plan source contract
        run: bun scripts/database-integrity-vendor-admin-contract.ts

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Apply complete migration chain to clean PostgreSQL
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Detect schema drift
        run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Run vendor/Admin relational integrity PostgreSQL contract
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/database-integrity-vendor-admin-postgres.sql

      - name: Lint changed application and contract files
        run: >-
          bunx eslint
          src/app/api/admin/providers/claims/route.ts
          scripts/database-integrity-vendor-admin-contract.ts

      - name: Build production application
        run: bun run build
