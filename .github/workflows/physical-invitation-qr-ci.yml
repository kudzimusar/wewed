name: Physical Invitation QR CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/i/**'
      - 'src/app/api/planner/guests/invitations/physical/**'
      - 'src/app/api/weddings/**/invitation-access/**'
      - 'src/app/w/**'
      - 'src/components/wedding/guest-access-gateway.tsx'
      - 'src/components/wedding/physical-invitation-qr.tsx'
      - 'src/components/wedding/planner-invitation-tools.tsx'
      - 'src/lib/physical-invitation-code.ts'
      - 'src/lib/physical-invitation-access.test.ts'
      - 'src/lib/wedding-public-access.ts'
      - 'src/lib/wedding-shared-invitation-session.ts'
      - '.github/workflows/physical-invitation-qr-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate shared physical invitation access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Run physical invitation access regression contract
        run: bun test src/lib/physical-invitation-access.test.ts

      # The repository's standard CI performs the authoritative application
      # build and browser release gate. This focused workflow only owns the
      # shared physical-invitation regression contract.
