name: Session Closeout Admin Productivity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/session-closeout-admin-productivity-20260809
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-closeout-admin-productivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify closeout plan, database, build, permissions, and Admin browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned browser test runner
        run: bun add --no-save --exact @playwright/test@1.55.0

      - name: Execute session closeout source contract
        run: bun scripts/session-closeout-admin-productivity-contract.ts

      - name: Re-run Admin Command Centre source contract
        run: bun scripts/admin-command-center-contract.ts

      - name: Verify Admin productivity permission matrix
        run: bun scripts/session-closeout-admin-permissions.ts

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Apply complete migration chain to clean PostgreSQL
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify migration status
        run: bunx prisma migrate status --schema prisma/schema.prisma

      - name: Detect schema drift
        run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Verify Admin productivity PostgreSQL invariants
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/session-closeout-admin-productivity-postgres.sql

      - name: Re-run Admin Command Centre PostgreSQL invariants
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/admin-command-center-postgres-integration.sql

      - name: Re-run vendor/Admin database integrity PostgreSQL invariants
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/database-integrity-vendor-admin-postgres.sql

      - name: Re-run database integrity review-gap regressions
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -f scripts/database-integrity-review-gap-postgres.sql

      - name: Lint closeout implementation
        run: >-
          bunx eslint
          scripts/session-closeout-admin-productivity-contract.ts
          scripts/session-closeout-admin-permissions.ts
          scripts/admin-command-center-contract.ts
          src/app/api/admin/productivity/route.ts
          src/lib/admin-productivity-route-core.ts
          src/app/api/admin/command-center/route.ts
          src/lib/admin-command-center-route-core.ts
          src/components/admin/admin-productivity-console.tsx
          src/components/admin/secure-wewed-admin.tsx
          tests/e2e/admin-session-closeout-productivity.spec.ts

      - name: Build production application
        run: bun run build

      - name: Install Chromium and system dependencies
        run: bash scripts/install-playwright-chromium-ci.sh

      - name: Run Admin closeout browser release gate
        run: bunx playwright test tests/e2e/admin-session-closeout-productivity.spec.ts tests/e2e/admin-command-centre-responsive.spec.ts --project=desktop-chromium --fail-on-flaky-tests

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-closeout-admin-productivity-browser-gate
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
