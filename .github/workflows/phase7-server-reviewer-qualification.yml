name: Phase 7 Server Reviewer Qualification

on:
  push:
    branches:
      - backend/onboarding-reconciliation-phase7-20260922
    paths:
      - 'src/app/api/onboarding/**'
      - 'src/app/api/admin/onboarding/**'
      - 'src/app/api/auth/register/**'
      - 'src/lib/production-authority/**'
      - 'prisma/migrations/20260922120000_fix_business_account_subscription_status_default/**'
      - 'prisma/migrations/20260922130000_fix_planner_zero_wedding_onboarding_completion_trigger/**'
      - '.github/workflows/phase7-server-reviewer-qualification.yml'

permissions:
  contents: read

jobs:
  server:
    name: Server Phase 7 gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-phase7-reviewer-secret-not-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma and migrate disposable database
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Run Phase 7 onboarding and authority qualification
        run: >
          bun test
          src/app/api/onboarding/legacy-onboarding-production-boundary.test.ts
          src/lib/production-authority/onboarding-reconciliation.integration.test.ts
          src/lib/production-authority/grants.test.ts
          src/lib/production-authority/production-authority.integration.test.ts
      - name: Run carried-forward Guest/account regressions
        run: >
          bun test
          src/lib/native-account-session.test.ts
          src/app/api/native/account/native-account-contract.test.ts
          src/lib/wedding-guest-session-v2.test.ts
          src/lib/wedding-guest-portfolio-contract.test.ts
          src/lib/wedding-guest-projection-v2.test.ts
          src/lib/wedding-privacy-semantics.test.ts
          src/lib/physical-invitation-access.test.ts
          src/lib/digital-invitation-card.test.ts
          src/lib/digital-invitation-experience.test.ts
      - name: Build production application
        run: bun run build
