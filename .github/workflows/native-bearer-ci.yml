name: Native Bearer Transport CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/app-session.ts'
      - 'src/lib/wedding-access.ts'
      - 'src/app/api/mobile/auth/**'
      - 'src/app/api/planner/overview/**'
      - 'tests/e2e/native-bearer-transport.spec.ts'
      - 'tests/e2e/support/planner-browser.ts'
      - 'tests/e2e/support/planner-fixture.ts'
      - '.github/workflows/native-bearer-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/lib/app-session.ts'
      - 'src/lib/wedding-access.ts'
      - 'src/app/api/mobile/auth/**'
      - 'src/app/api/planner/overview/**'
      - 'tests/e2e/native-bearer-transport.spec.ts'
      - 'tests/e2e/support/planner-browser.ts'
      - 'tests/e2e/support/planner-fixture.ts'
      - '.github/workflows/native-bearer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-bearer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bearer-browser:
    name: Prove cookie-free native Bearer authorization in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client and apply migrations
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Build application
        run: bun run build

      - name: Install Chromium and system dependencies
        run: bash scripts/install-playwright-chromium-ci.sh

      - name: Run native Bearer browser regression
        run: >-
          bunx playwright test
          tests/e2e/native-bearer-transport.spec.ts
          --project=mobile-chromium
          --fail-on-flaky-tests

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-bearer-browser-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
