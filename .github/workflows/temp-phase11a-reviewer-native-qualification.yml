name: TEMP Phase 11A Reviewer Native Qualification

on:
  push:
    branches:
      - native-mobile/wedding-day-ww2-phase11a-20260924

permissions:
  contents: read

concurrency:
  group: temp-phase11a-reviewer-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android debug build
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Android unsigned release build
        working-directory: apps/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Swift tests
        working-directory: apps/ios
        run: swift test

      - name: Swift build
        working-directory: apps/ios
        run: swift build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build Simulator Debug
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project Wewed.xcodeproj
          -scheme Wewed
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build unsigned generic Release
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project Wewed.xcodeproj
          -scheme Wewed
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
