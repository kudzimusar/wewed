name: Resolve billing branch synchronization

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - feature/wewed-pricing-billing-v1

permissions:
  contents: write

concurrency:
  group: resolve-billing-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.pull_request.number == 57 && github.head_ref == 'sync/main-into-billing-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: sync/main-into-billing-20260802

      - name: Merge billing branch with reviewed conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/wewed-pricing-billing-v1

          set +e
          git merge --no-ff --no-commit origin/feature/wewed-pricing-billing-v1
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=(
            ".github/workflows/ci.yml"
            "src/components/wedding/global-wedding-tools.tsx"
          )

          if (( merge_status != 0 )); then
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}"
              git merge --abort
              exit 1
            fi
            git checkout --ours -- "${expected[@]}"
            git add "${expected[@]}"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain."
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

          git add -A
          git commit -m "chore: merge billing release branch with latest main"
          git push origin HEAD:sync/main-into-billing-20260802
