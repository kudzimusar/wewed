name: Provider Forms CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-forms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun add --no-save --exact @playwright/test@1.55.0
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - run: bun test src/lib/provider-forms-profile-upgrade.test.ts
      - run: bun test src/lib/provider-commercial.test.ts
      - run: bun test src/lib/provider-pricing-catalog.test.ts
      - run: bun test src/lib/provider-claim-regressions.test.ts
      - run: >-
          bunx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: >-
          bunx playwright test
          tests/e2e/zz-provider-forms-profiles.spec.ts
          --project=desktop-chromium
          --project=mobile-chromium
      - name: Upload provider form failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: provider-forms-browser-release-gate
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
