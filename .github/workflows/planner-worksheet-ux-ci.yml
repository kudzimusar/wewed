name: Planner Worksheet UX

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-worksheet-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Stamped worksheet UX contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run stamped Planner worksheet UX regression contract
        run: bun test src/lib/planner-worksheet-ux-regression.test.ts

      - name: Lint Planner worksheet UX implementation
        run: >-
          bunx eslint
          src/app/layout.tsx
          src/app/join/'[token]'/page.tsx
          src/app/api/join/'[token]'/route.ts
          src/app/api/planner/seating/route.ts
          src/app/api/planner/worksheet-order/route.ts
          src/app/api/weddings/team-invites/route.ts
          src/components/wedding/planner-invitation-tools.tsx
          src/components/wedding/planner/planner-team-invite-manager.tsx
          src/components/wedding/planner/planner-worksheet-command-center.tsx
          src/lib/planner-document.ts
          src/lib/planner-membership-business-link.ts
          src/lib/planner-worksheet-order.ts
          src/lib/planner-worksheet-ux-regression.test.ts
          src/lib/team-invite.ts
          tests/e2e/planner-worksheet-ux.spec.ts
