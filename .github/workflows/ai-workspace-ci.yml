name: AI Workspace CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/api/ai/**'
      - 'src/components/wedding/ai-**'
      - 'src/lib/ai/**'
      - 'prisma/migrations/**ai_workspace**'
      - 'scripts/ai-workspace-postgres-integration.sql'
      - '.github/workflows/ai-workspace-ci.yml'
      - 'package.json'
  push:
    branches:
      - feature/ai-provider-router
    paths:
      - 'src/app/api/ai/**'
      - 'src/components/wedding/ai-**'
      - 'src/lib/ai/**'
      - 'prisma/migrations/**ai_workspace**'
      - 'scripts/ai-workspace-postgres-integration.sql'
      - '.github/workflows/ai-workspace-ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      PGPASSWORD: postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify AI PostgreSQL contracts
        run: psql -h localhost -p 5432 -U postgres -d wewed -f scripts/ai-workspace-postgres-integration.sql

      - name: Run AI unit contracts
        run: bun run ai:unit

      - name: Build application
        run: bun run build
