name: Contributions Resource Accounting

on:
  pull_request:
    paths:
      - 'prisma/migrations/*contributions*/**'
      - 'src/lib/contributions*'
      - 'src/app/api/planner/contributions/**'
      - 'src/app/api/planner/budget/**'
      - 'src/app/api/planner/contribution-campaigns/**'
      - 'src/app/api/contribution-campaigns/**'
      - 'src/app/api/admin/contributions/**'
      - 'src/components/wedding/planner/**'
      - 'src/components/wedding/planner-workspace.tsx'
      - 'src/components/wedding/planner-workspace-stage7.tsx'
      - 'src/lib/planner-route-state.ts'
      - 'src/app/planner/contributions/**'
      - 'src/app/admin/contributions/**'
      - 'src/components/admin/admin-financial-contributions.tsx'
      - 'src/components/admin/secure-admin-financial-contributions.tsx'
      - 'src/components/admin/admin-utility-nav.tsx'
      - 'src/components/wedding/gift-registry-campaign-bridge.tsx'
      - 'src/components/wedding/invitation-gifting-link.tsx'
      - 'src/components/wedding/wedding-home.tsx'
      - 'src/components/wedding/invitation-rsvp-dialog.tsx'
      - 'src/components/wedding/import-export-bar.tsx'
      - 'src/lib/import-engine/**'
      - 'src/app/api/imports/**'
      - 'src/app/api/templates/**'
      - 'src/app/api/exports/**'
      - 'tests/e2e/planner-contributions.spec.ts'
      - 'tests/e2e/support/planner-browser.ts'
      - 'scripts/contributions-alignment-driver-v7.py'
      - 'scripts/contributions-alignment-source.py'
      - 'scripts/contributions-second-review-expansion.py'
      - 'scripts/contributions-lifecycle-audit.py'
      - 'scripts/contributions-integrity-permissions.py'
      - 'scripts/contributions-final-hardening.py'
      - 'scripts/contributions-final-invariants.py'
      - 'scripts/contributions-phase1-phase3-financial-truth.py'
      - 'scripts/contributions-phase2-detail-evidence.py'
      - 'scripts/contributions-phase4-operational-integration.py'
      - 'scripts/contributions-phase5-campaign-governance.py'
      - 'scripts/contributions-phase6-productivity.py'
      - '.github/workflows/contributions-resource-accounting.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply complete stamped-plan remediation
        run: python3 scripts/contributions-alignment-driver-v7.py
      - run: bun install --frozen-lockfile
      - run: bun add --no-save --exact @playwright/test@1.55.0
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Run complete Bun regression suite
        run: bun test
      - run: bun run build
      - run: bash scripts/install-playwright-chromium-ci.sh
      - name: Run Contributions browser qualification
        run: bunx playwright test tests/e2e/planner-contributions.spec.ts
      - run: git diff --check
      - name: Restore permanent Contributions workflow
        run: |
          cat > .github/workflows/contributions-resource-accounting.yml <<'FINAL_WORKFLOW'
          name: Contributions Resource Accounting

          on:
            pull_request:
              paths:
                - 'prisma/migrations/*contributions*/**'
                - 'src/lib/contributions*'
                - 'src/app/api/planner/contributions/**'
                - 'src/app/api/planner/budget/**'
                - 'src/app/api/planner/contribution-campaigns/**'
                - 'src/app/api/contribution-campaigns/**'
                - 'src/app/api/admin/contributions/**'
                - 'src/components/wedding/planner/**'
                - 'src/components/wedding/planner-workspace.tsx'
                - 'src/components/wedding/planner-workspace-stage7.tsx'
                - 'src/lib/planner-route-state.ts'
                - 'src/app/planner/contributions/**'
                - 'src/app/admin/contributions/**'
                - 'src/components/admin/admin-financial-contributions.tsx'
                - 'src/components/admin/secure-admin-financial-contributions.tsx'
                - 'src/components/admin/admin-utility-nav.tsx'
                - 'src/components/wedding/gift-registry-campaign-bridge.tsx'
                - 'src/components/wedding/invitation-gifting-link.tsx'
                - 'src/components/wedding/wedding-home.tsx'
                - 'src/components/wedding/invitation-rsvp-dialog.tsx'
                - 'src/components/wedding/import-export-bar.tsx'
                - 'src/lib/import-engine/**'
                - 'src/app/api/imports/**'
                - 'src/app/api/templates/**'
                - 'src/app/api/exports/**'
                - 'tests/e2e/planner-contributions.spec.ts'
                - 'tests/e2e/support/planner-browser.ts'
                - '.github/workflows/contributions-resource-accounting.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            qualify:
              runs-on: ubuntu-latest
              timeout-minutes: 70
              services:
                postgres:
                  image: postgres:16-alpine
                  env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: wewed
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
              env:
                CI: 'true'
                WEWED_E2E_MODE: '1'
                DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
                DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
                NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
                NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
                SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
                WEWED_SESSION_SECRET: ci-session-secret-not-for-production
                NEXT_PUBLIC_SITE_URL: http://localhost:3000
                NEXT_TELEMETRY_DISABLED: 1
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
                  with:
                    bun-version: 1.3.14
                - run: bun install --frozen-lockfile
                - run: bun add --no-save --exact @playwright/test@1.55.0
                - run: bunx prisma validate --schema prisma/schema.prisma
                - run: bunx prisma generate --schema prisma/schema.prisma
                - run: bunx prisma migrate deploy --schema prisma/schema.prisma
                - run: bun test
                - run: bun run build
                - run: bash scripts/install-playwright-chromium-ci.sh
                - run: bunx playwright test tests/e2e/planner-contributions.spec.ts
                - run: git diff --check
          FINAL_WORKFLOW
      - name: Commit qualified second-review remediation
        run: |
          rm -f \
            scripts/contributions-alignment-driver-v7.py \
            scripts/contributions-alignment-source.py \
            scripts/contributions-second-review-expansion.py \
            scripts/contributions-lifecycle-audit.py \
            scripts/contributions-integrity-permissions.py \
            scripts/contributions-final-hardening.py \
            scripts/contributions-final-invariants.py \
            scripts/contributions-phase1-phase3-financial-truth.py \
            scripts/contributions-phase2-detail-evidence.py \
            scripts/contributions-phase4-operational-integration.py \
            scripts/contributions-phase5-campaign-governance.py \
            scripts/contributions-phase6-productivity.py
          git config user.name "Wewed Contributions Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close Contributions stamped-plan gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
