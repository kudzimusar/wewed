name: Contributions Resource Accounting

on:
  pull_request:
    paths:
      - 'prisma/migrations/*contributions*/**'
      - 'src/lib/contributions*'
      - 'src/app/api/planner/contributions/**'
      - 'src/app/api/planner/budget/**'
      - 'src/app/api/planner/contribution-campaigns/**'
      - 'src/app/api/contribution-campaigns/**'
      - 'src/app/api/admin/contributions/**'
      - 'src/components/wedding/planner/**'
      - 'src/components/wedding/planner-workspace.tsx'
      - 'src/components/wedding/planner-workspace-stage7.tsx'
      - 'src/lib/planner-route-state.ts'
      - 'src/app/planner/contributions/**'
      - 'src/app/admin/contributions/**'
      - 'src/components/admin/admin-financial-contributions.tsx'
      - 'src/components/admin/secure-admin-financial-contributions.tsx'
      - 'src/components/admin/admin-utility-nav.tsx'
      - 'src/components/wedding/gift-registry-campaign-bridge.tsx'
      - 'src/components/wedding/invitation-gifting-link.tsx'
      - 'src/components/wedding/wedding-home.tsx'
      - 'src/components/wedding/invitation-rsvp-dialog.tsx'
      - 'src/components/wedding/import-export-bar.tsx'
      - 'src/lib/import-engine/**'
      - 'src/app/api/imports/**'
      - 'src/app/api/templates/**'
      - 'src/app/api/exports/**'
      - 'tests/e2e/planner-contributions.spec.ts'
      - 'tests/e2e/support/planner-browser.ts'
      - '.github/workflows/contributions-resource-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributions-resource-accounting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Run Bun regression against documented main baseline
        shell: bash
        run: |
          BASELINE_BROKEN=(
            './src/app/api/cron/communications-deliveries/route.test.ts'
            './src/app/api/webhooks/whatsapp/route.test.ts'
            './src/lib/communication-channels.test.ts'
            './src/lib/communications-rate-limit.test.ts'
            './src/lib/communications.integration.test.ts'
            './src/lib/vendor-marketplace-communications.integration.test.ts'
            './src/lib/wedding-communication-roles.test.ts'
          )
          find . -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
            -not -path './node_modules/*' \
            -not -path './.next/*' \
            -not -path './tests/e2e/*' \
            | sort > /tmp/wewed-bun-tests-all.txt
          cp /tmp/wewed-bun-tests-all.txt /tmp/wewed-bun-tests.txt
          for broken in "${BASELINE_BROKEN[@]}"; do
            if ! grep -Fxq "$broken" /tmp/wewed-bun-tests-all.txt; then
              echo "Documented baseline test is missing: $broken" >&2
              exit 1
            fi
            grep -Fxv "$broken" /tmp/wewed-bun-tests.txt > /tmp/wewed-bun-tests-next.txt
            mv /tmp/wewed-bun-tests-next.txt /tmp/wewed-bun-tests.txt
          done
          readarray -t BUN_TEST_FILES < /tmp/wewed-bun-tests.txt
          if [[ ${#BUN_TEST_FILES[@]} -eq 0 ]]; then
            echo 'No Bun regression tests discovered.' >&2
            exit 1
          fi
          bun test "${BUN_TEST_FILES[@]}"
      - run: bun run build
      - run: bun add --no-save --exact @playwright/test@1.55.0
      - run: bash scripts/install-playwright-chromium-ci.sh
      - name: Run Contributions browser qualification
        run: bunx playwright test tests/e2e/planner-contributions.spec.ts
      - run: git diff --check
