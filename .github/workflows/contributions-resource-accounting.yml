name: Contributions Resource Accounting

on:
  pull_request:
    paths:
      - 'prisma/migrations/20260819033000_contributions_resource_accounting/**'
      - 'src/lib/contributions*'
      - 'src/app/api/planner/contributions/**'
      - 'src/app/api/planner/budget/**'
      - 'src/app/api/planner/contribution-campaigns/**'
      - 'src/app/api/contribution-campaigns/**'
      - 'src/app/api/admin/contributions/**'
      - 'src/components/wedding/planner/**'
      - 'src/components/wedding/gift-registry-campaign-bridge.tsx'
      - 'src/components/wedding/invitation-gifting-link.tsx'
      - 'src/components/wedding/wedding-home.tsx'
      - 'src/components/wedding/invitation-rsvp-dialog.tsx'
      - '.github/workflows/contributions-resource-accounting.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - run: bun test src/lib/contributions.test.ts src/lib/contributions-source-contract.test.ts src/lib/contributions-db.test.ts
      - run: bun run build
      - run: git diff --check
