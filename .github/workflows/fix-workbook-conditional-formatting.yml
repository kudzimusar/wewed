name: Apply workbook conditional-formatting fix

on:
  push:
    branches:
      - fix/planner-complete-gap-closure
    paths:
      - .github/workflows/fix-workbook-conditional-formatting.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-complete-gap-closure
          fetch-depth: 0
      - name: Patch workbook generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/import-engine/template.ts')
          source = path.read_text()
          old = '''  const requiredRules = schema.fields.map((field, index) => {
            if (!field.required) return ''
            const column = XLSX.utils.encode_col(index)
            return `<conditionalFormatting sqref="${column}2:${column}${DATA_ROWS + 1}"><cfRule type="expression" dxfId="0" priority="${index + 1}"><formula>AND(COUNTA($A2:$${lastColumn}2)&gt;0,LEN(TRIM(${column}2))=0)</formula></cfRule></conditionalFormatting>`
          }).join('')
          const protection ='''
          new = '''  const requiredRules = schema.fields.map((field, index) => {
            if (!field.required) return ''
            const column = XLSX.utils.encode_col(index)
            return `<conditionalFormatting sqref="${column}2:${column}${DATA_ROWS + 1}"><cfRule type="expression" dxfId="0" priority="${index + 1}"><formula>AND(COUNTA($A2:$${lastColumn}2)&gt;0,LEN(TRIM(${column}2))=0)</formula></cfRule></conditionalFormatting>`
          }).join('')
          const guestIdentityRule = schema.key === 'guests'
            ? `<conditionalFormatting sqref="A2:${lastColumn}${DATA_ROWS + 1}"><cfRule type="expression" dxfId="0" priority="${schema.fields.length + 1}"><formula>AND(COUNTA($A2:$${lastColumn}2)&gt;0,COUNTA($A2,$B2,$D2,$E2)=0)</formula></cfRule></conditionalFormatting>`
            : ''
          const duplicateIdentityRules = ['guestId', 'email'].map((key, ruleIndex) => {
            const index = schema.fields.findIndex((field) => field.key === key)
            if (index < 0) return ''
            const column = XLSX.utils.encode_col(index)
            return `<conditionalFormatting sqref="${column}2:${column}${DATA_ROWS + 1}"><cfRule type="expression" dxfId="0" priority="${schema.fields.length + ruleIndex + 2}"><formula>AND(LEN(TRIM(${column}2))&gt;0,COUNTIF($${column}$2:$${column}$${DATA_ROWS + 1},${column}2)&gt;1)</formula></cfRule></conditionalFormatting>`
          }).join('')
          const conditionalRules = `${requiredRules}${guestIdentityRule}${duplicateIdentityRules}`
          const protection ='''
          if old not in source:
            raise SystemExit('Required-rule block was not found; refusing an unsafe patch.')
          source = source.replace(old, new, 1)
          old_insert = '`${protection}${filter}${requiredRules}${validationXml}`'
          new_insert = '`${protection}${filter}${conditionalRules}${validationXml}`'
          if old_insert not in source:
            raise SystemExit('Worksheet insertion point was not found; refusing an unsafe patch.')
          source = source.replace(old_insert, new_insert, 1)
          path.write_text(source)
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/import-engine/template.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(planner): emit workbook conditional formatting'
          git push origin HEAD:fix/planner-complete-gap-closure
