name: TEMP Phase 11A Reviewer Server Qualification

on:
  push:
    branches:
      - backend/wedding-day-ww2-phase11a-20260924

permissions:
  contents: read

concurrency:
  group: temp-phase11a-reviewer-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed_phase11a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed_phase11a?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed_phase11a?schema=public
      AUTHORITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed_phase11a?schema=public
      WEWED_SESSION_SECRET: phase11a-reviewer-ci-session-secret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: reviewer-ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: reviewer-ci-service-role-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and generate Prisma
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma generate --schema prisma/schema.prisma

      - name: Rehearse preflight against exact pre-11A schema
        run: |
          mv prisma/migrations/20260924000000_wedding_day_ww2_authority /tmp/20260924000000_wedding_day_ww2_authority
          bunx prisma migrate deploy --schema prisma/schema.prisma
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/native-mobile/migration-review/20260924000000_wedding_day_ww2_preflight.sql
          mv /tmp/20260924000000_wedding_day_ww2_authority prisma/migrations/

      - name: Apply Phase 11A migration and postflight
        run: |
          bunx prisma migrate deploy --schema prisma/schema.prisma
          bunx prisma migrate status --schema prisma/schema.prisma
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/native-mobile/migration-review/20260924000000_wedding_day_ww2_postflight.sql

      - name: Run Phase 11A and authority regressions
        run: |
          bun test             src/lib/wedding-day.integration.test.ts             src/lib/wedding-day-routes.integration.test.ts             src/lib/wedding-day-key-preflight.test.ts             src/lib/wedding-pass-issuance-window.test.ts             src/lib/gate-authority-boundary.test.ts             src/lib/production-authority/production-authority.integration.test.ts

      - name: Rehearse destructive rollback on disposable CI database only
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -c "SET wewed.phase11a_disposable_rehearsal = 'YES';"             -f docs/native-mobile/migration-review/20260924000000_wedding_day_ww2_rollback_rehearsal.sql
          bunx prisma migrate deploy --schema prisma/schema.prisma
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/native-mobile/migration-review/20260924000000_wedding_day_ww2_postflight.sql

      - name: Re-run Wedding Day domain tests after rollback/reapply
        run: |
          bun test             src/lib/wedding-day.integration.test.ts             src/lib/wedding-day-routes.integration.test.ts

      - name: Build production bundle with Wedding Day disabled
        run: bun run build
