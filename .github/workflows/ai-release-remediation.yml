name: AI Release Remediation

on:
  push:
    branches:
      - feature/ai-provider-router
    paths:
      - '.github/workflows/ai-release-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-provider-router
          fetch-depth: 0

      - name: Apply targeted release remediations
        run: python scripts/apply-ai-release-remediation.py

      - name: Commit remediations
        shell: bash
        run: |
          git config user.name "Wewed Release Bot"
          git config user.email "77352591+kudzimusar@users.noreply.github.com"
          git add -A
          git commit -m "Fix AI copy feedback and deterministic due-date reasoning"
          git push origin HEAD:feature/ai-provider-router
