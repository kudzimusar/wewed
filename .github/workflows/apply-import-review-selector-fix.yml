name: Apply stable import review selectors

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/planner-import-review-table-visibility' && !contains(github.event.pull_request.head.label, 'selector-fix-complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-import-review-table-visibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed selector patch
        run: node scripts/apply-import-review-selector-fix.mjs
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit stable product and test selectors
        run: |
          git config user.name "wewed-release-bot"
          git config user.email "77352591+kudzimusar@users.noreply.github.com"
          git add src/components/wedding/import-dialog.tsx tests/e2e/planner-overlay-containment.spec.ts tests/e2e/planner-data-workflows.spec.ts
          git commit -m "test(planner): target visible import review representations"
          git push origin HEAD:fix/planner-import-review-table-visibility
