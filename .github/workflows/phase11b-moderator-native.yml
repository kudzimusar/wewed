name: Phase 11B Moderator Native Qualification

on:
  pull_request:
  push:
    branches:
      - native-mobile/wedding-day-ww2-phase11b-20260924

permissions:
  contents: read

concurrency:
  group: phase11b-moderator-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Android debug build
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Swift tests
        working-directory: apps/ios
        run: swift test
      - name: Swift build
        working-directory: apps/ios
        run: swift build
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Simulator Debug build
        working-directory: apps/ios
        run: xcodebuild -project Wewed.xcodeproj -scheme Wewed -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
