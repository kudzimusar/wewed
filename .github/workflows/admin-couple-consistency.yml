name: Admin and Couple Consistency

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/admin-couple-responsive-consistency-20260807
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-couple-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify identity, navigation, responsive, and guest contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Admin, Couple, Planner, and guest consistency contract
        run: bun scripts/admin-couple-consistency-contract.ts

      - name: Run compact workspace navigation contract
        run: bun test src/lib/workspace-quick-navigation.test.ts

      - name: Lint changed implementation files
        run: >-
          bunx eslint
          scripts/admin-couple-consistency-contract.ts
          src/app/api/admin/account-identity/route.ts
          src/app/layout.tsx
          src/app/planner/layout.tsx
          'src/app/w/[slug]/page.tsx'
          src/components/admin/admin-account-identity-review.tsx
          src/components/admin/secure-wewed-admin.tsx
          src/components/couple/couple-dashboard.tsx
          src/components/navigation/workspace-quick-navigation.tsx
          src/components/wedding/couple-login.tsx
          src/components/wedding/global-wedding-tools.tsx
          src/components/wedding/wedding-home.tsx
          src/lib/wedding-access-kind.ts
          src/lib/workspace-quick-navigation.test.ts
