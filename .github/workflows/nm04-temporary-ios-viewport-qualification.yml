name: NM04 Temporary iOS Viewport Qualification

on:
  push:
    branches:
      - native-mobile/phase13-ios-guest-viewport-closure-nm04-20260925

permissions:
  contents: read

concurrency:
  group: nm04-ios-viewport-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS Swift + application build
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
      - name: Swift tests
        working-directory: apps/ios
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS app target for simulator
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project Wewed.xcodeproj
          -scheme Wewed
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
