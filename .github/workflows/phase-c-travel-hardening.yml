name: Phase C Travel Hardening

on:
  push:
    branches: [feature/ai-wedding-architect-phase-c]
    paths:
      - scripts/phase-c-travel-hardening.py
      - .github/workflows/phase-c-travel-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-wedding-architect-phase-c
      - name: Apply guarded travel/readiness patch
        run: python3 scripts/phase-c-travel-hardening.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'providerCountry' src/lib/wedding-architect-marketplace.ts
          grep -q 'travelKm: sameCountry && sameCity ? 0 : null' src/lib/wedding-architect-marketplace.ts
          grep -q 'isApprovedAutomaticPriceBinding' src/lib/wedding-architect-marketplace.ts
      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/wedding-architect-marketplace.ts
          git commit -m 'Fail closed on unknown Wedding Architect travel pricing'
          git push origin HEAD:feature/ai-wedding-architect-phase-c
