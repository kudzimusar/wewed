name: Admin Console CI

on:
  pull_request:
    paths:
      - 'src/app/admin/**'
      - 'src/app/api/admin/**'
      - 'src/components/admin/**'
      - 'src/lib/wewed-admin.ts'
      - 'scripts/provision-wewed-admin.ts'
      - 'prisma/migrations/**'
      - 'docs/WEWED_BUSINESS_ADMIN_CONSOLE_PLAN.md'
      - 'docs/WEWED_ADMIN_ACCESS.md'
      - '.github/workflows/admin-console-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-console-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed
      WEWED_SESSION_SECRET: ci-only-wewed-admin-console-secret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint admin console changes
        run: >-
          bunx eslint
          src/app/admin
          src/app/api/admin
          src/components/admin
          src/lib/wewed-admin.ts
          scripts/provision-wewed-admin.ts

      - name: Build application
        run: bun run build
