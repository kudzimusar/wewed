name: Admin Console CI

on:
  pull_request:
    paths:
      - 'src/app/layout.tsx'
      - 'src/app/page.tsx'
      - 'src/app/admin/**'
      - 'src/app/register/**'
      - 'src/app/billing/**'
      - 'src/app/api/admin/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/billing/**'
      - 'src/app/api/stripe/**'
      - 'src/components/admin/**'
      - 'src/components/public/**'
      - 'src/components/billing/**'
      - 'src/components/wedding/global-wedding-tools.tsx'
      - 'src/lib/business-access.ts'
      - 'src/lib/wewed-admin.ts'
      - 'src/lib/wewed-admin-policy.ts'
      - 'src/lib/wewed-admin-governance.test.ts'
      - 'src/lib/wedding-access.ts'
      - 'src/lib/stripe-billing.ts'
      - 'src/lib/wewed-plans.ts'
      - 'src/lib/supabase/service.ts'
      - 'scripts/provision-wewed-admin.ts'
      - 'scripts/public-registration-rbac-stripe-contract.ts'
      - 'scripts/wewed-data-pipeline-contract.ts'
      - 'scripts/wewed-pricing-billing-contract.ts'
      - 'prisma/migrations/**'
      - 'docs/WEWED_BUSINESS_ADMIN_CONSOLE_PLAN.md'
      - 'docs/WEWED_ADMIN_GOVERNANCE_ANALYTICS_PLAN.md'
      - 'docs/WEWED_PUBLIC_REGISTRATION_RBAC_STRIPE_PLAN.md'
      - 'docs/WEWED_PRICING_AND_BILLING_V1.md'
      - 'docs/WEWED_ADMIN_ACCESS.md'
      - '.github/workflows/admin-console-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-console-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed
      WEWED_SESSION_SECRET: ci-only-wewed-admin-console-secret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      VERCEL_ENV: preview
      STRIPE_TEST_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_TEST_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_TEST_PRICE_CANON_MONTHLY: price_ci_canon_monthly
      STRIPE_TEST_PRICE_CANON_ANNUAL: price_ci_canon_annual
      STRIPE_TEST_PRICE_FOREVER_MONTHLY: price_ci_forever_monthly
      STRIPE_TEST_PRICE_FOREVER_ANNUAL: price_ci_forever_annual
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run admin governance contracts
        run: bun test src/lib/wewed-admin-governance.test.ts

      - name: Run registration, RBAC and Stripe contracts
        run: bun scripts/public-registration-rbac-stripe-contract.ts

      - name: Run stakeholder data-pipeline contracts
        run: bun scripts/wewed-data-pipeline-contract.ts

      - name: Run pricing and billing contracts
        run: bun scripts/wewed-pricing-billing-contract.ts

      - name: Lint platform changes
        run: >-
          bunx eslint
          src/app/layout.tsx
          src/app/page.tsx
          src/app/admin
          src/app/register
          src/app/billing
          src/app/api/admin
          src/app/api/auth
          src/app/api/billing
          src/app/api/stripe
          src/components/admin
          src/components/public
          src/components/billing
          src/components/wedding/global-wedding-tools.tsx
          src/lib/business-access.ts
          src/lib/wewed-admin.ts
          src/lib/wewed-admin-policy.ts
          src/lib/wewed-admin-governance.test.ts
          src/lib/wedding-access.ts
          src/lib/stripe-billing.ts
          src/lib/wewed-plans.ts
          src/lib/supabase/service.ts
          scripts/provision-wewed-admin.ts
          scripts/public-registration-rbac-stripe-contract.ts
          scripts/wewed-data-pipeline-contract.ts
          scripts/wewed-pricing-billing-contract.ts

      - name: Build application
        run: bun run build

      - name: Upload reviewed Preview source
        uses: actions/upload-artifact@v4
        with:
          name: wewed-preview-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          retention-days: 1
