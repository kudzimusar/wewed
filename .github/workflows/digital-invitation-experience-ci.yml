name: Digital Invitation Experience CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/w/**'
      - 'src/app/api/planner/guests/invitations/route.ts'
      - 'src/components/wedding/digital-invitation-card.tsx'
      - 'src/components/wedding/invitation-manager.tsx'
      - 'src/components/wedding/invitation-experience/**'
      - 'src/components/wedding/rsvp-section.tsx'
      - 'src/components/wedding/wedding-home.tsx'
      - 'src/lib/digital-invitation-card.ts'
      - 'src/lib/digital-invitation-card.test.ts'
      - 'src/lib/digital-invitation-experience.test.ts'
      - 'prisma/migrations/20260910030000_premium_invitation_styles/migration.sql'
      - 'tests/e2e/premium-digital-invitation.spec.ts'
      - '.github/workflows/digital-invitation-experience-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/app/w/**'
      - 'src/components/wedding/digital-invitation-card.tsx'
      - 'src/components/wedding/invitation-manager.tsx'
      - 'src/components/wedding/invitation-experience/**'
      - 'src/components/wedding/rsvp-section.tsx'
      - 'src/components/wedding/wedding-home.tsx'
      - 'src/lib/digital-invitation-card.ts'
      - 'src/lib/digital-invitation-card.test.ts'
      - 'src/lib/digital-invitation-experience.test.ts'
      - 'prisma/migrations/20260910030000_premium_invitation_styles/migration.sql'
      - 'tests/e2e/premium-digital-invitation.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-invitation-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invitation-experience-contract:
    name: Validate premium invitation experience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run invitation registry and experience contracts
        run: bun test src/lib/digital-invitation-card.test.ts src/lib/digital-invitation-experience.test.ts

      - name: Reject TypeScript errors in premium invitation files
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit --pretty false 2>&1 | tee /tmp/wewed-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E 'src/(app/w/|components/wedding/(digital-invitation-card|invitation-manager|invitation-experience/|rsvp-section|wedding-home)|lib/digital-invitation-card)' /tmp/wewed-tsc.log; then
            echo 'TypeScript reported an error in the premium invitation implementation.' >&2
            exit 1
          fi
          echo "Repository-wide TypeScript exit code: ${status}. No premium invitation file errors found."
