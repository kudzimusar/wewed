name: Phase 13 NM01 Backend Moderator Qualification

on:
  push:
    branches:
      - backend/phase13-digital-invitation-convergence-nm01-20260925

permissions:
  contents: read

concurrency:
  group: phase13-nm01-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/wewed?schema=public
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run invitation convergence contracts
        run: |
          bun test src/lib/digital-invitation-card.test.ts
          bun test src/lib/invitation-links.test.ts
          bun test src/lib/personal-invitation-mobile-entry.test.ts

      - name: Reject TypeScript errors in changed backend surfaces
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit --pretty false > /tmp/wewed-tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          errors="$(grep -E '^(src/(components/wedding/invitation-app-handoff|app/api/wedding-day/guest/route|lib/(digital-invitation-card|invitation-links|personal-invitation-mobile-entry\.test))\.(ts|tsx))' /tmp/wewed-tsc.log || true)"
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi
          echo "Repository-wide TypeScript exit code: $status. No changed backend-surface errors found."
