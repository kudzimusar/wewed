name: Contributions Partial Payment UAT Materializer

on:
  push:
    branches:
      - fix/contributions-partial-payments-uat-20260820
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions-partial-payment-materialize-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      WEWED_E2E_MODE: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Stop when already materialized
        id: materializer
        shell: bash
        run: |
          if [[ ! -f scripts/contributions-partial-payments-uat.py ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Product is already materialized on this branch.'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.materializer.outputs.run == 'true'
        with:
          bun-version: 1.3.14
      - name: Materialize accounting coherence patch
        if: steps.materializer.outputs.run == 'true'
        run: python3 scripts/contributions-partial-payments-uat.py
      - if: steps.materializer.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.materializer.outputs.run == 'true'
        run: bunx prisma validate --schema prisma/schema.prisma
      - if: steps.materializer.outputs.run == 'true'
        run: bunx prisma generate --schema prisma/schema.prisma
      - if: steps.materializer.outputs.run == 'true'
        run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Run Contributions accounting regressions
        if: steps.materializer.outputs.run == 'true'
        run: bun test src/lib/contributions.test.ts src/lib/contributions-funding-uat-regression.test.ts src/lib/contributions-partial-payments-uat.test.ts src/lib/contributions-source-contract.test.ts
      - if: steps.materializer.outputs.run == 'true'
        run: bun run build
      - if: steps.materializer.outputs.run == 'true'
        run: bun add --no-save --exact @playwright/test@1.55.0
      - if: steps.materializer.outputs.run == 'true'
        run: bash scripts/install-playwright-chromium-ci.sh
      - name: Run Contributions browser gate
        if: steps.materializer.outputs.run == 'true'
        run: bunx playwright test tests/e2e/planner-contributions.spec.ts
      - if: steps.materializer.outputs.run == 'true'
        run: git diff --check
      - name: Publish qualified product tree
        if: steps.materializer.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'wewed-uat-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git rm scripts/contributions-partial-payments-uat.py
          git add \
            src/lib/contributions.ts \
            src/lib/contributions/store.ts \
            src/app/api/planner/contributions/[id]/route.ts \
            src/app/api/planner/contributions/[id]/actions/route.ts \
            src/app/api/planner/budget/route.ts \
            src/components/wedding/planner/modules/planner-budget-module.tsx \
            src/components/wedding/planner/planner-contributions-workspace.tsx \
            src/lib/contributions-partial-payments-uat.test.ts
          git diff --cached --check
          git commit -m 'Align Contributions partial payments across Planner accounting'
          git push origin HEAD:fix/contributions-partial-payments-uat-20260820
