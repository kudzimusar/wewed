name: Materialize Regression Fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and materialize exact patch
        env:
          PATCH_SHA256: a1ed94474d5dd95fb5eb8dff899f5050c84d27fcab2ee12ae5712da6f0818dcb
        run: |
          test -d .patch
          cat .patch/regression.part* > /tmp/regression.b64
          python - <<'PY'
          import base64
          import hashlib
          import io
          import os
          import tarfile

          encoded = open('/tmp/regression.b64', 'rb').read()
          payload = base64.b64decode(encoded)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != os.environ['PATCH_SHA256']:
              raise SystemExit(f'digest mismatch: {actual}')
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              archive.extractall('.')
          PY
          rm -rf .patch
          rm -f .github/workflows/apply-regression-payload.yml

      - name: Commit clean source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: close marketplace and priority regressions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
