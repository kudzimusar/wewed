name: Apply planner gap closure patch

on:
  push:
    branches:
      - fix/planner-complete-gap-closure
    paths:
      - '.gap/patch.part.*'
      - '.github/workflows/apply-planner-gap-closure.yml'

permissions:
  contents: write

concurrency:
  group: apply-planner-gap-closure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/planner-complete-gap-closure
          fetch-depth: 0

      - name: Apply exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.gap/patch.part.*)
          test "${#parts[@]}" -eq 8
          cat "${parts[@]}" | base64 -d | xz -dc > /tmp/full-planner-gap-closure.patch
          git apply --check /tmp/full-planner-gap-closure.patch
          git apply /tmp/full-planner-gap-closure.patch
          rm -f "${parts[@]}"
          rmdir .gap 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(planner): close all recorded UAT gaps'
          git push origin HEAD:fix/planner-complete-gap-closure
