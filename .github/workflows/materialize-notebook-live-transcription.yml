name: Materialize Notebook Live Transcription

# Branch-scoped one-shot materializer. Remove before merge.
on:
  push:
    branches:
      - fix/notebook-zai-live-transcription-20260820
    paths:
      - scripts/materialize-notebook-live-transcription.py
      - .github/workflows/materialize-notebook-live-transcription.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/notebook-zai-live-transcription-20260820
          fetch-depth: 0
      - name: Apply bounded Notebook workspace transformation
        run: python3 scripts/materialize-notebook-live-transcription.py
      - name: Commit materialized product change
        run: |
          if git diff --quiet -- src/components/notebook/notebook-workspace.tsx; then
            echo 'Notebook workspace already materialized.'
            exit 0
          fi
          git config user.name 'wewed-notebook-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/notebook/notebook-workspace.tsx
          git commit -m 'Materialize private live Notebook transcription'
          git push origin HEAD:fix/notebook-zai-live-transcription-20260820
