name: Service Engagement Party Nesting Hotfix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-engagement-party-nesting-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: python3 scripts/fix-service-engagement-party-nesting.py
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate --schema prisma/schema.prisma
      - run: bunx prisma generate --schema prisma/schema.prisma
      - run: bunx prisma migrate deploy --schema prisma/schema.prisma
      - name: Run Phase 2 regressions
        run: bun test src/lib/contracts-phase2.test.ts src/lib/planner-phase2.test.ts
      - run: bun run build
      - run: git diff --check
      - name: Publish qualified product change
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name 'wewed-hotfix-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/contracts/phase2.ts src/lib/contracts-phase2.test.ts
          git diff --cached --check
          git commit -m 'Fix nested Service Engagement party creation'
          git push origin HEAD:fix/service-engagement-party-nesting-20260822
