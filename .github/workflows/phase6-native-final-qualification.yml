name: Phase 6 Native Final Qualification

on:
  push:
    branches:
      - native-mobile/multi-context-isolation-phase6-20260922
    paths:
      - '.github/workflows/phase6-native-final-qualification.yml'

permissions:
  contents: read

jobs:
  ios:
    name: iOS Phase 6 final gate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
      - name: Run Swift tests
        working-directory: apps/ios
        run: swift test
      - name: Build Swift package
        working-directory: apps/ios
        run: swift build
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS simulator app
        working-directory: apps/ios
        run: >
          xcodebuild -project Wewed.xcodeproj -scheme Wewed -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS release app
        working-directory: apps/ios
        run: >
          xcodebuild -project Wewed.xcodeproj -scheme Wewed -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android Phase 6 final gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests and debug/release assembly
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace

