name: Android Invitation Production Play AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Google Play versionCode. Must be greater than every existing pro.wewed.app versionCode.'
        required: true
        default: '8'
        type: string
      version_name:
        description: 'Production Android versionName. Do not use a UAT suffix.'
        required: true
        default: '2.0.5'
        type: string

permissions:
  contents: read

concurrency:
  group: android-invitation-production-play-aab-main
  cancel-in-progress: false

env:
  WEWED_ANDROID_PRODUCTION_VERSION_CODE: ${{ inputs.version_code }}
  WEWED_ANDROID_PRODUCTION_VERSION_NAME: ${{ inputs.version_name }}

jobs:
  signed-candidate:
    # Secrets may only be read by a deliberate release run from protected main.
    if: github.ref == 'refs/heads/main'
    name: Build signed production AAB without Play publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify exact candidate SHA
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA" || {
            echo "::error::Checked out $actual but expected $EXPECTED_CANDIDATE_SHA"
            exit 1
          }
          echo "Android production AAB exact main SHA=$actual"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Verify production wrapper and invitation handoff regressions
        run: bun test src/lib/invitation-links.test.ts src/lib/android-production-wrapper-contract.test.ts
      - name: Detect Android signing credentials
        id: credentials
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WEWED_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WEWED_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WEWED_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WEWED_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'signing=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::The required Wewed Android upload-key secrets are not configured.'
            exit 1
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Materialize upload keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WEWED_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/wewed-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
      - name: Build signed production app bundle
        working-directory: android
        env:
          WEWED_UPLOAD_STORE_FILE: ${{ steps.keystore.outputs.path }}
          WEWED_UPLOAD_STORE_PASSWORD: ${{ secrets.WEWED_UPLOAD_STORE_PASSWORD }}
          WEWED_UPLOAD_KEY_ALIAS: ${{ secrets.WEWED_UPLOAD_KEY_ALIAS }}
          WEWED_UPLOAD_KEY_PASSWORD: ${{ secrets.WEWED_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
      - name: Verify signed production bundle contract
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          EXPECTED_UPLOAD_CERT_SHA256='C3D856D782F642C6884D982552F567653E35D5DA1EABB112EF6FC0598E88658C'
          test -f "$AAB"
          RELEASE_MANIFEST="$(find android/app/build/intermediates/merged_manifests/release -type f -name AndroidManifest.xml | head -n 1)"
          test -n "$RELEASE_MANIFEST"
          grep -q 'package="pro.wewed.app"' "$RELEASE_MANIFEST"
          grep -q "android:versionCode=\"$EXPECTED_VERSION_CODE\"" "$RELEASE_MANIFEST"
          grep -q "android:versionName=\"$EXPECTED_VERSION_NAME\"" "$RELEASE_MANIFEST"
          grep -q 'android:host="@string/hostName"' "$RELEASE_MANIFEST"
          ! grep -q 'uat.wewed.pro' "$RELEASE_MANIFEST"
          RELEASE_VALUES="$(find android/app/build/intermediates/packaged_res/release -type f -name values.xml | head -n 1)"
          test -n "$RELEASE_VALUES"
          grep -q '<string name="hostName" translatable="false">wewed.pro</string>' "$RELEASE_VALUES"
          grep -q '<string name="appName" translatable="false">Wewed</string>' "$RELEASE_VALUES"
          RELEASE_BUILD_CONFIG="$(find android/app/build/generated/source/buildConfig/release -type f -name BuildConfig.java | head -n 1)"
          test -n "$RELEASE_BUILD_CONFIG"
          grep -q 'boolean UAT = false;' "$RELEASE_BUILD_CONFIG"
          grep -q 'String INVITATION_RESUME_ORIGIN = "https://wewed.pro";' "$RELEASE_BUILD_CONFIG"
          jarsigner -verify "$AAB" >/dev/null
          actual_upload_cert_sha256="$(
            keytool -printcert -jarfile "$AAB" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -n 1 \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$actual_upload_cert_sha256"
          test "$actual_upload_cert_sha256" = "$EXPECTED_UPLOAD_CERT_SHA256"
          unzip -t "$AAB" >/dev/null
      - name: Upload signed production candidate
        uses: actions/upload-artifact@v4
        with:
          name: wewed-production-play-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
