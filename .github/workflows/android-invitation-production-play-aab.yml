name: RETIRED - Android Invitation Production Play AAB (legacy TWA)

# QRO07-SHIP01: the legacy TWA in android/ may no longer produce a pro.wewed.app production
# candidate. Its source stays for history; signing and Play candidates come only from apps/android.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired Play signing path
        run: |
          echo "::error::Retired by QRO07-SHIP01. The only Google Play production authority for pro.wewed.app is apps/android."
          echo "Use the 'Android Native Production Play AAB' workflow (android-native-production-play-aab.yml)."
          exit 1
