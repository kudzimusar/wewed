name: Apply final planner deep-link fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-planner-deep-link-final-fixes.py'
      - '.github/workflows/planner-deep-link-final-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed final fixes
        run: python scripts/apply-planner-deep-link-final-fixes.py

      - name: Commit product and test changes
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'wewed-release-bot'
          git config user.email '77352591+kudzimusar@users.noreply.github.com'
          git add \
            src/components/wedding/planner-workspace-stage7.tsx \
            src/components/wedding/planner-portal.tsx \
            src/components/ui/dialog.tsx \
            src/components/wedding/import-dialog.tsx \
            src/lib/planner-complete-gap-closure.test.ts \
            tests/e2e/planner-data-workflows.spec.ts \
            tests/e2e/planner-deep-link-navigation.spec.ts
          git commit -m 'fix(planner): preserve exact URL context across refresh'
          git push origin HEAD:${{ github.head_ref }}
