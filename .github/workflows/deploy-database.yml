name: Verify production database authority

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type verify-wewed to run read-only production authority checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Supabase production migration authority
    if: ${{ inputs.confirmation == 'verify-wewed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      DATABASE_URL: ${{ secrets.WEWED_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.WEWED_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Verify Wewed database target
        shell: bash
        run: |
          test -n "$DATABASE_URL" || {
            echo "::error::WEWED_DATABASE_URL is not configured"
            exit 1
          }

          [[ "$DATABASE_URL" == *"kjigkhjdeymukwradoqu"* ]] || {
            echo "::error::The database URL is not for the Wewed Supabase project"
            exit 1
          }

          [[ "$DATABASE_URL" == *":5432/"* ]] || {
            echo "::error::Use the Supabase session pooler on port 5432"
            exit 1
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma application schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Verify Supabase is the production DDL authority
        shell: bash
        run: |
          authority_rows=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where name = 'production_schema_reconciliation'" \
            | tr -d '[:space:]')

          if [[ "$authority_rows" != "1" ]]; then
            echo "::error::Production schema reconciliation is not recorded exactly once in the Supabase migration ledger."
            exit 1
          fi

          unresolved_prisma=$(psql "$DATABASE_URL" -Atqc \
            "select coalesce(string_agg(migration_name, ',' order by migration_name), '') from public._prisma_migrations where finished_at is null and rolled_back_at is null" \
            | tr -d '[:space:]')

          if [[ "$unresolved_prisma" != "20260729131000_normalize_planner_metadata" ]]; then
            echo "::error::Unexpected Prisma production-ledger state: $unresolved_prisma"
            echo "Prisma is not the Wewed production DDL executor. Investigate before any schema change."
            exit 1
          fi

          guest_delete_guard=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from pg_trigger where tgname = 'wewed_delete_guest_contribution_before_guest' and not tgisinternal" \
            | tr -d '[:space:]')
          legacy_sync_functions=$(psql "$DATABASE_URL" -Atqc \
            "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('sync_vendor_planner_metadata','sync_programme_item_metadata')" \
            | tr -d '[:space:]')

          if [[ "$guest_delete_guard" != "1" || "$legacy_sync_functions" != "0" ]]; then
            echo "::error::Production reconciliation objects do not match the reviewed authority contract."
            exit 1
          fi

          echo "Supabase migration ledger is the production DDL authority."
          echo "Historical Prisma production ledger is read-only and intentionally not replayed."

      - name: Assert this workflow cannot mutate production DDL
        shell: bash
        run: |
          workflow_file='.github/workflows/deploy-database.yml'
          if grep -nE 'bunx prisma migrate (deploy|resolve)|supabase db push|psql .*-[cf].*\.sql' "$workflow_file"; then
            echo "::error::Production database verification workflow contains a DDL execution command."
            exit 1
          fi
          echo "Read-only production database authority verification complete."
