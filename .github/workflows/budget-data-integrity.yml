name: Budget Data Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - release/worksheet-seating-20260804
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-data-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-trigger:
    name: Verify Budget mutation recovery history
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wewed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Apply all migrations to a clean database
        run: bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify Budget insert, update, and delete audits
        run: psql "postgresql://postgres:postgres@localhost:5432/wewed" -v ON_ERROR_STOP=1 -f scripts/budget-audit-trigger-postgres-integration.sql
