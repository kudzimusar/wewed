name: Vendor Session CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/api/auth/**'
      - 'src/lib/app-session.ts'
      - 'src/lib/admin-auth.ts'
      - 'src/app/vendor/**'
      - 'src/app/vendors/page.tsx'
      - 'scripts/vendor-session-messages-contract.ts'
      - '.github/workflows/vendor-session-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-session-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Vendor session persistence and inbox access
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wewed?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      WEWED_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vendor session and Messages source contract
        run: bun scripts/vendor-session-messages-contract.ts

      - name: Run communications policy contracts
        run: bun test src/lib/communications-policy.test.ts src/lib/communications-client-state.test.ts

      - name: Build application
        run: bun run build
