<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#BF9B5F" />
    <title>Wewed is offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #211712; background: #fbf6ee; }
      main { width: min(100%, 480px); text-align: center; padding: 42px 28px; border: 1px solid rgba(191, 155, 95, .38); border-radius: 28px; background: rgba(255, 255, 255, .82); box-shadow: 0 20px 60px rgba(33, 23, 18, .1); }
      img { width: 116px; height: 116px; border-radius: 24px; }
      h1 { margin: 24px 0 10px; font-family: Georgia, serif; font-size: 34px; }
      p { margin: 0 auto; max-width: 34ch; line-height: 1.6; color: rgba(33, 23, 18, .7); }
      button { margin-top: 26px; min-height: 48px; border: 0; border-radius: 999px; padding: 0 24px; color: #fbf6ee; background: #211712; font: 700 14px Inter, system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Wewed" />
      <h1>You’re offline</h1>
      <p>Your private wedding information is never stored in this offline page. Reconnect to continue planning.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
