appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Sign In
# Entry now runs through the Wewed welcome surface rather than a development login form with
# a role chooser and a shipped password. Shadow and UAT lanes enter through the environment
# affordance, which carries no credential and exists only where persona switching is permitted.
- assertVisible: "Wewed"
- tapOn:
    id: "welcome-shadow-entry"

# 2. Home
- assertVisible:
    id: "home-root"
- scrollUntilVisible:
    element:
      id: "home-continue-planning"
    direction: DOWN

# 3. Planner
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- scrollUntilVisible:
    element:
      id: "planner-module-tasks"
    direction: DOWN

# 4. Guests
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- scrollUntilVisible:
    element:
      id: "guests-filter-all"
    direction: DOWN

# 5. Wedding Day (IA V2: Pass moved into the Wedding Day workspace)
- tapOn: "Wedding Day"
- assertVisible:
    id: "couple-wedding_day"

# 6. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
