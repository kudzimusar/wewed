appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Home
- assertVisible:
    id: "home-root"
- assertVisible:
    id: "home-continue-planning"

# 3. Planner
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible:
    id: "planner-module-tasks"

# 4. Guests
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- assertVisible:
    id: "guests-filter-all"

# 5. Wedding Day (IA V2: Pass moved into the Wedding Day workspace)
- tapOn: "Wedding Day"
- assertVisible:
    id: "couple-wedding_day"

# 6. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
