appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Authentication
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Home
- assertVisible:
    id: "home-root"
- assertVisible: "Continue Planning"

# 3. Planner
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible:
    id: "planner-module-tasks"
# The Level-2 worksheet chips sit above the module grid, so the later modules need a scroll.
- scrollUntilVisible:
    element:
      id: "planner-module-seating"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "planner-module-timeline"
    direction: DOWN

# 4. Guests
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- assertVisible:
    id: "guests-search"

# 5. Wedding Day workspace (IA V2: My Pass lives here; the couple holds no guest credential).
- tapOn: "Wedding Day"
- assertVisible:
    id: "couple-wedding_day"
    retryTapIfNoChange: true
- tapOn:
    id: "gate-scanner-exit"
    optional: true
    retryTapIfNoChange: true
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- assertNotVisible: "Gate Scanner"

# 6. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
- assertVisible: "Our Story"
- assertVisible: "Gallery"
- assertVisible: "Honeymoon"
