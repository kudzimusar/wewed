appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Authentication
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Home
- assertVisible:
    id: "home-root"
- assertVisible: "Continue Planning"

# 3. Planner
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible:
    id: "planner-module-tasks"
- assertVisible:
    id: "planner-module-seating"
- assertVisible:
    id: "planner-module-timeline"

# 4. Guests
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- assertVisible:
    id: "guests-search"

# 5. Wedding Pass & Gate Scanner
- tapOn: "Pass"
- assertVisible:
    id: "pass-root"
- assertVisible:
    id: "wedding-pass-card"
- assertVisible:
    id: "wedding-pass-qr"
- tapOn:
    id: "pass-open-scanner"
- assertVisible: "Gate Scanner"
- tapOn:
    id: "gate-scanner-done"
    optional: true
    retryTapIfNoChange: true
- tapOn:
    id: "gate-scanner-exit"
    optional: true
    retryTapIfNoChange: true
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- assertNotVisible: "Gate Scanner"

# 6. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
- assertVisible: "Our Story"
- assertVisible: "Gallery"
- assertVisible: "Honeymoon"
