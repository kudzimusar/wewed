appId: pro.wewed.app
---
- launchApp:
    clearState: true

# 1. Authentication Check
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Overview / Home Screen
- assertVisible: "Tariro & Shadreck"
- assertVisible: "NEXT UP"
- assertVisible: "YOUR WEDDING PASS"

# 3. Planner & Task Management
- tapOn: "Plan"
- assertVisible: "Wedding Planner"
- assertVisible: "Finalize seating chart with venue manager"

# 4. Guests & Seating Search
- tapOn: "Guests"
- assertVisible: "Guest List"
- assertVisible: "Musarurwa Family"
- assertVisible: "Baobab — 1"

# 5. Wedding Pass & Gate Scanner
- tapOn: "Pass"
- assertVisible: "WEWED WEDDING PASS"
- assertVisible: "Jane & Michael Doe"
- assertVisible: "Jacaranda — 8"
- scroll
- tapOn: "Usher Check-In Mode"
- assertVisible: "Gate Scanner"
- tapOn: "Scan Jane (x2)"
- assertVisible: "Admitted — Partial Arrival"
- tapOn: "Scan Jane (x2)"
- assertVisible: "Admitted — Full Party"
- tapOn:
    id: "gate-scanner-exit"
    optional: true
    retryTapIfNoChange: true
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- assertNotVisible: "Gate Scanner"

# 6. Live Wall & Celebratory Interactivity
- tapOn: "Live"
- assertVisible: "Live Wall"
- tapOn: "Applaud"
- assertVisible: "Send Well Wishes"
