appId: ${APP_ID:-pro.wewed.app}
---
- launchApp:
    clearState: true

# 1. Authentication Check
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Overview / Home Screen
- assertVisible: "Wedding Overview"
- assertVisible: "Tariro & Shadreck"
- assertVisible: "24 October 2026 • Harare, Zimbabwe"
- assertVisible: "The Venue"
- assertVisible: "Imba Manor Estate"
- assertVisible: "The Day's Programme"
- assertVisible: "Ceremony & Vows"

# 3. Planner & Task Management
- tapOn: "Plan"
- assertVisible: "Wedding Planner"
- assertVisible: "Budget Overview"
- assertVisible: "Total"
- assertVisible: "Finalize seating chart with venue manager"

# 4. Guests & Seating Search
- tapOn: "Guests"
- assertVisible: "Guest List"
- assertVisible: "Invited"
- assertVisible: "Attending"
- tapOn: "Search guest name, household, table"
- inputText: "Musarurwa"
- assertVisible: "Musarurwa Family"
- assertVisible: "Baobab — 1"

# 5. Wedding Pass & Usher Scanner
- tapOn: "Pass"
- assertVisible: "WEWED WEDDING PASS"
- assertVisible: "Jane & Michael Doe"
- assertVisible: "Jacaranda — 8"
- tapOn: "Usher Check-In Mode"
- assertVisible: "Usher Scanner"
- tapOn: "Simulate Scan (Jane & Michael)"
- assertVisible: "Verified"
- assertVisible: "Table: Jacaranda — 8"
- tapOn: "Close"

# 6. Live Wall & Celebratory Interactivity
- tapOn: "Live"
- assertVisible: "Live Wall"
- assertVisible: "Live Celebration"
- tapOn: "Applaud"
- assertVisible: "Send Well Wishes"
