appId: pro.wewed.app.dev
---
# LOCAL ONLY. Invitation -> RSVP -> Pass for one real runtime guest, compared without naming them.
- launchApp:
    # The snapshot lives in app storage; clearing state would delete it. The app keeps no
    # persisted session, so every launch still starts signed out.
    clearState: false
    stopApp: true
    arguments:
      wewed_native_env: "private_real_shadow"
      wewed_shadow_account: "guest"
      wewed_invitation_token: "shadow-pending-guest"

- tapOn: "Sign In"
- assertVisible:
    id: "shadow-source-private-real-shadow"
- assertVisible:
    id: "guest-shell-root"
- extendedWaitUntil:
    visible:
      id: "ivory-invitation-root"
    timeout: 7000
- assertNotVisible: ".*Guest G[0-9]+.*"
- copyTextFrom:
    id: "invitation-guest-name"
- assertVisible:
    id: "invitation-open-maps"

- scrollUntilVisible:
    element:
      id: "ivory-rsvp-accept"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "ivory-rsvp-accept"

- tapOn: "My Pass"
- extendedWaitUntil:
    visible:
      id: "wedding-pass-card"
    timeout: 7000
- assertVisible:
    id: "guest-pass-guest-name"
    text: "${maestro.copiedText}"
- assertNotVisible: ".*Guest G[0-9]+.*"
- assertVisible:
    id: "pass-open-maps"
