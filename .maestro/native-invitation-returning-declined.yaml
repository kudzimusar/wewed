appId: pro.wewed.app.dev
---
# A guest who declined keeps their invitation, and never gets a pass.
#
# Declining removes the pass, not the invitation. The wedding's public content stays open to them.
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

- openLink: "wewed://invite/shadow_ref_charity_kudzie?rsvp=shadow-declined-guest"

- extendedWaitUntil:
    visible:
      id: "invitation-trifold"
    timeout: 8000
- assertVisible:
    id: "invitation-closed-cover"

- tapOn:
    id: "invitation-open-button"
- extendedWaitUntil:
    visible:
      id: "invitation-panel-centre"
    timeout: 8000

# "Response recorded", not the RSVP cue. A declined guest is an answered guest.
- assertVisible:
    id: "invitation-response-recorded"
- assertNotVisible:
    id: "invitation-rsvp-confirmed"
- assertNotVisible:
    id: "invitation-rsvp-prompt"

- tapOn:
    id: "invitation-details-button"
- extendedWaitUntil:
    visible:
      id: "invitation-interactive-details"
    timeout: 5000

# The pass is the line that must not be crossed.
- assertNotVisible:
    id: "invitation-cta-pass"
