appId: pro.wewed.app
tags:
  - android
  - public-smoke
---
- launchApp:
    clearState: true
# A fresh GitHub runner has an empty Metro cache. Expo SDK 57 can spend well
# over 30 seconds compiling the first Android bundle before React renders the
# sign-in route, so this gate must measure application readiness rather than
# runner cache warmth. All downstream assertions remain unchanged.
- extendedWaitUntil:
    visible: "Your wedding world, in your hand."
    timeout: 120000
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Sign in to Wewed"
- tapOn: "Sign in to Wewed"
- assertVisible: "Enter your Wewed email and password."
- openLink:
    link: "wewed://messages"
- extendedWaitUntil:
    visible: "Sign in, then continue."
    timeout: 15000
- assertVisible: "Sign in to continue"
- assertVisible: "Cancel"
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Your wedding world, in your hand."
    timeout: 15000
- takeScreenshot: native-public-smoke-complete
