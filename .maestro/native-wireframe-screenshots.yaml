appId: pro.wewed.app.dev
---
# SANITIZED evidence only. These captures are Git/CI-safe and show pseudonymous guests
# (Guest G###) by design. They are never evidence of Private Real Shadow fidelity;
# see scripts/native/private-real-qualification.sh for that (local only).
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "sanitized_shadow"

- assertVisible: "WEWED"
- tapOn: "Sign In"
- assertVisible:
    id: "shadow-source-sanitized-shadow"

- assertVisible:
    id: "home-root"
- takeScreenshot: sanitized-wireframe-home

- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible: "Our Wedding Plan"
- takeScreenshot: sanitized-wireframe-plan

- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- takeScreenshot: sanitized-wireframe-guests

- tapOn: "Pass"
- assertVisible:
    id: "pass-root"
- assertVisible:
    id: "wedding-pass-qr"
- takeScreenshot: sanitized-wireframe-pass

- tapOn: "More"
- assertVisible:
    id: "more-root"
- takeScreenshot: sanitized-wireframe-more

- tapOn: "Home"
- assertVisible:
    id: "home-root"
- tapOn:
    id: "home-open-invitation"
- extendedWaitUntil:
    visible:
      id: "ivory-invitation-root"
    timeout: 7000
- assertVisible:
    id: "invitation-preview-notice"
- waitForAnimationToEnd
- takeScreenshot: sanitized-wireframe-invitation
