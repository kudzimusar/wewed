appId: pro.wewed.app
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "private_real_shadow"

# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Home / real wedding graph
- assertVisible:
    id: "home-root"
- assertVisible: "OUR WEDDING JOURNEY"
- assertVisible:
    id: "home-metrics"

# 3. Planner / same real wedding graph
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible: "Wedding Planner"
- assertVisible:
    id: "planner-module-tasks"
- assertVisible:
    id: "planner-module-budget"
- assertVisible:
    id: "planner-module-vendors"

# 4. Guests / do not bind Git tests to private names
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- assertVisible:
    id: "guests-search"
- assertNotVisible: "Guest G001"

# 5. Pass
- tapOn: "Pass"
- assertVisible:
    id: "pass-root"
- assertVisible:
    id: "wedding-pass-card"

# 6. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
