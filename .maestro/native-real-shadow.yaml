appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "private_real_shadow"

# 1. Sign In and prove the explicitly requested data source loaded.
- assertVisible: "WEWED"
- tapOn: "Sign In"
- assertVisible:
    id: "shadow-source-private-real-shadow"

# 2. Home / real wedding graph
- assertVisible:
    id: "home-root"
- assertVisible: "OUR WEDDING JOURNEY"
- assertVisible:
    id: "home-metrics"

# 3. Planner / same real wedding graph
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible: "Our Wedding Plan"
- assertVisible:
    id: "planner-module-tasks"
- assertVisible:
    id: "planner-module-budget"
- assertVisible:
    id: "planner-module-contributions"
- assertVisible:
    id: "planner-module-vendors"

# 4. Detailed budget must render values, never an escaped template literal.
- tapOn:
    id: "planner-module-budget"
- assertVisible:
    id: "planner-budget-root"
- assertNotVisible: "{amount.toInt()}"
- back

# 5. Contributions are real non-monetary records, not an invented cash total.
- tapOn:
    id: "planner-module-contributions"
- assertVisible:
    id: "planner-contributions-root"
- assertVisible: "memories, blessings & stories"
- back

# 6. Documents/contracts are connected to the same graph; current account is honestly empty.
- scroll
- tapOn:
    id: "planner-module-documents"
- assertVisible:
    id: "planner-documents-root"
- assertVisible: "No contracts or documents recorded for this wedding."
- back

# 7. Guests / do not bind Git tests to private names.
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- assertVisible:
    id: "guests-search"
- assertNotVisible: "Guest G001"
- assertNotVisible: "Guest G011"

# 8. Pass / same real runtime guest graph.
- tapOn: "Pass"
- assertVisible:
    id: "pass-root"
- assertVisible:
    id: "wedding-pass-card"
- assertNotVisible: "Guest G011"

# 9. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
