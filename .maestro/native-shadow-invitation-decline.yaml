appId: pro.wewed.app
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Open the invitation from Home
- assertVisible:
    id: "home-root"
- tapOn:
    id: "home-open-invitation"

# 3. Splash -> Ivory Floral Gold invitation
- assertVisible:
    id: "guest-journey-splash"
- extendedWaitUntil:
    visible:
      id: "ivory-invitation-root"
    timeout: 5000

# 4. Decline RSVP
- tapOn:
    id: "ivory-rsvp-decline"

# 5. Confirm declined journey and no pass issuance
- assertVisible:
    id: "guest-journey-declined"
- assertVisible: "Thank you for responding"
- assertVisible: "Return to Wedding"
