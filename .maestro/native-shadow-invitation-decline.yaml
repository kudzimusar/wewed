appId: pro.wewed.app.dev
---
# A guest who declines gets no admission pass.
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "sanitized_shadow"
      wewed_shadow_account: "guest"
      wewed_invitation_token: "shadow-declined-guest"

- assertVisible: "WEWED"
- tapOn: "Sign In"
- assertVisible:
    id: "guest-shell-root"
- extendedWaitUntil:
    visible:
      id: "ivory-invitation-root"
    timeout: 7000
- scrollUntilVisible:
    element:
      id: "ivory-rsvp-decline"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "ivory-rsvp-decline"

- tapOn: "My Pass"
- assertVisible:
    id: "guest-pass-unavailable"
- assertNotVisible:
    id: "wedding-pass-qr"
