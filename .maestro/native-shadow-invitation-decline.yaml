appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Sign In
# 2. Open the guest's own invitation via its scoped link.
# Couple Home no longer opens an arbitrary guest's invitation (P0-11), so the invitation is
# reached the legitimate way: the credential-scoped link the guest actually receives.
- openLink: "wewed://invite/shadow_ref_charity_kudzie?rsvp=shadow-pending-guest"

# 3. Splash -> Ivory Floral Gold invitation
# Splash is intentionally transient; verify the destination after the branded transition.
- extendedWaitUntil:
    visible:
      id: "ivory-invitation-root"
    timeout: 5000

# 4. Open details, then decline RSVP.
# The invitation body scrolls; on shorter viewports the action area starts below the fold, so
# each control is scrolled into view rather than assumed to be on screen.
- scrollUntilVisible:
    element:
      id: "ivory-details-toggle"
    direction: DOWN
- tapOn:
    id: "ivory-details-toggle"
- scrollUntilVisible:
    element:
      id: "ivory-rsvp-decline"
    direction: DOWN
- tapOn:
    id: "ivory-rsvp-decline"

# 5. Confirm declined journey and no pass issuance
- assertVisible:
    id: "guest-journey-declined"
- assertVisible: "Thank you for responding"
- assertVisible: "Return to Wedding"
