appId: pro.wewed.app
---
# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Open Invitation
- tapOn:
    id: "home-open-invitation"
    optional: true
- tapOn:
    text: "Open Ivory Invitation"
    optional: true
- tapOn:
    text: "More"
    optional: true
- tapOn:
    text: "Open Ivory Invitation"
    optional: true
- tapOn:
    text: "Ivory Invitation"
    optional: true

# 3. Open Envelope
- assertVisible: "A PERSONAL INVITATION FOR"
- tapOn:
    id: "ivory-invitation-open"
    optional: true
- tapOn:
    text: "Open Invitation"
    optional: true

# 4. Decline RSVP
- scroll
- tapOn:
    id: "ivory-rsvp-decline"
    optional: true
- tapOn:
    text: "Decline with Regret"
    optional: true

# 5. Confirm response recorded without pass
- assertVisible: "Thank you for responding"
- assertVisible: "Return to Wedding"
