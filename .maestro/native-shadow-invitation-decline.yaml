appId: pro.wewed.app.dev
---
# A pending guest declines — and keeps their invitation.
#
# Declining is an answer, not an exit. The guest stays inside the same stationery; what changes is
# that the card stops asking and never offers a pass.
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

- openLink: "wewed://invite/shadow_ref_charity_kudzie?rsvp=shadow-pending-guest"

- extendedWaitUntil:
    visible:
      id: "invitation-trifold"
    timeout: 8000
- assertVisible:
    id: "invitation-closed-cover"

- tapOn:
    id: "invitation-open-button"
- extendedWaitUntil:
    visible:
      id: "invitation-panel-centre"
    timeout: 8000

- tapOn:
    id: "invitation-details-button"
- extendedWaitUntil:
    visible:
      id: "invitation-interactive-details"
    timeout: 5000

- tapOn:
    id: "invitation-cta-rsvp"
- extendedWaitUntil:
    visible:
      id: "invitation-rsvp-prompt"
    timeout: 5000
- tapOn:
    id: "invitation-rsvp-decline"

# The invitation is still the screen. A declined guest never gets a pass.
- extendedWaitUntil:
    visible:
      id: "invitation-interactive-details"
    timeout: 8000
- assertNotVisible:
    id: "invitation-cta-pass"

- tapOn:
    id: "invitation-back-to-invitation"
- extendedWaitUntil:
    visible:
      id: "invitation-response-recorded"
    timeout: 5000
- assertNotVisible:
    id: "invitation-rsvp-prompt"
