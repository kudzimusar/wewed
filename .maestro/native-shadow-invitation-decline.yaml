appId: pro.wewed.app.dev
---
# A pending guest declines — and keeps their invitation.
#
# Declining is an answer, not an exit. The guest stays inside the same stationery; what changes is
# that the card stops asking and never offers a pass.
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

- openLink: "wewed://invite/shadow_ref_charity_kudzie?rsvp=shadow-pending-guest"

- extendedWaitUntil:
    visible:
      id: "ivory-card-stage"
    timeout: 8000
- assertVisible:
    id: "ivory-card-closed"

- tapOn:
    id: "ivory-card-open-button"
- extendedWaitUntil:
    visible:
      id: "ivory-card-open"
    timeout: 8000

- tapOn:
    id: "ivory-card-details-button"
- extendedWaitUntil:
    visible:
      id: "ivory-card-details"
    timeout: 5000

- tapOn:
    id: "ivory-card-rsvp"
- extendedWaitUntil:
    visible:
      id: "ivory-card-rsvp-prompt"
    timeout: 5000
- tapOn:
    id: "ivory-card-rsvp-decline"

# The invitation is still the screen. A declined guest never gets a pass.
- extendedWaitUntil:
    visible:
      id: "ivory-card-details"
    timeout: 8000
- assertNotVisible:
    id: "ivory-card-view-pass"

- tapOn:
    id: "ivory-card-view-invitation"
- extendedWaitUntil:
    visible:
      id: "ivory-card-response-recorded"
    timeout: 5000
- assertNotVisible:
    id: "ivory-card-rsvp-prompt"
