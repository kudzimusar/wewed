appId: pro.wewed.app
---
# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Open Invitation from Home Action
- tapOn:
    id: "home-open-invitation"
    optional: true
- tapOn:
    text: "Open Ivory Invitation"
    optional: true
- tapOn:
    text: "More"
    optional: true
- tapOn:
    text: "Open Ivory Invitation"
    optional: true
- tapOn:
    text: "Ivory Invitation"
    optional: true

# 3. Open Envelope
- assertVisible: "A PERSONAL INVITATION FOR"
- tapOn:
    id: "ivory-invitation-open"
    optional: true
- tapOn:
    text: "Open Invitation"
    optional: true

# 4. Accept RSVP
- scroll
- tapOn:
    id: "ivory-rsvp-accept"
    optional: true
- tapOn:
    text: "Accept with Pleasure"
    optional: true

# 5. Confirm Wedding Pass established
- assertVisible: "RSVP Confirmed"
