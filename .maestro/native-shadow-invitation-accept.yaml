appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "shadow"

# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"

# 2. Open the invitation from the Home hero
- assertVisible:
    id: "home-root"
- tapOn:
    id: "home-open-invitation"

# 3. Splash -> Ivory Floral Gold invitation
# Splash is intentionally transient; verify the destination after the branded transition.
- extendedWaitUntil:
    visible:
      id: "ivory-invitation-root"
    timeout: 5000
- assertVisible: "You’re Invited"

# 4. Accept RSVP
# The invitation body scrolls; scroll the accept control into view on shorter viewports.
- scrollUntilVisible:
    element:
      id: "ivory-rsvp-accept"
    direction: DOWN
- tapOn:
    id: "ivory-rsvp-accept"

# 5. Confirm pass can be opened
- assertVisible: "RSVP Confirmed"
- scrollUntilVisible:
    element:
      id: "ivory-view-wedding-pass"
    direction: DOWN
