appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true
    arguments:
      wewed_native_env: "sanitized_shadow"

# 1. Sign In
- assertVisible: "WEWED"
- tapOn: "Sign In"
- assertVisible:
    id: "shadow-source-sanitized-shadow"

# 2. Home / Wedding Command Center
- assertVisible:
    id: "home-root"
- assertVisible: "OUR WEDDING JOURNEY"
- assertVisible:
    id: "home-continue-planning"
- assertVisible:
    id: "home-metrics"

# 3. Planner
- tapOn: "Plan"
- assertVisible:
    id: "planner-root"
- assertVisible: "Our Wedding Plan"
- assertNotVisible: "Wedding Planner"
- assertVisible:
    id: "planner-module-tasks"
- assertVisible:
    id: "planner-module-budget"
- assertVisible:
    id: "planner-module-vendors"

# 4. Guests
- tapOn: "Guests"
- assertVisible:
    id: "guests-root"
- assertVisible:
    id: "guests-search"
- assertVisible:
    id: "guests-filter-all"
- tapOn:
    id: "guests-filter-pending"
- assertVisible:
    id: "guests-root"

# 5. Pass
- tapOn: "Pass"
- assertVisible:
    id: "pass-root"
- assertVisible:
    id: "wedding-pass-card"
- assertVisible:
    id: "pass-open-maps"
- assertVisible: "Open in Maps"

# 6. More
- tapOn: "More"
- assertVisible:
    id: "more-root"
- assertVisible:
    id: "more-wedding-profile"
- assertVisible:
    id: "more-honeymoon"
