appId: pro.wewed.app
---
- launchApp:
    clearState: true

- assertVisible: "WEWED"
- tapOn: "Sign In"
- assertVisible: "Tariro & Shadreck"
- tapOn: "Switch"
- waitForAnimationToEnd

# 1. Check all personas visible in picker
- assertVisible: "Switch Persona"
- assertVisible: "Tariro & Shadreck"
- assertVisible: "Kudzi Musarurwa"
- assertVisible: "Chiedza Nyoni"
- assertVisible: "Kudzi Visuals"
- assertVisible: "Crown Sound Crew"
- assertVisible: "Gate A Usher"
- assertVisible: "Jane Doe"
- scrollUntilVisible:
    element: "Global Ops Admin"
    direction: DOWN
- assertVisible: "Global Ops Admin"

# 2. Switch to Professional Planner (Role: PLANNER)
- scrollUntilVisible:
    element: "Kudzi Musarurwa"
    direction: UP
- tapOn: "Kudzi Musarurwa"
- assertVisible: "Kudzi Musarurwa"
- assertVisible: "Professional Planner"

# 3. Switch to Day-of Coordinator (Role: COORDINATOR)
- tapOn: "Switch"
- tapOn: "Chiedza Nyoni"
- assertVisible: "Chiedza Nyoni"
- assertVisible: "Day-of Coordinator"

# 4. Switch to Vendor Owner (Role: VENDOR)
- tapOn: "Switch"
- tapOn: "Kudzi Visuals"
- assertVisible: "Kudzi Visuals"
- assertVisible: "Vendor & Staff"

# 5. Switch to Vendor Staff (Role: VENDOR)
- tapOn: "Switch"
- tapOn: "Crown Sound Crew"
- assertVisible: "Crown Sound Crew"
- assertVisible: "Vendor & Staff"

# 6. Switch to Gate Usher (Role: USHER)
- tapOn: "Switch"
- tapOn: "Gate A Usher"
- assertVisible: "Gate A Usher"
- assertVisible: "Gate Usher"

# 7. Switch to Attending Guest (Role: GUEST)
- tapOn: "Switch"
- tapOn: "Jane Doe"
- assertVisible: "Jane Doe"
- assertVisible: "Attending Guest"

# 8. Switch to Administrator (Role: ADMIN)
- tapOn: "Switch"
- scrollUntilVisible:
    element: "Global Ops Admin"
    direction: DOWN
- tapOn: "Global Ops Admin"
- assertVisible: "Global Ops Admin"
- assertVisible: "Administrator"

# 9. Switch cleanly back to Couple Owner (Role: COUPLE)
- tapOn: "Switch"
- scrollUntilVisible:
    element: "Tariro & Shadreck"
    direction: UP
- tapOn: "Tariro & Shadreck"
- assertVisible: "Tariro & Shadreck"
- assertVisible: "Couple"

