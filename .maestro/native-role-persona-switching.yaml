appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true

# Entry now runs through the Wewed welcome surface rather than a development login form with
# a role chooser and a shipped password. Shadow and UAT lanes enter through the environment
# affordance, which carries no credential and exists only where persona switching is permitted.
- assertVisible: "Wewed"
- tapOn:
    id: "welcome-shadow-entry"
- assertVisible: "Charity & Kudzie"
- tapOn:
    id: "role-switch-button"
- waitForAnimationToEnd

# 1. Check all personas visible in picker
- assertVisible: "Switch Persona"
- assertVisible: "Charity & Kudzie"
- assertVisible: "Eleven Eleven Testing"
- assertVisible: "Shadow Coordinator Test Role"
- assertVisible: "FAUME MEDIA"
- assertVisible: "MC Aloe The Avangelist"
- assertVisible: "Shadow Usher Test Role"
- assertVisible: "Shadow Guest Test Role"
- scrollUntilVisible:
    element: "Shadow Admin Test Role"
    direction: DOWN
- assertVisible: "Shadow Admin Test Role"

# 2. Switch to Professional Planner (Role: PLANNER)
- scrollUntilVisible:
    element: "Eleven Eleven Testing"
    direction: UP
- tapOn: "Eleven Eleven Testing"
# The role context bar carries the ROLE and the active wedding, not the persona's own name.
- assertVisible:
    id: "role-shell-planner"

# 3. Switch to Day-of Coordinator (Role: COORDINATOR)
- tapOn:
    id: "role-switch-button"
- tapOn: "Shadow Coordinator Test Role"
- assertVisible:
    id: "role-shell-coordinator"

# 4. Switch to Vendor Owner (Role: VENDOR)
- tapOn:
    id: "role-switch-button"
- tapOn: "FAUME MEDIA"
- assertVisible:
    id: "role-shell-vendor"

# 5. Switch to Vendor Staff (Role: VENDOR)
- tapOn:
    id: "role-switch-button"
- tapOn: "MC Aloe The Avangelist"
- assertVisible:
    id: "role-shell-vendor"

# 6. Switch to Gate Usher (Role: USHER)
- tapOn:
    id: "role-switch-button"
- tapOn: "Shadow Usher Test Role"
- assertVisible:
    id: "role-shell-usher"

# 7. Switch to Attending Guest (Role: GUEST)
- tapOn:
    id: "role-switch-button"
- tapOn: "Shadow Guest Test Role"
# Guest Entry Contract (master plan §6.3): a persona launch is an ordinary return, not an
# invitation arrival, so the Guest opens on Guest Home. Only an explicit link opens on the card
# (see native-shadow-deep-link-invitation / native-invitation-cta-touch).
- assertVisible:
    id: "role-shell-guest"

# 8. Switch to Administrator (Role: ADMIN)
- tapOn:
    id: "role-switch-button"
- scrollUntilVisible:
    element: "Shadow Admin Test Role"
    direction: DOWN
- tapOn: "Shadow Admin Test Role"
- assertVisible:
    id: "role-shell-admin"

# 9. Switch cleanly back to Couple Owner (Role: COUPLE)
- tapOn:
    id: "role-switch-button"
- scrollUntilVisible:
    element: "Charity & Kudzie"
    direction: UP
- tapOn: "Charity & Kudzie"
- assertVisible: "Charity & Kudzie"
- assertVisible:
    id: "role-shell-couple"

