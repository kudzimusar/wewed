appId: pro.wewed.app.dev
---
- launchApp:
    clearState: true

- assertVisible: "WEWED"
- tapOn: "Sign In"
- assertVisible: "Charity & Kudzie"
- tapOn: "Switch"
- waitForAnimationToEnd

# 1. Check all personas visible in picker
- assertVisible: "Switch Persona"
- assertVisible: "Charity & Kudzie"
- assertVisible: "Eleven Eleven Testing"
- assertVisible: "Faith Mutasa"
- assertVisible: "FAUME MEDIA"
- assertVisible: "MC Aloe"
- assertVisible: "Gate Usher"
- assertVisible: "Test Guest"
- scrollUntilVisible:
    element: "System Admin"
    direction: DOWN
- assertVisible: "System Admin"

# 2. Switch to Professional Planner (Role: PLANNER)
- scrollUntilVisible:
    element: "Eleven Eleven Testing"
    direction: UP
- tapOn: "Eleven Eleven Testing"
- assertVisible: "Eleven Eleven Testing"
- assertVisible: "Professional Planner"

# 3. Switch to Day-of Coordinator (Role: COORDINATOR)
- tapOn: "Switch"
- tapOn: "Faith Mutasa"
- assertVisible: "Faith Mutasa"
- assertVisible: "Day-of Coordinator"

# 4. Switch to Vendor Owner (Role: VENDOR)
- tapOn: "Switch"
- tapOn: "FAUME MEDIA"
- assertVisible: "FAUME MEDIA"
- assertVisible: "Vendor & Staff"

# 5. Switch to Vendor Staff (Role: VENDOR)
- tapOn: "Switch"
- tapOn: "MC Aloe"
- assertVisible: "MC Aloe"
- assertVisible: "Vendor & Staff"

# 6. Switch to Gate Usher (Role: USHER)
- tapOn: "Switch"
- tapOn: "Gate Usher"
- assertVisible: "Gate Usher"
- assertVisible: "Gate Usher"

# 7. Switch to Attending Guest (Role: GUEST)
- tapOn: "Switch"
- tapOn: "Test Guest"
- assertVisible: "Test Guest"
- assertVisible: "Attending Guest"

# 8. Switch to Administrator (Role: ADMIN)
- tapOn: "Switch"
- scrollUntilVisible:
    element: "System Admin"
    direction: DOWN
- tapOn: "System Admin"
- assertVisible: "System Admin"
- assertVisible: "Administrator"

# 9. Switch cleanly back to Couple Owner (Role: COUPLE)
- tapOn: "Switch"
- scrollUntilVisible:
    element: "Charity & Kudzie"
    direction: UP
- tapOn: "Charity & Kudzie"
- assertVisible: "Charity & Kudzie"
- assertVisible: "Couple"

