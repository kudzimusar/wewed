appId: pro.wewed.app
tags:
  - android
  - authenticated-smoke
---
- launchApp:
    clearState: true
# The first authenticated launch can also hit a cold Metro cache on a fresh CI
# runner. Give the native shell enough time to finish bundling before judging
# the sign-in route; the authenticated journey and its assertions stay intact.
- extendedWaitUntil:
    visible: "Your wedding world, in your hand."
    timeout: 120000
- tapOn: "Email"
- inputText: ${WEWED_MAESTRO_EMAIL}
- tapOn: "Password"
- inputText: ${WEWED_MAESTRO_PASSWORD}
- tapOn: "Sign in to Wewed"
- extendedWaitUntil:
    visible: "Wedding pulse"
    timeout: 30000
# Wedding Pulse renders the canonical wedding title together with a location
# suffix (for example " · Harare"). Keep verifying the exact wedding identity
# while allowing that legitimate presentation suffix in the accessibility text.
- assertVisible: "Aurora & Blake — E2E Wedding.*"
- assertVisible: "Open tasks"
- assertVisible: "High priority"

# React Navigation exposes each bottom-tab touch target with accessibility text
# shaped like "<icon>, <label>" while the nested label itself is non-clickable.
# Anchor the parent touch-surface matcher so it cannot accidentally match nearby
# content such as the greeting text "Good to see you, Planner.".
- tapOn: "^.*, Plan$"
- extendedWaitUntil:
    visible: "Planning command centre"
    timeout: 15000

- tapOn: "Tasks"
- extendedWaitUntil:
    visible: "What happens next?"
    timeout: 15000
- assertVisible: "Any priority"
- tapOn: "High"
- assertVisible: "High"
- back

- tapOn: "Guests"
- extendedWaitUntil:
    visible: "People, not rows."
    timeout: 15000
- assertVisible: "Guests"
- scrollUntilVisible:
    element:
      text: "Seating tables"
    direction: DOWN
    timeout: 15000
- assertVisible: "Seating tables"
- back

- tapOn: "Budget"
- extendedWaitUntil:
    visible: "Know where the money is going."
    timeout: 15000
- assertVisible: "Outstanding"
- scrollUntilVisible:
    element:
      text: "Contributions"
    direction: DOWN
    timeout: 15000
- tapOn: "Contributions"
- extendedWaitUntil:
    visible: "Give credit where it belongs."
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Contribution ledger"
    direction: DOWN
    timeout: 15000
- assertVisible: "Contribution ledger"
- back
- back

- tapOn: "^.*, Messages$"
- extendedWaitUntil:
    visible: "Wewed Messages"
    timeout: 15000

- tapOn: "^.*, Vendors$"
- extendedWaitUntil:
    visible: "Find people who can actually deliver."
    timeout: 15000
- assertVisible: "Search vendors & venues"
- assertVisible: "Wedding services"

- tapOn: "^.*, More$"
- extendedWaitUntil:
    visible: "More"
    timeout: 15000
- assertVisible: "Aurora & Blake — E2E Wedding"
- scrollUntilVisible:
    element:
      text: "Cedar & Drew — Isolation Wedding"
    direction: DOWN
    timeout: 15000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Wedding pulse"
    timeout: 30000
- assertVisible: "Cedar & Drew — Isolation Wedding.*"

- tapOn: "^.*, More$"
- extendedWaitUntil:
    visible: "More"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Aurora & Blake — E2E Wedding"
    direction: DOWN
    timeout: 15000
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Wedding pulse"
    timeout: 30000
- assertVisible: "Aurora & Blake — E2E Wedding.*"
