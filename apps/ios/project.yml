name: Wewed
options:
  minimumXcodeGenVersion: 2.40.0
  xcodeVersion: "16.2"
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  UAT: release
  Release: release
packages:
  WewedIOS:
    path: .
targets:
  Wewed:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wewed/AppTarget
        excludes:
          - Info.plist
          - Wewed.entitlements
    dependencies:
      - package: WewedIOS
        product: WewedKit
    # P1 XcodeGen preservation: `info:` and `entitlements:` make XcodeGen *generate* those files,
    # which silently overwrote the committed Info.plist and entitlements — dropping the wewed URL
    # scheme, NSCameraUsageDescription and applinks:wewed.pro. Referencing them through build
    # settings instead means XcodeGen consumes the committed files without rewriting them.
    settings:
      base:
        INFOPLIST_FILE: Wewed/AppTarget/Info.plist
        # The app icon and the launch-screen brand mark live in the target's asset catalogue.
        # Without ASSETCATALOG_COMPILER_APPICON_NAME the home screen shows the grey placeholder.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Wewed/AppTarget/Wewed.entitlements
        PRODUCT_NAME: Wewed
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app.dev
        UAT:
          PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app.uatdev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app
    scheme:
      gatherCoverageData: false
      testTargets:
        - GuestProfileUITests

  GuestProfileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GuestProfileUITests
    dependencies:
      - target: Wewed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app.dev.guestuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wewed
        CODE_SIGN_STYLE: Automatic
