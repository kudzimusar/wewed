name: Wewed
options:
  minimumXcodeGenVersion: 2.40.0
  xcodeVersion: "16.2"
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  UAT: release
  Release: release
packages:
  WewedIOS:
    path: .
targets:
  Wewed:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wewed/AppTarget
        excludes:
          - Info.plist
          - Wewed.entitlements
    dependencies:
      - package: WewedIOS
        product: WewedKit
    info:
      path: Wewed/AppTarget/Info.plist
    entitlements:
      path: Wewed/AppTarget/Wewed.entitlements
    settings:
      base:
        PRODUCT_NAME: Wewed
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app.dev
        UAT:
          PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app.uatdev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: pro.wewed.app
    scheme:
      gatherCoverageData: false
