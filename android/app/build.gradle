import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.application'
}

def uploadStorePath = System.getenv('WEWED_UPLOAD_STORE_FILE')
def uploadStorePassword = System.getenv('WEWED_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('WEWED_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('WEWED_UPLOAD_KEY_PASSWORD')
def hasUploadSigning = uploadStorePath && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

def uatPlayVersionCode = (System.getenv('WEWED_ANDROID_VERSION_CODE') ?: '3').toInteger()
def uatPlayVersionName = System.getenv('WEWED_ANDROID_VERSION_NAME') ?: '3'
def productionVersionCodeRaw = System.getenv('WEWED_ANDROID_PRODUCTION_VERSION_CODE')
def productionVersionName = System.getenv('WEWED_ANDROID_PRODUCTION_VERSION_NAME')
if ((productionVersionCodeRaw && !productionVersionName) || (!productionVersionCodeRaw && productionVersionName)) {
    throw new GradleException('WEWED_ANDROID_PRODUCTION_VERSION_CODE and WEWED_ANDROID_PRODUCTION_VERSION_NAME must be set together')
}
def productionVersionCode = productionVersionCodeRaw ? productionVersionCodeRaw.toInteger() : null
if (productionVersionCode != null && productionVersionCode < 1) {
    throw new GradleException('WEWED_ANDROID_PRODUCTION_VERSION_CODE must be a positive integer')
}
def uatResumeOrigin = System.getenv('WEWED_ANDROID_UAT_RESUME_ORIGIN') ?: 'https://uat.wewed.pro'
if (!(uatResumeOrigin in ['https://uat.wewed.pro', 'http://10.0.2.2:3000'])) {
    throw new GradleException("Unsupported WEWED_ANDROID_UAT_RESUME_ORIGIN: " + uatResumeOrigin)
}

def twaManifest = [
    applicationId: 'pro.wewed.app',
    hostName: 'wewed.pro', // The domain being opened in the TWA.
    launchUrl: '/app?source=google-play', // The start path for the TWA. Must be relative to the domain.
    name: 'Wewed', // The application name.
    launcherName: 'Wewed', // The name shown on the Android Launcher.
    themeColor: '#BF9B5F', // The color used for the status bar.
    themeColorDark: '#000000', // The color used for the dark status bar.
    navigationColor: '#000000', // The color used for the navigation bar.
    navigationColorDark: '#000000', // The dark navbar color.
    navigationDividerColor: '#000000', // The navbar divider color.
    navigationDividerColorDark: '#000000', // The dark navbar divider color.
    backgroundColor: '#FBF6EE', // The color used for the splash screen background.
    enableNotifications: true,
    shortcuts: [[name:'Notifications', short_name:'Notifications', url:'https://wewed.pro/notifications', icon:'shortcut_0'],[name:'Calendar', short_name:'Calendar', url:'https://wewed.pro/calendar', icon:'shortcut_1']],
    splashScreenFadeOutDuration: 300,
    generatorApp: 'bubblewrap-cli',
    fallbackType: 'customtabs',
    enableSiteSettingsShortcut: 'true',
    orientation: 'any',
]

android {
    buildFeatures { buildConfig true }
    compileSdkVersion 36
    namespace "pro.wewed.app"
    defaultConfig {
        applicationId "pro.wewed.app"
        buildConfigField "boolean", "UAT", "false"
        buildConfigField "String", "INVITATION_RESUME_ORIGIN", '"https://wewed.pro"'
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "2"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName

        def launchUrl = "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "launchUrl", launchUrl
        resValue "string", "webManifestUrl", 'https://wewed.pro/manifest.json'
        resValue "string", "fullScopeUrl", 'https://wewed.pro/'
        resValue "string", "hostName", twaManifest.hostName
        resValue "color", "colorPrimary", twaManifest.themeColor
        resValue "color", "colorPrimaryDark", twaManifest.themeColorDark
        resValue "color", "navigationColor", twaManifest.navigationColor
        resValue "color", "navigationColorDark", twaManifest.navigationColorDark
        resValue "color", "navigationDividerColor", twaManifest.navigationDividerColor
        resValue "color", "navigationDividerColorDark", twaManifest.navigationDividerColorDark
        resValue "color", "backgroundColor", twaManifest.backgroundColor
        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()

        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            resValue "string", "shortcut_name_$index", "$shortcut.name"
            resValue "string", "shortcut_short_name_$index", "$shortcut.short_name"
        }

        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()
        resValue "string", "generatorApp", twaManifest.generatorApp
        resValue "string", "fallbackType", twaManifest.fallbackType
        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut
        resValue "string", "orientation", twaManifest.orientation
    }

    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile file(uploadStorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        // Local builds never share the Play identity (pro.wewed.app): a debug-signed APK
        // installed over the Play copy blocks every Play update on that device. The
        // suffix is also distinct from pro.wewed.app.dev, the native Compose debug app.
        debug {
            applicationIdSuffix ".twadev"
            versionNameSuffix "-twadev"
            resValue "string", "providerAuthority", "pro.wewed.app.twadev.fileprovider"
        }
        uat {
            initWith debug
            matchingFallbacks = ['debug']
            applicationIdSuffix ".uatdev"
            versionNameSuffix "-uatdev"
            resValue "string", "providerAuthority", "pro.wewed.app.uatdev.fileprovider"
            buildConfigField "boolean", "UAT", "true"
            buildConfigField "String", "INVITATION_RESUME_ORIGIN", "\"${uatResumeOrigin}\""
            resValue "string", "appName", "Wewed UAT"
            resValue "string", "launcherName", "Wewed UAT"
            resValue "string", "hostName", "uat.wewed.pro"
            resValue "string", "launchUrl", "https://uat.wewed.pro/app?source=android-uat"
            resValue "string", "webManifestUrl", "https://uat.wewed.pro/manifest.json"
            resValue "string", "fullScopeUrl", "https://uat.wewed.pro/"
        }
        release {
            minifyEnabled true
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
        }
        uatPlay {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField "boolean", "UAT", "true"
            buildConfigField "String", "INVITATION_RESUME_ORIGIN", '"https://uat.wewed.pro"'
            resValue "string", "appName", "Wewed UAT"
            resValue "string", "launcherName", "Wewed UAT"
            resValue "string", "hostName", "uat.wewed.pro"
            resValue "string", "launchUrl", "https://uat.wewed.pro/app?source=google-play-uat"
            resValue "string", "webManifestUrl", "https://uat.wewed.pro/manifest.json"
            resValue "string", "fullScopeUrl", "https://uat.wewed.pro/"
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

androidComponents {
    // Google Play automatic protection rejects every Play artifact below API 24.
    // Keep local/debug compatibility at API 21; raise only the signed Play wrapper.
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        variantBuilder.minSdk = 24
    }
    beforeVariants(selector().withBuildType('uatPlay')) { variantBuilder ->
        // The closed-testing UAT wrapper is likewise protected by Play.
        variantBuilder.minSdk = 24
    }
    onVariants(selector().withBuildType('uatPlay')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(uatPlayVersionCode)
            output.versionName.set("${uatPlayVersionName}-uat")
        }
    }
    // A Play production wrapper has a different trusted-web host and resume origin
    // from the UAT wrapper. Only the release variant can take this explicit override.
    onVariants(selector().withBuildType('release')) { variant ->
        if (productionVersionCode != null) {
            variant.outputs.each { output ->
                output.versionCode.set(productionVersionCode)
                output.versionName.set(productionVersionName)
            }
        }
    }
}

task generateShorcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    twaManifest.shortcuts.eachWithIndex { s, i ->
        assert s.name != null, 'Missing `name` in shortcut #' + i
        assert s.short_name != null, 'Missing `short_name` in shortcut #' + i
        assert s.url != null, 'Missing `icon` in shortcut #' + i
        assert s.icon != null, 'Missing `url` in shortcut #' + i
    }

    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")
    def xmlWriter = new StringWriter()
    def xmlMarkup = new MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))

    xmlMarkup
        .'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
            twaManifest.shortcuts.eachWithIndex { s, i ->
                'shortcut'(
                        'android:shortcutId': 'shortcut' + i,
                        'android:enabled': 'true',
                        'android:icon': '@drawable/' + s.icon,
                        'android:shortcutShortLabel': '@string/shortcut_short_name_' + i,
                        'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                    'intent'(
                            'android:action': 'android.intent.action.MAIN',
                            'android:targetPackage': twaManifest.applicationId,
                            'android:targetClass': twaManifest.applicationId + '.LauncherActivity',
                            'android:data': s.url)
                    'categories'('android:name': 'android.intent.category.LAUNCHER')
                }
            }
        }
    shortcutsFile.text = xmlWriter.toString() + '\n'
}

preBuild.dependsOn(generateShorcutsFile)

repositories {
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}
